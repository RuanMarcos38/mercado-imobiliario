name: Temporary diagnose MercadoImobi login

on:
  push:
    branches: [feature/atendimento-suri-senior]
    paths:
      - ".github/workflows/temporary-diagnose-login.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atendimento-suri-senior
          fetch-depth: 0
      - name: Replace obsolete attendance realtime subscriptions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/_authenticated/atendimento.tsx')
          text = p.read_text()
          text = text.replace('''      .on(
                "postgres_changes",
                { event: "*", schema: "public", table: "whatsapp_attendant_presence" },
                () => {
                  if (showRealtimePanel) void dashboard.refetch();
                },
              )
              .on(
                "postgres_changes",
                { event: "*", schema: "public", table: "whatsapp_attendance_sessions" },
                () => {
                  if (showRealtimePanel) void dashboard.refetch();
                },
              )''', '''      .on(
                "postgres_changes",
                { event: "*", schema: "public", table: "system_events" },
                () => {
                  void conversations.refetch();
                  if (showRealtimePanel) void dashboard.refetch();
                },
              )''', 1)
          if 'whatsapp_attendant_presence' in text or 'whatsapp_attendance_sessions' in text:
              raise SystemExit('obsolete attendance realtime subscriptions still present')
          p.write_text(text)
          PY
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/atendimento.tsx
          if git diff --cached --quiet; then
            echo "No source change required."
            exit 0
          fi
          git commit -m "fix: use system events for attendance realtime"
          git push origin HEAD:feature/atendimento-suri-senior
