name: Apply urgent search and admin presence

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply idempotent patch
        run: python scripts/apply-urgent-search-presence.py
      - run: npm ci
      - run: npx prettier --write src/components/property/PropertyWorkspace.tsx src/lib/property-search.functions.ts src/lib/backend-auditor.functions.ts src/routes/_authenticated.tsx src/routes/_authenticated/admin/usuarios.tsx src/lib/user-activity.functions.ts
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - name: Commit validated changes to PR branch
        run: |
          git config user.name "RuanMarcos38"
          git config user.email "ruanessencia8@gmail.com"
          git add src
          if git diff --cached --quiet; then
            echo "Source already patched and validated."
            exit 0
          fi
          git commit -m "feat: busca 100 por pagina, diversidade regional e usuarios online"
          git push origin HEAD:${{ github.head_ref }}
