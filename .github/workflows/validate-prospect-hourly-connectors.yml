name: Validate prospect hourly connectors

on:
  push:
    branches: [feat/prospect-radar-hourly-connectors-20260825]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PROJECT_ID: example
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply isolated prospect patch
        run: python .github/scripts/apply-prospect-hourly-connectors.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format isolated files
        run: npx prettier --write src/lib/prospect-radar.server.ts src/lib/prospect-leads.functions.ts src/routes/_authenticated/prospectos.tsx src/routes/api/public/jobs/prospect-radar.tsx tests/prospect-leads.test.ts .github/workflows/hourly-prospect-radar.yml
      - name: Verify safety and scope
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'Varredura automática nacional a cada 1 hora' src/routes/_authenticated/prospectos.tsx >/dev/null
          grep -F 'commentThreads' src/lib/prospect-radar.server.ts >/dev/null
          grep -F 'places.googleapis.com/v1/places:searchText' src/lib/prospect-radar.server.ts >/dev/null
          grep -F 'contactIsProfessional: false' src/lib/prospect-radar.server.ts >/dev/null
          grep -F 'x-mercadoimobi-job-key' src/routes/api/public/jobs/prospect-radar.tsx >/dev/null
          test ! -e supabase/migrations/20260826_prospect_radar.sql
      - name: Lint
        run: npm run lint
      - name: Prospect tests
        run: npx vitest run tests/prospect-leads.test.ts tests/tenant-isolation.test.ts tests/critical-flows.spec.ts
      - name: Full regression tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit validated product changes only
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- src/routeTree.gen.ts 2>/dev/null || true
          git checkout HEAD -- public/mcp/openapi.json 2>/dev/null || true
          git checkout HEAD -- public/mcp/llms.txt 2>/dev/null || true
          git checkout HEAD -- 'src/routes/[.mcp]/invoke-tool/$tool.ts' 2>/dev/null || true
          git checkout HEAD -- 'src/routes/[.mcp]/list-tools.ts' 2>/dev/null || true
          git checkout HEAD -- 'src/routes/[.well-known]/oauth-protected-resource.ts' 2>/dev/null || true
          git checkout HEAD -- src/routes/mcp.ts 2>/dev/null || true
          changed="$(git diff --name-only | sort)"
          allowed='src/lib/prospect-leads.functions.ts
          src/routes/_authenticated/prospectos.tsx'
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "$allowed" | sed 's/^ *//' | grep -Fx "$file" >/dev/null || { echo "Unexpected generated diff: $file"; exit 1; }
          done <<< "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/prospect-leads.functions.ts src/routes/_authenticated/prospectos.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'feat: conectar radar público e ativar snapshot horário'
            git push origin HEAD:${{ github.ref_name }}
          fi
