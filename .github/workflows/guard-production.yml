name: MercadoImobi production guard

on:
  push:
    branches: [production]

permissions:
  contents: write

jobs:
  guard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Reject direct production mutation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: production

      - name: Restore production to previous approved SHA
        shell: bash
        env:
          PREVIOUS_PRODUCTION_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git fetch origin production

          if [ -z "${PREVIOUS_PRODUCTION_SHA:-}" ] || [ "$PREVIOUS_PRODUCTION_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Cannot determine the previously approved production SHA; refusing to replace production with main."
            exit 1
          fi

          echo "Direct production push by ${GITHUB_ACTOR} is not an approved promotion."
          echo "Restoring production to its previous approved SHA: ${PREVIOUS_PRODUCTION_SHA}"
          git push --force-with-lease origin "${PREVIOUS_PRODUCTION_SHA}:refs/heads/production"
