name: Validate Asaas gateway integration

on:
  push:
    branches: [feat/asaas-gateway-20260825]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PROJECT_ID: example
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format check
        run: npx prettier --check src/lib/asaas-billing.server.ts src/lib/billing.functions.ts src/routes/api/public/hooks/asaas.tsx tests/asaas-billing.test.ts
      - name: Lint
        run: npm run lint
      - name: Critical regression tests
        run: npx vitest run tests/critical-flows.spec.ts tests/platform-buttons.test.ts
      - name: Asaas unit tests
        run: npx vitest run tests/asaas-billing.test.ts
      - name: Production build
        run: npm run build
