name: Promote validated Asaas Pix checkout

on:
  push:
    branches: [ops/promote-asaas-pix-new-tab-20260825]

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact isolated billing diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin production fix/asaas-pix-new-tab-20260825
          changed="$(git diff --name-only origin/production..origin/fix/asaas-pix-new-tab-20260825 | sort)"
          expected="$(printf '%s\n' 'src/lib/asaas-billing.server.ts' 'src/lib/billing.functions.ts' 'src/routes/_authenticated/assinatura.tsx' 'tests/asaas-billing.test.ts' | sort)"
          test "$changed" = "$expected" || { echo "Unexpected diff:"; echo "$changed"; exit 1; }
          git show origin/fix/asaas-pix-new-tab-20260825:src/lib/asaas-billing.server.ts | grep -F 'billingType,' >/dev/null
          git show origin/fix/asaas-pix-new-tab-20260825:src/lib/asaas-billing.server.ts | grep -F 'normalized === "PIX"' >/dev/null
          git show origin/fix/asaas-pix-new-tab-20260825:src/routes/_authenticated/assinatura.tsx | grep -F 'Pix (QR Code)' >/dev/null
          git show origin/fix/asaas-pix-new-tab-20260825:src/routes/_authenticated/assinatura.tsx | grep -F 'window.open("about:blank", "_blank")' >/dev/null
          git merge-base --is-ancestor origin/production origin/fix/asaas-pix-new-tab-20260825

      - name: Promote validated branch to production as GitHub Actions bot
        shell: bash
        run: |
          set -euo pipefail
          git push origin origin/fix/asaas-pix-new-tab-20260825:refs/heads/production
