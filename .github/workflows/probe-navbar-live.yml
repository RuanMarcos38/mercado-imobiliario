name: Probe navbar contrast live

on:
  push:
    branches: [ops/probe-navbar-live-20260825]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify deployed stylesheet contains navbar light-mode fix
        shell: python
        run: |
          import re, time, urllib.request
          base='https://r2rmarketingdigital-mercadomobi.ke4n49.easypanel.host'
          marker='bg-[#06101c]/88'
          last=''
          for attempt in range(1, 31):
              try:
                  req=urllib.request.Request(base+'/', headers={'User-Agent':'Mozilla/5.0'})
                  html=urllib.request.urlopen(req, timeout=15).read().decode('utf-8','replace')
                  css_paths=re.findall(r'(?:href|src)=["\']([^"\']+\.css(?:\?[^"\']*)?)["\']', html)
                  checked=[]
                  for path in css_paths:
                      url=path if path.startswith('http') else base+('/' if not path.startswith('/') else '')+path
                      css=urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'}), timeout=15).read().decode('utf-8','replace')
                      checked.append(url)
                      if marker in css and 'light-mode' in css:
                          print('LIVE_NAVBAR_FIX_OK', url)
                          raise SystemExit(0)
                  last=f'attempt={attempt} css={checked}'
              except SystemExit:
                  raise
              except Exception as e:
                  last=f'attempt={attempt} error={type(e).__name__}: {e}'
              print(last)
              time.sleep(10)
          raise SystemExit('LIVE_NAVBAR_FIX_NOT_FOUND '+last)
