name: Deploy prospect radar once

on:
  push:
    branches:
      - ops/promote-prospect-radar-20260825

permissions:
  contents: read

jobs:
  deploy-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
      EASYPANEL_DEPLOY_TRIGGER_URL: ${{ secrets.EASYPANEL_DEPLOY_TRIGGER_URL }}
      DEPLOY_TRIGGER_URL: ${{ secrets.DEPLOY_TRIGGER_URL }}
      EASYPANEL_PUBLIC_URL: ${{ vars.EASYPANEL_PUBLIC_URL }}
      EXPECTED_SUPABASE_PROJECT_ID: ${{ vars.MERCADOIMOBI_SUPABASE_PROJECT_ID || 'uwzfgksmnqgaxtscwxow' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify production contains the validated radar
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin production feat/prospect-radar-social-20260825
          test "$(git rev-parse origin/production)" = "$(git rev-parse origin/feat/prospect-radar-social-20260825)"
          git show origin/production:src/routes/_authenticated/prospectos.tsx | grep -F 'Prospecção IA em redes sociais públicas' >/dev/null
          git show origin/production:src/lib/prospect-leads.functions.ts | grep -F 'Para perfis de consumidores, retorne somente nome/identificador público' >/dev/null
      - name: Trigger EasyPanel deployment when hook exists
        shell: bash
        run: |
          set -euo pipefail
          URL="${EASYPANEL_DEPLOY_URL:-${EASYPANEL_DEPLOY_TRIGGER_URL:-${DEPLOY_TRIGGER_URL:-}}}"
          if [ -z "$URL" ]; then
            echo "::notice::No explicit EasyPanel hook configured; relying on the GitHub-linked production branch."
            exit 0
          fi
          if curl -fsS --connect-timeout 10 --max-time 60 "$URL" -o /tmp/deploy-response.txt; then
            echo "EasyPanel deploy requested with GET."
          else
            curl -fsS -X POST --connect-timeout 10 --max-time 60 "$URL" -o /tmp/deploy-response.txt
            echo "EasyPanel deploy requested with POST."
          fi
      - name: Verify live backend and prospect route
        shell: bash
        run: |
          set -euo pipefail
          BASE="${EASYPANEL_PUBLIC_URL:-https://r2rmarketingdigital-mercadomobi.ke4n49.easypanel.host}"
          BASE="${BASE%/}"
          ready=0
          for attempt in $(seq 1 36); do
            code="$(curl -sS -o /tmp/status.json -w '%{http_code}' --connect-timeout 6 --max-time 12 "$BASE/api/public/status" || true)"
            if [ "$code" = "200" ]; then
              if EXPECTED_SUPABASE_PROJECT_ID="$EXPECTED_SUPABASE_PROJECT_ID" node - <<'NODE'
          const fs = require('fs');
          try {
            const s = JSON.parse(fs.readFileSync('/tmp/status.json','utf8'));
            const ok = s.status === 'operational'
              && s.search === 'available'
              && String(s.supabaseProjectId || '') === String(process.env.EXPECTED_SUPABASE_PROJECT_ID || '')
              && s.runtime?.supabaseAdmin === 'configured'
              && s.runtime?.ai === 'configured';
            process.exit(ok ? 0 : 1);
          } catch { process.exit(1); }
          NODE
              then ready=1; break; fi
            fi
            sleep 5
          done
          test "$ready" = "1" || { echo "::error::Backend did not remain operational."; exit 1; }
          route_code="$(curl -sS -o /tmp/prospectos.html -w '%{http_code}' --connect-timeout 6 --max-time 15 "$BASE/prospectos" || true)"
          case "$route_code" in 200|302|303|307|308) ;; *) echo "::error::Prospect route unavailable, HTTP=$route_code"; exit 1;; esac
          echo "LIVE_OK backend=200 prospectos=$route_code"
