name: Add property source filter
on:
  push:
    branches: [main]
    paths: [".github/workflows/add-source-filter.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add source filter
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/property/PropertyWorkspace.tsx')
          s=p.read_text()
          s=s.replace('  propertyType: string;\n  minPrice:', '  propertyType: string;\n  sourcePortal: string;\n  minPrice:', 1)
          s=s.replace('  propertyType: "",\n  minPrice:', '  propertyType: "",\n  sourcePortal: "",\n  minPrice:', 1)
          s=s.replace('    propertyType: filters.propertyType || undefined,\n    minPrice:', '    propertyType: filters.propertyType || undefined,\n    sourcePortal: filters.sourcePortal || undefined,\n    minPrice:', 1)
          needle='''                  <Field label="Ordenar por">\n                    <select'''
          insert='''                  <Field label="Fonte">\n                    <input\n                      value={filters.sourcePortal}\n                      onChange={(event) => setFilters({ ...filters, sourcePortal: event.target.value })}\n                      placeholder="Ex.: MRV, QuintoAndar, CAIXA"\n                    />\n                  </Field>\n                  <Field label="Ordenar por">\n                    <select'''
          if needle not in s: raise SystemExit('source filter insertion point not found')
          s=s.replace(needle, insert, 1)
          s=s.replace('                  propertyType: criteria.propertyType ?? "",\n                  minPrice:', '                  propertyType: criteria.propertyType ?? "",\n                  sourcePortal: criteria.sourcePortal ?? "",\n                  minPrice:', 1)
          p.write_text(s)

          t=Path('tests/platform-buttons.test.ts')
          q=t.read_text()
          q=q.replace('expect(workspace).toContain("discount_percent");', 'expect(workspace).toContain("sourcePortal");\n    expect(workspace).toContain("Fonte");\n    expect(workspace).toContain("discount_percent");', 1)
          t.write_text(q)
          PY
          npx prettier --write src/components/property/PropertyWorkspace.tsx tests/platform-buttons.test.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/property/PropertyWorkspace.tsx tests/platform-buttons.test.ts
          git commit -m "Add source filter to national property search"
          git push origin HEAD:main
