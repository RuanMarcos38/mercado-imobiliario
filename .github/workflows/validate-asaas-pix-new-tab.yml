name: Validate Asaas Pix and new-tab checkout

on:
  push:
    branches: [fix/asaas-pix-new-tab-20260825]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PROJECT_ID: example
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply isolated Asaas Pix and new-tab changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected marker not found in {path}: {old[:120]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one marker in {path}, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          asaas = 'src/lib/asaas-billing.server.ts'
          replace_once(
              asaas,
              'type JsonObject = Record<string, unknown>;\n\nexport type AsaasPlanInput = {',
              'type JsonObject = Record<string, unknown>;\n\nexport type AsaasBillingType = "UNDEFINED" | "PIX" | "BOLETO" | "CREDIT_CARD";\n\nexport type AsaasPlanInput = {',
          )
          replace_once(
              asaas,
              'export function asaasFirstCycleValue(plan: AsaasPlanInput) {\n  const monthly = Number(plan.price_monthly ?? 0);\n  const onboarding = Number(plan.onboarding_fee ?? 0);\n  return Math.round((monthly + Math.max(0, onboarding)) * 100) / 100;\n}\n\nfunction asaasSafeName',
              'export function asaasFirstCycleValue(plan: AsaasPlanInput) {\n  const monthly = Number(plan.price_monthly ?? 0);\n  const onboarding = Number(plan.onboarding_fee ?? 0);\n  return Math.round((monthly + Math.max(0, onboarding)) * 100) / 100;\n}\n\nexport function normalizeAsaasBillingType(value: unknown): AsaasBillingType {\n  const normalized = String(value ?? "").trim().toUpperCase();\n  if (\n    normalized === "PIX" ||\n    normalized === "BOLETO" ||\n    normalized === "CREDIT_CARD" ||\n    normalized === "UNDEFINED"\n  ) {\n    return normalized;\n  }\n  return "UNDEFINED";\n}\n\nfunction asaasSafeName',
          )
          replace_once(
              asaas,
              '  input: {\n    origin: string;\n    userId: string;\n    plan: AsaasPlanInput;\n  },\n  externalReference: string,',
              '  input: {\n    origin: string;\n    userId: string;\n    plan: AsaasPlanInput;\n    paymentMethod?: AsaasBillingType;\n  },\n  externalReference: string,',
          )
          replace_once(
              asaas,
              '      : `Assinatura mensal MercadoImobi — ${input.plan.name}.`;\n  const payload = await asaasRequest(config, "/paymentLinks", {',
              '      : `Assinatura mensal MercadoImobi — ${input.plan.name}.`;\n  const billingType = normalizeAsaasBillingType(input.paymentMethod);\n  const payload = await asaasRequest(config, "/paymentLinks", {',
          )
          replace_once(asaas, '      billingType: "UNDEFINED",', '      billingType,')
          replace_once(
              asaas,
              '      dueDateLimitDays: 5,',
              '      ...(billingType === "BOLETO" || billingType === "UNDEFINED"\n        ? { dueDateLimitDays: 5 }\n        : {}),',
          )
          replace_once(
              asaas,
              '  plan: AsaasPlanInput;\n  customerEmail?: string | null;\n}) {',
              '  plan: AsaasPlanInput;\n  paymentMethod?: AsaasBillingType;\n  customerEmail?: string | null;\n}) {',
          )
          replace_once(
              asaas,
              '  asaasFirstCycleValue,\n};',
              '  asaasFirstCycleValue,\n  normalizeAsaasBillingType,\n};',
          )

          billing = 'src/lib/billing.functions.ts'
          replace_once(
              billing,
              'import { asaasConfigured, createAsaasSubscriptionCheckout } from "@/lib/asaas-billing.server";',
              'import {\n  asaasConfigured,\n  createAsaasSubscriptionCheckout,\n  type AsaasBillingType,\n} from "@/lib/asaas-billing.server";',
          )
          replace_once(
              billing,
              'const checkoutSchema = z.object({ planId: z.string().uuid() });',
              'const checkoutSchema = z.object({\n  planId: z.string().uuid(),\n  paymentMethod: z.enum(["PIX", "BOLETO", "CREDIT_CARD"]).optional(),\n});',
          )
          replace_once(
              billing,
              '        userId: context.userId,\n        plan: {',
              '        userId: context.userId,\n        paymentMethod: data.paymentMethod as AsaasBillingType | undefined,\n        plan: {',
          )

          page = 'src/routes/_authenticated/assinatura.tsx'
          replace_once(
              page,
              '  const checkout = async (plan: BillingPlan) => {',
              '  const checkout = async (\n    plan: BillingPlan,\n    paymentMethod?: "PIX" | "BOLETO" | "CREDIT_CARD",\n  ) => {',
          )
          replace_once(
              page,
              '    try {\n      const result = await checkoutFn({ data: { planId: plan.id } });\n      window.location.assign(result.url);\n    } catch (error) {',
              '    const paymentWindow = window.open("about:blank", "_blank");\n    if (!paymentWindow) {\n      toast.error("Permita a abertura de pop-ups para abrir o pagamento em uma nova aba.");\n      return;\n    }\n    paymentWindow.opener = null;\n    try {\n      const result = await checkoutFn({ data: { planId: plan.id, paymentMethod } });\n      paymentWindow.location.replace(result.url);\n    } catch (error) {\n      paymentWindow.close();',
          )
          replace_once(
              page,
              '                  checkoutConfigured={Boolean(overview.data?.configured)}\n                  onChoose={() => void checkout(plan)}',
              '                  checkoutConfigured={Boolean(overview.data?.configured)}\n                  billingProvider={overview.data?.provider ?? null}\n                  onChoose={(paymentMethod) => void checkout(plan, paymentMethod)}',
          )
          replace_once(
              page,
              '  checkoutConfigured,\n  onChoose,\n}: {\n  plan: BillingPlan;\n  current: boolean;\n  checkoutConfigured: boolean;\n  onChoose: () => void;\n}) {',
              '  checkoutConfigured,\n  billingProvider,\n  onChoose,\n}: {\n  plan: BillingPlan;\n  current: boolean;\n  checkoutConfigured: boolean;\n  billingProvider: "asaas" | "stripe" | null;\n  onChoose: (paymentMethod?: "PIX" | "BOLETO" | "CREDIT_CARD") => void;\n}) {',
          )
          replace_once(
              page,
              '''      <Button\n        className="mt-5 w-full"\n        variant={plan.recommended ? "default" : "outline"}\n        disabled={current || (plan.selfService && !checkoutConfigured)}\n        onClick={onChoose}\n      >\n        {current\n          ? "Plano atual"\n          : plan.selfService\n            ? "Contratar este plano"\n            : "Solicitar Enterprise"}\n      </Button>''',
              '''      {current ? (\n        <Button className="mt-5 w-full" disabled>\n          Plano atual\n        </Button>\n      ) : plan.selfService && billingProvider === "asaas" ? (\n        <div className="mt-5 space-y-2">\n          <p className="text-center text-[10px] font-black uppercase tracking-[0.12em] text-[var(--mi-text-soft)]">\n            Escolha a forma de pagamento\n          </p>\n          <Button\n            className="w-full"\n            variant={plan.recommended ? "default" : "outline"}\n            disabled={!checkoutConfigured}\n            onClick={() => onChoose("PIX")}\n          >\n            Pix (QR Code)\n          </Button>\n          <div className="grid grid-cols-2 gap-2">\n            <Button\n              variant="outline"\n              disabled={!checkoutConfigured}\n              onClick={() => onChoose("BOLETO")}\n            >\n              Boleto\n            </Button>\n            <Button\n              variant="outline"\n              disabled={!checkoutConfigured}\n              onClick={() => onChoose("CREDIT_CARD")}\n            >\n              Cartão\n            </Button>\n          </div>\n          <p className="text-center text-[10px] leading-4 text-[var(--mi-text-soft)]">\n            O pagamento abre em uma nova aba e o MercadoImobi permanece aberto.\n          </p>\n        </div>\n      ) : (\n        <Button\n          className="mt-5 w-full"\n          variant={plan.recommended ? "default" : "outline"}\n          disabled={plan.selfService && !checkoutConfigured}\n          onClick={() => onChoose()}\n        >\n          {plan.selfService ? "Contratar este plano" : "Solicitar Enterprise"}\n        </Button>\n      )}''',
          )

          tests = 'tests/asaas-billing.test.ts'
          replace_once(
              tests,
              '''  it("adds onboarding only to the first cycle amount", () => {''',
              '''  it("supports explicit Pix, boleto and credit-card checkout billing types", () => {\n    expect(__asaasBillingTestUtils.normalizeAsaasBillingType("PIX")).toBe("PIX");\n    expect(__asaasBillingTestUtils.normalizeAsaasBillingType("BOLETO")).toBe("BOLETO");\n    expect(__asaasBillingTestUtils.normalizeAsaasBillingType("CREDIT_CARD")).toBe("CREDIT_CARD");\n    expect(__asaasBillingTestUtils.normalizeAsaasBillingType("invalid")).toBe("UNDEFINED");\n  });\n\n  it("adds onboarding only to the first cycle amount", () => {''',
          )

      - run: npm ci --no-audit --no-fund

      - name: Format only touched source files
        run: npx prettier --write src/lib/asaas-billing.server.ts src/lib/billing.functions.ts src/routes/_authenticated/assinatura.tsx tests/asaas-billing.test.ts

      - name: Lint
        run: npm run lint

      - name: Full test suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit only isolated billing changes
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- src/routeTree.gen.ts 2>/dev/null || true
          git checkout HEAD -- public/mcp/openapi.json 2>/dev/null || true
          git checkout HEAD -- public/mcp/llms.txt 2>/dev/null || true
          git checkout HEAD -- 'src/routes/[.mcp]/invoke-tool/$tool.ts' 2>/dev/null || true
          git checkout HEAD -- 'src/routes/[.mcp]/list-tools.ts' 2>/dev/null || true
          git checkout HEAD -- 'src/routes/[.well-known]/oauth-protected-resource.ts' 2>/dev/null || true
          git checkout HEAD -- src/routes/mcp.ts 2>/dev/null || true
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'src/lib/asaas-billing.server.ts' 'src/lib/billing.functions.ts' 'src/routes/_authenticated/assinatura.tsx' 'tests/asaas-billing.test.ts' | sort)"
          test "$changed" = "$expected" || { echo "Unexpected diff:"; echo "$changed"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/asaas-billing.server.ts src/lib/billing.functions.ts src/routes/_authenticated/assinatura.tsx tests/asaas-billing.test.ts
          git commit -m 'feat: adicionar Pix e abrir checkout em nova aba'
          git push origin HEAD:${{ github.ref_name }}
