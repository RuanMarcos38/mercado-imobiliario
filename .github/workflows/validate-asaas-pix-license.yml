name: Validate Asaas Pix and plan licensing

on:
  push:
    branches:
      - fix/asaas-pix-license-20260825

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PROJECT_ID: example
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply isolated source patch
        run: python .github/scripts/apply-asaas-pix-license-fix.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format touched source files
        run: npx prettier --write src/lib/asaas-billing.server.ts src/routes/_authenticated/assinatura.tsx src/routes/_authenticated.tsx
      - name: Verify scope and entitlement hardening
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'ASAAS_PIX_ACCOUNT_NOT_APPROVED' src/lib/asaas-billing.server.ts >/dev/null
          grep -F 'status=ACTIVE&offset=0&limit=1' src/lib/asaas-billing.server.ts >/dev/null
          grep -F 'const hasPlanEntitlement' src/routes/_authenticated.tsx >/dev/null
          if grep -F 'planFeatures ?? routeFeatureMap' src/routes/_authenticated.tsx; then exit 1; fi
          grep -F 'return false;' supabase/migrations/20260825233500_harden_plan_feature_entitlements.sql >/dev/null
      - name: Lint
        run: npm run lint
      - name: Full test suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit only validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- src/routeTree.gen.ts 2>/dev/null || true
          git checkout HEAD -- public/mcp/openapi.json 2>/dev/null || true
          git checkout HEAD -- public/mcp/llms.txt 2>/dev/null || true
          git checkout HEAD -- 'src/routes/[.mcp]/invoke-tool/$tool.ts' 2>/dev/null || true
          git checkout HEAD -- 'src/routes/[.mcp]/list-tools.ts' 2>/dev/null || true
          git checkout HEAD -- 'src/routes/[.well-known]/oauth-protected-resource.ts' 2>/dev/null || true
          git checkout HEAD -- src/routes/mcp.ts 2>/dev/null || true
          changed="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort )"
          expected="$(printf '%s\n' 'src/lib/asaas-billing.server.ts' 'src/routes/_authenticated/assinatura.tsx' 'src/routes/_authenticated.tsx' 'supabase/migrations/20260825233500_harden_plan_feature_entitlements.sql' | sort)"
          test "$changed" = "$expected" || { echo "Unexpected diff:"; echo "$changed"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/asaas-billing.server.ts src/routes/_authenticated/assinatura.tsx src/routes/_authenticated.tsx supabase/migrations/20260825233500_harden_plan_feature_entitlements.sql
          git commit -m 'fix: preparar Pix e endurecer licenciamento por plano'
          git push origin HEAD:${{ github.ref_name }}
