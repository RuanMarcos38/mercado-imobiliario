name: Clean MercadoImobi product menu

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clean-search-product-menu.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Keep search product menu focused
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          nav_path = Path('src/routes/_authenticated.tsx')
          nav = nav_path.read_text()
          for line in [
              '  LayoutGrid,\n',
              '  Mail,\n',
              '  PhoneCall,\n',
              '  Share2,\n',
          ]:
              nav = nav.replace(line, '')
          for line in [
              '  { to: "/crm", label: "CRM / Oportunidades", icon: LayoutGrid },\n',
              '  { to: "/midias-sociais", label: "Facebook e Instagram", icon: Share2 },\n',
              '  { to: "/email-cca", label: "E-mail / CCA", icon: Mail },\n',
              '  { to: "/discador", label: "Discador", icon: PhoneCall },\n',
          ]:
              nav = nav.replace(line, '')
          nav_path.write_text(nav)

          buttons_path = Path('tests/platform-buttons.test.ts')
          buttons = buttons_path.read_text()
          marker = '  it("keeps dashboard and search on all properties, while auctions remain separate", () => {'
          block = '''  it("keeps CRM and unrelated communication tools out of the visible MercadoImobi menu", () => {\n    const layout = source("src/routes/_authenticated.tsx");\n    expect(layout).not.toContain('label: "CRM / Oportunidades"');\n    expect(layout).not.toContain('label: "Facebook e Instagram"');\n    expect(layout).not.toContain('label: "E-mail / CCA"');\n    expect(layout).not.toContain('label: "Discador"');\n    expect(layout).toContain('label: "Atendimento WhatsApp"');\n    expect(layout).toContain('label: "Fluxos"');\n    expect(layout).toContain('label: "Assistente IA"');\n    expect(layout).toContain('label: "Diagnóstico"');\n    expect(layout).toContain('label: "Fontes de imóveis"');\n  });\n\n'''
          if block not in buttons:
              if marker not in buttons:
                  raise SystemExit('platform test insertion marker not found')
              buttons = buttons.replace(marker, block + marker)
          buttons_path.write_text(buttons)

          comm_path = Path('tests/communications-hub.test.ts')
          comm = comm_path.read_text()
          comm = comm.replace(
              '    expect(nav).toContain(\'to: "/midias-sociais"\');\n    expect(nav).toContain(\'to: "/email-cca"\');\n    expect(nav).toContain(\'to: "/discador"\');\n    expect(nav).toContain(\'to: "/diagnostico"\');',
              '    expect(nav).not.toContain(\'label: "Facebook e Instagram"\');\n    expect(nav).not.toContain(\'label: "E-mail / CCA"\');\n    expect(nav).not.toContain(\'label: "Discador"\');\n    expect(nav).toContain(\'to: "/diagnostico"\');'
          )
          comm_path.write_text(comm)
          PY
          npx prettier --write src/routes/_authenticated.tsx tests/platform-buttons.test.ts tests/communications-hub.test.ts
          npm test
      - name: Commit clean product menu
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/clean-search-product-menu.yml
          git add src/routes/_authenticated.tsx tests/platform-buttons.test.ts tests/communications-hub.test.ts
          git commit -m "Keep MercadoImobi navigation focused on property search"
          git push origin HEAD:main
