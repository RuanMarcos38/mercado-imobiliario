name: Fix authentication experience

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix_auth_experience.py"
      - ".github/workflows/fix-auth-experience.yml"

permissions:
  contents: write

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply authentication corrections
        run: python scripts/fix_auth_experience.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format changed TypeScript
        run: npx prettier --write src/routes/auth.tsx src/integrations/supabase/types.ts

      - name: Lint
        run: npm run lint

      - name: Run safe tests
        run: npm run test -- --exclude tests/tenant-isolation.test.ts --exclude tests/critical-flows.spec.ts --passWithNoTests

      - name: Build production application
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          VITE_SUPABASE_PROJECT_ID: placeholder
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
        run: |
          npm run build
          test -f .output/server/index.mjs

      - name: Commit validated authentication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/auth.tsx src/integrations/supabase/types.ts supabase/migrations/20260815212000_add_client_user_type.sql supabase/migrations/20260815212100_update_signup_profile.sql
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix login MFA flow and simplify property search signup"
          git stash push --include-untracked -m generated-build-files || true
          git pull --rebase origin main
          git push origin main
