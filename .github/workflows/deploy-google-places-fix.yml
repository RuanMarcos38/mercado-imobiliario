name: Deploy Google Places fix to EasyPanel

on:
  push:
    branches:
      - ops/promote-google-places-20260825

permissions:
  contents: read

jobs:
  deploy-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
      EASYPANEL_DEPLOY_TRIGGER_URL: ${{ secrets.EASYPANEL_DEPLOY_TRIGGER_URL }}
      DEPLOY_TRIGGER_URL: ${{ secrets.DEPLOY_TRIGGER_URL }}
      EASYPANEL_PUBLIC_URL: ${{ vars.EASYPANEL_PUBLIC_URL }}
      EXPECTED_SUPABASE_PROJECT_ID: ${{ vars.MERCADOIMOBI_SUPABASE_PROJECT_ID || 'uwzfgksmnqgaxtscwxow' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify production contains only the validated fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin production fix/google-places-partner-search-20260825
          test "$(git rev-parse origin/production)" = "$(git rev-parse origin/fix/google-places-partner-search-20260825)"
          git show origin/production:src/lib/partner-search.functions.ts | grep -F 'function googlePlacesQueries' >/dev/null
          git show origin/production:src/lib/partner-search.functions.ts | grep -F 'googlePlaces: Boolean(googleKey) && google.operational === true' >/dev/null
      - name: Trigger EasyPanel deployment when hook is configured
        shell: bash
        run: |
          set -euo pipefail
          URL="${EASYPANEL_DEPLOY_URL:-${EASYPANEL_DEPLOY_TRIGGER_URL:-${DEPLOY_TRIGGER_URL:-}}}"
          if [ -z "$URL" ]; then
            echo "::notice::No explicit EasyPanel hook configured; relying on GitHub-linked production branch."
            exit 0
          fi
          if curl -fsS --connect-timeout 10 --max-time 60 "$URL" -o /tmp/deploy-response.txt; then
            echo "EasyPanel deploy requested with GET."
          else
            curl -fsS -X POST --connect-timeout 10 --max-time 60 "$URL" -o /tmp/deploy-response.txt
            echo "EasyPanel deploy requested with POST."
          fi
      - name: Verify MercadoImobi backend remains operational
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_URL="${EASYPANEL_PUBLIC_URL:-https://r2rmarketingdigital-mercadomobi.ke4n49.easypanel.host}"
          PUBLIC_URL="${PUBLIC_URL%/}"
          STATUS_URL="$PUBLIC_URL/api/public/status"
          for attempt in $(seq 1 30); do
            if curl -fsS --connect-timeout 6 --max-time 10 "$STATUS_URL" -o /tmp/status.json; then
              if EXPECTED_SUPABASE_PROJECT_ID="$EXPECTED_SUPABASE_PROJECT_ID" node - <<'NODE'
          const fs = require('fs');
          try {
            const s = JSON.parse(fs.readFileSync('/tmp/status.json','utf8'));
            const ok = s.status === 'operational'
              && s.search === 'available'
              && String(s.supabaseProjectId || '') === String(process.env.EXPECTED_SUPABASE_PROJECT_ID || '')
              && s.runtime?.supabaseAdmin === 'configured';
            process.exit(ok ? 0 : 1);
          } catch { process.exit(1); }
          NODE
              then
                echo "MercadoImobi backend operational after publication request."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::MercadoImobi backend did not remain operational after deployment request."
          exit 1
