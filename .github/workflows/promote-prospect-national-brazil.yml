name: Promote national prospect coverage

on:
  push:
    branches:
      - ops/promote-prospect-national-20260825

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact validated diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin production feat/prospect-national-brazil-20260825
          changed="$(git diff --name-only origin/production..origin/feat/prospect-national-brazil-20260825 | sort)"
          expected='src/lib/prospect-leads.functions.ts
          tests/prospect-leads.test.ts'
          test "$changed" = "$(echo "$expected" | sed 's/^ *//')" || {
            echo "Unexpected diff:"; echo "$changed"; exit 1;
          }
          git show origin/feat/prospect-national-brazil-20260825:src/lib/prospect-leads.functions.ts | grep -F 'BRAZIL_SEARCH_REGIONS' >/dev/null
          git show origin/feat/prospect-national-brazil-20260825:src/lib/prospect-leads.functions.ts | grep -F 'passes complementares nas 5 regiões do Brasil' >/dev/null
          git merge-base --is-ancestor origin/production origin/feat/prospect-national-brazil-20260825
      - name: Promote as GitHub Actions bot
        run: git push origin origin/feat/prospect-national-brazil-20260825:refs/heads/production
