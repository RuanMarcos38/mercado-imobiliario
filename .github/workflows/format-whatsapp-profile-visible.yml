name: Format WhatsApp profile visibility fix

on:
  push:
    branches:
      - fix/whatsapp-profile-visible

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-profile-visible

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Format changed files
        run: |
          npx prettier --write             src/routes/_authenticated/central-integracoes.tsx             src/routes/_authenticated/atendimento.tsx             src/lib/whatsapp-connection.functions.ts

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/routes/_authenticated/central-integracoes.tsx             src/routes/_authenticated/atendimento.tsx             src/lib/whatsapp-connection.functions.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format WhatsApp profile visibility fix"
          git push origin HEAD:fix/whatsapp-profile-visible
