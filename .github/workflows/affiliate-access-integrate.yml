name: Affiliate wallet and access integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python -m py_compile scripts/apply-affiliate-wallet-access-fixes.py
      - run: python scripts/apply-affiliate-wallet-access-fixes.py
      - run: npx prettier --write src/lib/affiliate.functions.ts src/routes/_authenticated/afiliados.tsx src/routes/_authenticated.tsx src/routes/auth.tsx src/routes/api/public/hooks/stripe.tsx src/routes/_authenticated/admin/usuarios.tsx
      - run: npm run lint
      - run: npm run test -- --passWithNoTests
      - name: Build
        run: npm run build
      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat: integrate affiliate wallet and user access fixes"
          git push origin HEAD:main
