name: MercadoImobi login recovery deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/login-recovery-deploy.yml"

permissions:
  contents: write

jobs:
  recover-login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
      EASYPANEL_DEPLOY_TRIGGER_URL: ${{ secrets.EASYPANEL_DEPLOY_TRIGGER_URL }}
      DEPLOY_TRIGGER_URL: ${{ secrets.DEPLOY_TRIGGER_URL }}
      EASYPANEL_PUBLIC_URL: ${{ vars.EASYPANEL_PUBLIC_URL }}
    steps:
      - name: Checkout validated recovery source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate login hotfix files
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --check \
            src/integrations/supabase/public-config.ts \
            src/integrations/supabase/client.ts \
            src/integrations/supabase/client.server.ts \
            src/integrations/supabase/auth-middleware.ts \
            src/routes/api/public/status.tsx \
            tests/supabase-public-config.test.ts \
            .github/workflows/login-recovery-deploy.yml
          npx eslint \
            src/integrations/supabase/public-config.ts \
            src/integrations/supabase/client.ts \
            src/integrations/supabase/client.server.ts \
            src/integrations/supabase/auth-middleware.ts \
            src/routes/api/public/status.tsx \
            tests/supabase-public-config.test.ts
          npx vitest run tests/supabase-public-config.test.ts

      - name: Build recovery release
        shell: bash
        run: |
          set -euo pipefail
          unset VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID
          unset SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_PROJECT_ID SUPABASE_SERVICE_ROLE_KEY
          npm run build
          test -f .output/server/index.mjs

      - name: Verify recovery backend against RM Supabase
        shell: bash
        run: |
          set -euo pipefail
          unset VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID
          unset SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_PROJECT_ID SUPABASE_SERVICE_ROLE_KEY
          PORT=3000 HOST=127.0.0.1 NODE_ENV=production node .output/server/index.mjs > /tmp/mercadoimobi-recovery.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/public/status -o /tmp/recovery-status.json; then
              break
            fi
            sleep 1
          done
          test -s /tmp/recovery-status.json || { cat /tmp/mercadoimobi-recovery.log || true; exit 1; }
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('/tmp/recovery-status.json', 'utf8'));
          const ok = p.status === 'operational'
            && p.search === 'available'
            && p.supabaseProjectId === 'uwzfgksmnqgaxtscwxow'
            && Number.isFinite(p.indexedProperties) && p.indexedProperties >= 1000
            && Number.isFinite(p.coveredStates) && p.coveredStates >= 27;
          if (!ok) {
            console.error(p);
            process.exit(1);
          }
          console.log(`Recovery backend validated on ${p.supabaseProjectId}: ${p.indexedProperties} properties / ${p.coveredStates} states.`);
          NODE

      - name: Promote recovery build to production
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git fetch origin production
          git push --force-with-lease origin HEAD:refs/heads/production

      - name: Trigger EasyPanel recovery deployment
        shell: bash
        run: |
          set -euo pipefail
          URL="${EASYPANEL_DEPLOY_URL:-${EASYPANEL_DEPLOY_TRIGGER_URL:-${DEPLOY_TRIGGER_URL:-}}}"
          if [ -z "$URL" ]; then
            echo "::warning::No EasyPanel deployment trigger secret is configured. Waiting for any repository-linked automatic deployment."
            exit 0
          fi
          if curl -fsS --connect-timeout 10 --max-time 60 "$URL" -o /tmp/easypanel-login-recovery.txt; then
            echo "EasyPanel recovery deployment requested with GET."
          else
            curl -fsS -X POST --connect-timeout 10 --max-time 60 "$URL" -o /tmp/easypanel-login-recovery.txt
            echo "EasyPanel recovery deployment requested with POST."
          fi

      - name: Verify live login backend target
        shell: bash
        run: |
          set -euo pipefail
          EASY="${EASYPANEL_PUBLIC_URL:-https://r2rmarketingdigital-mercadoimobi.ke4n49.easypanel.host}"
          EASY="${EASY%/}"
          CUSTOM="https://mercadoimobi.rdmconsultoriaimobiliaria.com.br"
          ready=0
          for attempt in $(seq 1 60); do
            for base in "$EASY" "$CUSTOM"; do
              if curl -fsS --connect-timeout 8 --max-time 20 "$base/api/public/status" -o /tmp/live-login-status.json; then
                if node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('/tmp/live-login-status.json', 'utf8'));
          const ok = p.status === 'operational'
            && p.search === 'available'
            && p.supabaseProjectId === 'uwzfgksmnqgaxtscwxow'
            && Number.isFinite(p.indexedProperties) && p.indexedProperties >= 1000
            && Number.isFinite(p.coveredStates) && p.coveredStates >= 27;
          process.exit(ok ? 0 : 1);
          NODE
                then
                  echo "Live MercadoImobi recovery confirmed at $base"
                  cat /tmp/live-login-status.json
                  ready=1
                  break 2
                fi
              fi
            done
            echo "Waiting for EasyPanel login recovery deployment ($attempt/60)..."
            sleep 6
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Production did not confirm the RM Supabase login target after deployment."
            exit 1
          fi
