name: MercadoImobi login recovery deploy

# Controlled recovery path for the authentication/backend incident. Retriggered after correcting the EasyPanel Supabase target.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/login-recovery-deploy.yml"

permissions:
  contents: write

jobs:
  recover-login:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
      EASYPANEL_DEPLOY_TRIGGER_URL: ${{ secrets.EASYPANEL_DEPLOY_TRIGGER_URL }}
      DEPLOY_TRIGGER_URL: ${{ secrets.DEPLOY_TRIGGER_URL }}
      EASYPANEL_PUBLIC_URL: ${{ vars.EASYPANEL_PUBLIC_URL }}
    steps:
      - name: Checkout recovery source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify RM Supabase target and backend data
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'uwzfgksmnqgaxtscwxow' src/integrations/supabase/public-config.ts
          grep -q 'uwzfgksmnqgaxtscwxow' supabase/config.toml
          grep -q 'supabaseProjectId' src/routes/api/public/status.tsx
          curl -fsS -X POST \
            'https://uwzfgksmnqgaxtscwxow.supabase.co/rest/v1/rpc/search_index_health' \
            -H 'apikey: sb_publishable_mZUNYHM3JeRZXR8vWfVECA_7gCgTp7i' \
            -H 'content-type: application/json' \
            -d '{}' \
            -o /tmp/rm-supabase-health.json
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('/tmp/rm-supabase-health.json', 'utf8'));
          const ok = Number.isFinite(p.count) && p.count >= 1000
            && Number.isFinite(p.states) && p.states >= 27;
          if (!ok) {
            console.error(p);
            process.exit(1);
          }
          console.log(`RM Supabase verified: ${p.count} properties / ${p.states} states.`);
          NODE

      - name: Promote login recovery to production
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git fetch origin production
          git push --force-with-lease origin HEAD:refs/heads/production

      - name: Trigger EasyPanel deployment
        shell: bash
        run: |
          set -uo pipefail
          URL="${EASYPANEL_DEPLOY_URL:-${EASYPANEL_DEPLOY_TRIGGER_URL:-${DEPLOY_TRIGGER_URL:-}}}"
          if [ -z "$URL" ]; then
            echo "::warning::No explicit EasyPanel trigger secret found; using repository-linked auto deployment."
            exit 0
          fi
          if curl -fsS --connect-timeout 6 --max-time 20 "$URL" -o /tmp/easypanel-login-recovery.txt; then
            echo "EasyPanel deployment requested with GET."
          elif curl -fsS -X POST --connect-timeout 6 --max-time 20 "$URL" -o /tmp/easypanel-login-recovery.txt; then
            echo "EasyPanel deployment requested with POST."
          else
            echo "::warning::Explicit EasyPanel trigger failed; continuing because the EasyPanel app is linked to the production branch on GitHub."
          fi

      - name: Verify live backend uses RM Supabase
        shell: bash
        run: |
          set -euo pipefail
          EASY="${EASYPANEL_PUBLIC_URL:-https://r2rmarketingdigital-mercadoimobi.ke4n49.easypanel.host}"
          EASY="${EASY%/}"
          CUSTOM="https://mercadoimobi.rdmconsultoriaimobiliaria.com.br"
          for attempt in $(seq 1 10); do
            for base in "$EASY" "$CUSTOM"; do
              if curl -fsS --connect-timeout 4 --max-time 6 "$base/api/public/status" -o /tmp/live-login-status.json; then
                if node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('/tmp/live-login-status.json', 'utf8'));
          const ok = p.status === 'operational'
            && p.search === 'available'
            && p.supabaseProjectId === 'uwzfgksmnqgaxtscwxow'
            && Number.isFinite(p.indexedProperties) && p.indexedProperties >= 1000
            && Number.isFinite(p.coveredStates) && p.coveredStates >= 27;
          process.exit(ok ? 0 : 1);
          NODE
                then
                  echo "Live MercadoImobi confirmed at $base"
                  cat /tmp/live-login-status.json
                  exit 0
                fi
              fi
            done
            echo "Waiting for EasyPanel recovery deployment ($attempt/10)..."
            sleep 5
          done
          echo "::error::Live backend did not confirm RM Supabase target."
          exit 1

      - name: Record live recovery success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          printf '%s\n' \
            '# MercadoImobi login recovery — LIVE OK' \
            '' \
            "Verified at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            'Supabase project: uwzfgksmnqgaxtscwxow' \
            'Expected backend: RM NEGOCIO IMOBILIARIO' \
            'Status: EasyPanel live endpoint confirmed operational with search available.' \
            > docs/login-recovery-live-ok.md
          rm -f docs/login-recovery-live-failed.md
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add docs/login-recovery-live-ok.md docs/login-recovery-live-failed.md 2>/dev/null || true
          git commit -m "ops: confirm MercadoImobi login recovery live"
          git push origin HEAD:refs/heads/main

      - name: Record recovery verification failure
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p docs
          {
            echo '# MercadoImobi login recovery — VERIFICATION FAILED'
            echo
            echo "Checked at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo 'Expected Supabase project: uwzfgksmnqgaxtscwxow'
            echo 'Production branch was promoted, but the live EasyPanel endpoint did not complete the expected verification in this run.'
            if [ -s /tmp/live-login-status.json ]; then
              echo
              echo 'Last live status response:'
              echo '```json'
              cat /tmp/live-login-status.json
              echo
              echo '```'
            fi
          } > docs/login-recovery-live-failed.md
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add docs/login-recovery-live-failed.md
          git commit -m "ops: record MercadoImobi recovery verification failure" || true
          git push origin HEAD:refs/heads/main || true
