name: MercadoImobi login recovery deploy

# Controlled recovery path for the authentication/backend incident.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/login-recovery-deploy.yml"

permissions:
  contents: write

jobs:
  recover-login:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
      EASYPANEL_DEPLOY_TRIGGER_URL: ${{ secrets.EASYPANEL_DEPLOY_TRIGGER_URL }}
      DEPLOY_TRIGGER_URL: ${{ secrets.DEPLOY_TRIGGER_URL }}
      EASYPANEL_PUBLIC_URL: ${{ vars.EASYPANEL_PUBLIC_URL }}
    steps:
      - name: Checkout recovery source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify RM Supabase target and backend data
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'uwzfgksmnqgaxtscwxow' src/integrations/supabase/public-config.ts
          grep -q 'uwzfgksmnqgaxtscwxow' supabase/config.toml
          grep -q 'supabaseProjectId' src/routes/api/public/status.tsx
          curl -fsS -X POST \
            'https://uwzfgksmnqgaxtscwxow.supabase.co/rest/v1/rpc/search_index_health' \
            -H 'apikey: sb_publishable_mZUNYHM3JeRZXR8vWfVECA_7gCgTp7i' \
            -H 'content-type: application/json' \
            -d '{}' \
            -o /tmp/rm-supabase-health.json
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('/tmp/rm-supabase-health.json', 'utf8'));
          const ok = Number.isFinite(p.count) && p.count >= 1000
            && Number.isFinite(p.states) && p.states >= 27;
          if (!ok) process.exit(1);
          console.log(`RM Supabase verified: ${p.count} properties / ${p.states} states.`);
          NODE

      - name: Promote recovery source to production
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git fetch origin production
          git push --force-with-lease origin HEAD:refs/heads/production

      - name: Trigger EasyPanel deployment
        shell: bash
        run: |
          set -uo pipefail
          URL="${EASYPANEL_DEPLOY_URL:-${EASYPANEL_DEPLOY_TRIGGER_URL:-${DEPLOY_TRIGGER_URL:-}}}"
          if [ -z "$URL" ]; then
            echo "::notice::No explicit deploy hook configured; production push will trigger the GitHub-linked EasyPanel app."
            exit 0
          fi
          if curl -fsS --connect-timeout 6 --max-time 20 "$URL" -o /tmp/easypanel-trigger.txt; then
            echo "EasyPanel deployment requested with GET."
          elif curl -fsS -X POST --connect-timeout 6 --max-time 20 "$URL" -o /tmp/easypanel-trigger.txt; then
            echo "EasyPanel deployment requested with POST."
          else
            echo "::warning::Explicit deploy hook failed; continuing with repository-linked EasyPanel deployment."
          fi

      - name: Verify configured EasyPanel URL
        id: verify_easy
        shell: bash
        run: |
          set -euo pipefail
          FALLBACK='https://r2rmarketingdigital-mercadoimobi.ke4n49.easypanel.host'
          EASY="${EASYPANEL_PUBLIC_URL:-$FALLBACK}"
          EASY="${EASY%/}"
          printf '%s' "$EASY" > /tmp/easy-target.txt
          : > /tmp/easy-last.txt
          for attempt in $(seq 1 10); do
            code="$(curl -sS --connect-timeout 4 --max-time 7 -w '%{http_code}' "$EASY/api/public/status" -o /tmp/easy-last.txt || true)"
            echo "Configured EasyPanel target: $EASY | attempt $attempt/10 | HTTP ${code:-000}"
            if [ "$code" = "200" ]; then
              if node - <<'NODE'
          const fs = require('fs');
          try {
            const p = JSON.parse(fs.readFileSync('/tmp/easy-last.txt', 'utf8'));
            const ok = p.status === 'operational'
              && p.search === 'available'
              && p.supabaseProjectId === 'uwzfgksmnqgaxtscwxow'
              && Number.isFinite(p.indexedProperties) && p.indexedProperties >= 1000
              && Number.isFinite(p.coveredStates) && p.coveredStates >= 27;
            process.exit(ok ? 0 : 1);
          } catch {
            process.exit(1);
          }
          NODE
              then
                echo "EasyPanel MercadoImobi LIVE OK at $EASY"
                cat /tmp/easy-last.txt
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Configured EasyPanel URL did not expose the corrected MercadoImobi backend."
          exit 1

      - name: Record EasyPanel live success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          TARGET="$(cat /tmp/easy-target.txt)"
          {
            echo '# MercadoImobi EasyPanel — LIVE OK'
            echo
            echo "Verified at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "EasyPanel target: $TARGET"
            echo 'Supabase project: uwzfgksmnqgaxtscwxow'
            echo 'Status: corrected backend is live and operational.'
            echo
            echo 'Live status:'
            echo '```json'
            cat /tmp/easy-last.txt
            echo
            echo '```'
          } > docs/login-recovery-live-ok.md
          rm -f docs/login-recovery-live-failed.md
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add -A docs/login-recovery-live-ok.md docs/login-recovery-live-failed.md
          git commit -m "ops: confirm MercadoImobi EasyPanel backend live"
          git push origin HEAD:refs/heads/main

      - name: Record EasyPanel verification failure
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p docs
          TARGET="$(cat /tmp/easy-target.txt 2>/dev/null || echo 'not resolved')"
          {
            echo '# MercadoImobi EasyPanel — VERIFICATION FAILED'
            echo
            echo "Checked at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Configured EasyPanel target: $TARGET"
            echo 'Expected Supabase project: uwzfgksmnqgaxtscwxow'
            echo 'Production was promoted, but the configured EasyPanel URL did not expose the corrected backend during this run.'
            if [ -s /tmp/easy-last.txt ]; then
              echo
              echo 'Last EasyPanel response:'
              echo '```'
              cat /tmp/easy-last.txt
              echo
              echo '```'
            fi
          } > docs/login-recovery-live-failed.md
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add docs/login-recovery-live-failed.md
          git commit -m "ops: record MercadoImobi configured EasyPanel target failure" || true
          git push origin HEAD:refs/heads/main || true
