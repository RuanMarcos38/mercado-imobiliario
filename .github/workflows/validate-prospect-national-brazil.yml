name: Validate national prospect coverage

on:
  push:
    branches:
      - feat/prospect-national-brazil-20260825

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PROJECT_ID: example
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply national coverage patch
        run: python .github/scripts/apply-national-prospect-coverage.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format isolated files
        run: npx prettier --write src/lib/prospect-leads.functions.ts tests/prospect-leads.test.ts
      - name: Verify isolated scope
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'BRAZIL_SEARCH_REGIONS' src/lib/prospect-leads.functions.ts >/dev/null
          grep -F 'passes complementares nas 5 regiões do Brasil' src/lib/prospect-leads.functions.ts >/dev/null
          grep -F 'Região Norte, Brasil' tests/prospect-leads.test.ts >/dev/null
      - name: Lint
        run: npm run lint
      - name: Prospect radar tests
        run: npx vitest run tests/prospect-leads.test.ts
      - name: Full regression tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit validated product changes only
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- src/routeTree.gen.ts 2>/dev/null || true
          git checkout HEAD -- public/mcp/openapi.json 2>/dev/null || true
          git checkout HEAD -- public/mcp/llms.txt 2>/dev/null || true
          git checkout HEAD -- 'src/routes/[.mcp]/invoke-tool/$tool.ts' 2>/dev/null || true
          git checkout HEAD -- 'src/routes/[.mcp]/list-tools.ts' 2>/dev/null || true
          git checkout HEAD -- 'src/routes/[.well-known]/oauth-protected-resource.ts' 2>/dev/null || true
          git checkout HEAD -- src/routes/mcp.ts 2>/dev/null || true
          changed="$(git diff --name-only | sort)"
          expected='src/lib/prospect-leads.functions.ts
          tests/prospect-leads.test.ts'
          test "$changed" = "$(echo "$expected" | sed 's/^ *//')" || {
            echo "Unexpected diff:"; echo "$changed"; exit 1;
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/prospect-leads.functions.ts tests/prospect-leads.test.ts
          git commit -m 'feat: reforçar prospecção nacional em todo o Brasil'
          git push origin HEAD:${{ github.ref_name }}
