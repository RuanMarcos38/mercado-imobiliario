name: Apply robust favorites UI fix

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-dashboard-favorites-v2.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch dashboard structurally
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/routes/_authenticated/dashboard.tsx')
          s = p.read_text(encoding='utf-8')

          if 'const favoriteProperties = useQuery' not in s:
              pattern = r'(  const savedSearches = useQuery\(\{\n\s+queryKey: \["saved-property-searches", user\?\.id\],\n\s+queryFn: \(\) => listSavedFn\(\),\n\s+enabled: Boolean\(user\),\n  \}\);\n)'
              replacement = r'''\1
  const favoriteProperties = useQuery({
    queryKey: ["property-favorites", user?.id],
    queryFn: () => listFavoritesFn(),
    enabled: Boolean(user),
  });
'''
              s, count = re.subn(pattern, replacement, s, count=1)
              if count != 1:
                  raise SystemExit('Could not insert favoriteProperties query')

          pattern = r'''  useEffect\(\(\) => \{\n\s+try \{\n\s+const raw = window\.localStorage\.getItem\("mercadoimobi:favorites"\);\n\s+if \(raw\) setFavorites\(new Set\(JSON\.parse\(raw\)\)\);\n\s+\} catch \{\n\s+setFavorites\(new Set\(\)\);\n\s+\}\n  \}, \[\]\);'''
          replacement = '''  useEffect(() => {
    if (favoriteProperties.data) {
      setFavorites(new Set(favoriteProperties.data.map((item) => item.key)));
    }
  }, [favoriteProperties.data]);'''
          s, _ = re.subn(pattern, replacement, s, count=1)

          pattern = r'''  const toggleFavorite = \(id: string\) => \{.*?^  \};\n\n  const toggleCompare'''
          replacement = '''  const toggleFavorite = async (property: PropertySearchItem) => {
    const key = getPropertyKey(property);
    const nextFavorite = !favorites.has(key);
    const previous = new Set(favorites);
    const optimistic = new Set(favorites);
    if (nextFavorite) optimistic.add(key);
    else optimistic.delete(key);
    setFavorites(optimistic);

    try {
      await setFavoriteFn({ data: { property, favorite: nextFavorite } });
      await favoriteProperties.refetch();
      toast.success(nextFavorite ? "Imóvel salvo nos favoritos." : "Imóvel removido dos favoritos.");
    } catch {
      setFavorites(previous);
      toast.error("Não foi possível atualizar seus favoritos agora.");
    }
  };

  const toggleCompare'''
          s, count = re.subn(pattern, replacement, s, count=1, flags=re.S | re.M)
          if count != 1 and 'const toggleFavorite = async (property: PropertySearchItem)' not in s:
              raise SystemExit('Could not replace toggleFavorite')

          pattern = r'''            <button\n              onClick=\{\(\) =>\n                document\.getElementById\("resultados"\)\?\.scrollIntoView\(\{ behavior: "smooth" \}\)\n              \}\n              className="transition hover:text-white"\n            >\n              Favoritos \(\{favorites\.size\}\)\n            </button>'''
          replacement = '''            <button
              onClick={() => setShowFavorites(true)}
              className="transition hover:text-white"
            >
              Favoritos ({favorites.size})
            </button>'''
          s, _ = re.subn(pattern, replacement, s, count=1)

          if '<Pencil className="h-3.5 w-3.5" /> Renomear' not in s:
              pattern = r'''              \{\(savedSearches\.data \?\? \[\]\)\.map\(\(saved\) => \(\n                <button.*?              \)\)\}\n'''
              replacement = '''              {(savedSearches.data ?? []).map((saved) => (
                <div
                  key={saved.id}
                  className="rounded-2xl border border-white/10 bg-white/[0.03] p-4 transition hover:border-cyan-300/30 hover:bg-cyan-300/[0.04]"
                >
                  <button onClick={() => applySavedSearch(saved.criteria)} className="w-full text-left">
                    <span className="font-semibold">{saved.name}</span>
                    <span className="mt-1 block text-xs text-slate-400">Abrir esta pesquisa</span>
                  </button>
                  <div className="mt-3 flex gap-2 border-t border-white/10 pt-3">
                    <button
                      onClick={() => void handleRenameSavedSearch(saved.id, saved.name)}
                      className="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-slate-300 hover:bg-white/5"
                    >
                      <Pencil className="h-3.5 w-3.5" /> Renomear
                    </button>
                    <button
                      onClick={() => void handleDeleteSavedSearch(saved.id, saved.name)}
                      className="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-rose-200 hover:bg-rose-400/10"
                    >
                      <Trash2 className="h-3.5 w-3.5" /> Excluir
                    </button>
                  </div>
                </div>
              ))}
'''
              s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit('Could not replace saved search list')

          s = s.replace('favorite={favorites.has(property.id)}', 'favorite={favorites.has(getPropertyKey(property))}')
          s = s.replace('onFavorite={() => toggleFavorite(property.id)}', 'onFavorite={() => void toggleFavorite(property)}')

          required = [
              'const favoriteProperties = useQuery',
              'const toggleFavorite = async (property: PropertySearchItem)',
              'onClick={() => setShowFavorites(true)}',
              '<Pencil className="h-3.5 w-3.5" /> Renomear',
              'onFavorite={() => void toggleFavorite(property)}',
          ]
          for item in required:
              if item not in s:
                  raise SystemExit(f'Missing expected dashboard feature: {item}')
          if 'mercadoimobi:favorites' in s:
              raise SystemExit('Legacy localStorage favorites remain')

          p.write_text(s, encoding='utf-8')

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write src/routes/_authenticated/dashboard.tsx
      - run: npm run lint
      - name: Build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          VITE_SUPABASE_PROJECT_ID: placeholder
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
        run: |
          npm run build
          test -f .output/server/index.mjs
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/dashboard.tsx
          git commit -m "Use persisted favorites in search interface"
          git stash push --include-untracked -m generated || true
          git pull --rebase origin main
          git push origin main
