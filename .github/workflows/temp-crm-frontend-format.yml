name: Temporary CRM frontend formatter

on:
  push:
    branches:
      - ui/crm-dashboard-reference-20260930

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ui/crm-dashboard-reference-20260930
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format CRM frontend files
        run: |
          npx prettier --write \
            src/components/crm/CrmDashboardOverview.tsx \
            src/components/crm/CrmWorkspaceShell.tsx \
            src/styles.css
          git diff --check

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add src/components/crm/CrmDashboardOverview.tsx src/components/crm/CrmWorkspaceShell.tsx src/styles.css
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "style(crm): format reference dashboard"
          git push origin HEAD:ui/crm-dashboard-reference-20260930
