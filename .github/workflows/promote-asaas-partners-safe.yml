name: Promote validated Asaas and Partners safely

on:
  push:
    branches: [feat/activate-parcerias-safe-20260825-v3]

permissions:
  contents: write

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: 615bf4f7e6843c06056177dca81fb5c49e28080a
      EXPECTED_PRODUCTION_SHA: 1ece84a9813f41421316c77af2807dec3e2ebf3b
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PROJECT_ID: example
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate formatting
        run: npx prettier --check src/lib/asaas-billing.server.ts src/lib/billing.functions.ts src/routes/api/public/hooks/asaas.tsx tests/asaas-billing.test.ts src/lib/partner-search.core.ts src/lib/partner-search.functions.ts src/routes/_authenticated/parcerias.tsx src/routes/_authenticated.tsx
      - name: Lint
        run: npm run lint
      - name: Critical tests
        run: npx vitest run tests/critical-flows.spec.ts tests/platform-buttons.test.ts tests/asaas-billing.test.ts
      - name: Production build
        run: npm run build
      - name: Verify exact production base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin production
          CURRENT="$(git rev-parse origin/production)"
          test "$CURRENT" = "$EXPECTED_PRODUCTION_SHA" || {
            echo "::error::Production moved unexpectedly: $CURRENT"
            exit 1
          }
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$EXPECTED_PRODUCTION_SHA" "$TARGET_SHA"
      - name: Promote exact validated commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin "$TARGET_SHA:refs/heads/production"
