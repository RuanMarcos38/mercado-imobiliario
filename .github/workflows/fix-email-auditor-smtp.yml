name: Fix email auditor SMTP

on:
  push:
    paths:
      - .github/workflows/fix-email-auditor-smtp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch auditor and readiness for SMTP Hostinger
        shell: python
        run: |
          from pathlib import Path

          auditor = Path('src/lib/backend-auditor.functions.ts')
          text = auditor.read_text(encoding='utf-8')
          old = '''async function testEmail() {
            return timed(async () => {
              const apiKey = process.env["RESEND_API_KEY"]?.trim();
              const from = process.env["EMAIL_FROM"]?.trim();
              if (!apiKey || !from) {
                return {
                  key: "email-live",
                  label: "E-mail / Resend",
                  category: "Comunicação",
                  critical: false,
                  configured: false,
                  status: "not_configured" as const,
                  detail: "RESEND_API_KEY ou EMAIL_FROM ausentes.",
                };
              }
              const response = await fetch("https://api.resend.com/domains", {
                headers: { Authorization: `Bearer ${apiKey}`, "User-Agent": "MercadoImobi-Backend-Auditor/1.0" },
                signal: AbortSignal.timeout(externalServiceParameters().diagnosticTimeoutMs),
              });
              return {
                key: "email-live",
                label: "E-mail / Resend",
                category: "Comunicação",
                critical: false,
                configured: true,
                status: response.ok ? ("pass" as const) : ("fail" as const),
                detail: response.ok ? `Provedor autenticado para o remetente ${from}.` : `Resend HTTP ${response.status}.`,
              };
            });
          }
          '''
          new = '''async function testEmail() {
            return timed(async () => {
              const { verifyEmailRuntime } = await import("@/lib/smtp-email.server");
              try {
                const result = await verifyEmailRuntime();
                if (!result.configured) {
                  return {
                    key: "email-live",
                    label: "E-mail / SMTP",
                    category: "Comunicação",
                    critical: false,
                    configured: false,
                    status: "not_configured" as const,
                    detail: "SMTP Hostinger ou Resend ainda não configurados.",
                  };
                }
                const provider = result.provider === "smtp-hostinger" ? "SMTP Hostinger" : "Resend";
                return {
                  key: "email-live",
                  label: "E-mail / SMTP",
                  category: "Comunicação",
                  critical: false,
                  configured: true,
                  status: result.ok ? ("pass" as const) : ("fail" as const),
                  detail: result.ok
                    ? `${provider} autenticado para o remetente ${result.from}.`
                    : `${provider} configurado, mas a autenticação falhou.`,
                };
              } catch (error) {
                return {
                  key: "email-live",
                  label: "E-mail / SMTP",
                  category: "Comunicação",
                  critical: false,
                  configured: true,
                  status: "fail" as const,
                  detail: error instanceof Error
                    ? `Falha de autenticação SMTP: ${error.message.slice(0, 180)}`
                    : "Falha de autenticação do provedor de e-mail.",
                };
              }
            });
          }
          '''
          if old not in text:
            raise SystemExit('Bloco testEmail esperado não encontrado; abortando para não alterar código indevido.')
          auditor.write_text(text.replace(old, new, 1), encoding='utf-8')

          params = Path('src/lib/platform-parameters.server.ts')
          text = params.read_text(encoding='utf-8')
          old_line = '    { key: "email", label: "E-mail / Resend", configured: Boolean(process.env["RESEND_API_KEY"]?.trim() && process.env["EMAIL_FROM"]?.trim()) },'
          new_line = '    { key: "email", label: "E-mail / SMTP", configured: Boolean(((process.env["SMTP_PASSWORD"]?.trim() || process.env["SMTP_PASS"]?.trim()) && (process.env["SMTP_USER"]?.trim() || process.env["EMAIL_FROM"]?.trim())) || (process.env["RESEND_API_KEY"]?.trim() && process.env["EMAIL_FROM"]?.trim())) },'
          if old_line not in text:
            raise SystemExit('Linha de readiness de e-mail esperada não encontrada; abortando para não alterar código indevido.')
          params.write_text(text.replace(old_line, new_line, 1), encoding='utf-8')

      - name: Validate
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/backend-auditor.functions.ts src/lib/platform-parameters.server.ts
          git commit -m "fix: valida SMTP Hostinger no auditor"
          git push origin HEAD:main
