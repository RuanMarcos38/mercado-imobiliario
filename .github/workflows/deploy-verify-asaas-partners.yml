name: Deploy and verify Asaas and Partners

on:
  push:
    branches: [feat/activate-parcerias-safe-20260825-v3]

permissions:
  contents: read

jobs:
  deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
      EASYPANEL_DEPLOY_TRIGGER_URL: ${{ secrets.EASYPANEL_DEPLOY_TRIGGER_URL }}
      DEPLOY_TRIGGER_URL: ${{ secrets.DEPLOY_TRIGGER_URL }}
      EASYPANEL_PUBLIC_URL: ${{ vars.EASYPANEL_PUBLIC_URL }}
      EXPECTED_PROJECT: uwzfgksmnqgaxtscwxow
    steps:
      - name: Trigger EasyPanel deploy when hook exists
        shell: bash
        run: |
          set -euo pipefail
          URL="${EASYPANEL_DEPLOY_URL:-${EASYPANEL_DEPLOY_TRIGGER_URL:-${DEPLOY_TRIGGER_URL:-}}}"
          if [ -z "$URL" ]; then
            echo "No deploy hook configured; relying on EasyPanel GitHub auto-deploy."
            exit 0
          fi
          if curl -fsS --connect-timeout 10 --max-time 60 "$URL" -o /tmp/deploy-response.txt; then
            echo "EasyPanel deployment requested with GET."
          else
            curl -fsS -X POST --connect-timeout 10 --max-time 60 "$URL" -o /tmp/deploy-response.txt
            echo "EasyPanel deployment requested with POST."
          fi

      - name: Verify live backend and integrations
        shell: bash
        run: |
          set -euo pipefail
          BASE="${EASYPANEL_PUBLIC_URL:-https://r2rmarketingdigital-mercadoimobi.ke4n49.easypanel.host}"
          BASE="${BASE%/}"
          ready=0
          for attempt in $(seq 1 48); do
            code="$(curl -sS -o /tmp/status.json -w '%{http_code}' --connect-timeout 6 --max-time 12 "$BASE/api/public/status" || true)"
            if [ "$code" = "200" ]; then
              if EXPECTED_PROJECT="$EXPECTED_PROJECT" node - <<'NODE'
          const fs=require('fs');
          try {
            const p=JSON.parse(fs.readFileSync('/tmp/status.json','utf8'));
            const ok=p.status==='operational' && p.search==='available' && String(p.supabaseProjectId||'')===process.env.EXPECTED_PROJECT && p.runtime?.supabaseAdmin==='configured';
            if (!ok) process.exit(1);
            console.log(JSON.stringify({status:p.status, project:p.supabaseProjectId, indexedProperties:p.indexedProperties, coveredStates:p.coveredStates, ai:p.runtime?.ai, googleMaps:p.runtime?.googleMaps}, null, 2));
          } catch { process.exit(1); }
          NODE
              then
                ready=1
                break
              fi
            fi
            echo "Waiting for backend deployment ($attempt/48), HTTP=$code"
            sleep 5
          done
          test "$ready" = "1" || { echo "::error::Backend did not become operational on $BASE"; head -c 1000 /tmp/status.json 2>/dev/null || true; exit 1; }

          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/status.json','utf8'));
          if (p.runtime?.ai !== 'configured' && p.runtime?.googleMaps !== 'configured') {
            throw new Error('Partner search has no external provider configured (OpenAI/Google Maps).');
          }
          NODE

          webhook_code="$(curl -sS -o /tmp/asaas.json -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' --connect-timeout 6 --max-time 12 "$BASE/api/public/hooks/asaas" || true)"
          test "$webhook_code" = "200" || { echo "::error::Asaas webhook route unavailable, HTTP=$webhook_code"; cat /tmp/asaas.json 2>/dev/null || true; exit 1; }
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/asaas.json','utf8'));
          if (p.ok !== true || p.ignored !== true) throw new Error('Unexpected Asaas webhook smoke response');
          NODE

          partners_code="$(curl -sS -o /tmp/parcerias.html -w '%{http_code}' -L --connect-timeout 6 --max-time 15 "$BASE/parcerias" || true)"
          case "$partners_code" in 200|302|303|307|308) ;; *) echo "::error::Parcerias route unavailable, HTTP=$partners_code"; exit 1;; esac
          echo "LIVE_OK base=$BASE partners_http=$partners_code asaas_webhook_http=$webhook_code"
