name: Validate social prospect radar

on:
  push:
    branches:
      - feat/prospect-radar-social-20260825

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PROJECT_ID: example
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply isolated menu patch
        run: python .github/scripts/apply-prospect-radar-menu.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format isolated product files
        run: npx prettier --write src/lib/prospect-leads.core.ts src/lib/prospect-leads.functions.ts src/routes/_authenticated/prospectos.tsx src/routes/_authenticated.tsx tests/prospect-leads.test.ts
      - name: Verify privacy and scope markers
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'Para perfis de consumidores, retorne somente nome/identificador público' src/lib/prospect-leads.functions.ts >/dev/null
          grep -F 'Sem contornar login, privacidade ou anti-bot' src/routes/_authenticated/prospectos.tsx >/dev/null
          grep -F '["/prospectos", "buscar"]' src/routes/_authenticated.tsx >/dev/null
          grep -F 'label: "Prospecção IA"' src/routes/_authenticated.tsx >/dev/null
          grep -F 'lead.profileType === "profissional" && lead.contactIsProfessional === true' src/lib/prospect-leads.core.ts >/dev/null
      - name: Lint
        run: npm run lint
      - name: Prospect radar tests
        run: npx vitest run tests/prospect-leads.test.ts
      - name: Full regression tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit validated product changes only
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- src/routeTree.gen.ts 2>/dev/null || true
          git checkout HEAD -- public/mcp/openapi.json 2>/dev/null || true
          git checkout HEAD -- public/mcp/llms.txt 2>/dev/null || true
          git checkout HEAD -- 'src/routes/[.mcp]/invoke-tool/$tool.ts' 2>/dev/null || true
          git checkout HEAD -- 'src/routes/[.mcp]/list-tools.ts' 2>/dev/null || true
          git checkout HEAD -- 'src/routes/[.well-known]/oauth-protected-resource.ts' 2>/dev/null || true
          git checkout HEAD -- src/routes/mcp.ts 2>/dev/null || true
          changed="$(git diff --name-only | sort)"
          allowed='src/lib/prospect-leads.core.ts
          src/lib/prospect-leads.functions.ts
          src/routes/_authenticated.tsx
          src/routes/_authenticated/prospectos.tsx
          tests/prospect-leads.test.ts'
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "$allowed" | sed 's/^ *//' | grep -Fx "$file" >/dev/null || {
              echo "Unexpected product diff: $file"
              exit 1
            }
          done <<< "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/prospect-leads.core.ts src/lib/prospect-leads.functions.ts src/routes/_authenticated/prospectos.tsx src/routes/_authenticated.tsx tests/prospect-leads.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'feat: adicionar radar público de prospectos imobiliários'
            git push origin HEAD:${{ github.ref_name }}
          fi
