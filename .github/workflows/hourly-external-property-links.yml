name: MercadoImobi hourly external property links

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read

jobs:
  refresh-property-links:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Refresh external property links
        shell: bash
        env:
          BASE_URL: ${{ secrets.MERCADOIMOBI_BASE_URL }}
          JOB_KEY: ${{ secrets.PROPERTY_FEED_SYNC_SECRET }}
        run: |
          set -euo pipefail
          BASE_URL="${BASE_URL:-https://mercadoimobi.rdmconsultoriaimobiliaria.com.br}"
          BASE_URL="${BASE_URL%/}"
          if [ -z "${JOB_KEY:-}" ]; then
            echo "::notice::Configure PROPERTY_FEED_SYNC_SECRET para ativar a atualização horária dos links externos de imóveis."
            exit 0
          fi

          curl -fsS --connect-timeout 10 --max-time 420 \
            -X POST \
            -H "x-mercadoimobi-job-key: ${JOB_KEY}" \
            "${BASE_URL}/api/public/jobs/external-property-links" \
            -o /tmp/property-links.json
          cat /tmp/property-links.json
          echo
