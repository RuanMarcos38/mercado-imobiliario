name: Temporary MercadoImobi admin recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-admin-recovery.yml"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Request password recovery only on dedicated MercadoImobi project
        shell: bash
        run: |
          set -euo pipefail
          HOST='https://r2rmarketingdigital-mercadomobi.ke4n49.easypanel.host'
          PROJECT='rjlqylmwenhzkzmqwris'
          EMAIL='admin@r2rmarketingdigital.com.br'
          OUT='.admin-recovery-status'
          STATUS='not_started'

          curl -fsS --connect-timeout 8 --max-time 20 "$HOST/api/public/status" -o /tmp/status.json
          LIVE_PROJECT="$(node -e 'const p=require("/tmp/status.json"); console.log(String(p.supabaseProjectId||""))')"
          if [ "$LIVE_PROJECT" != "$PROJECT" ]; then
            STATUS='blocked_live_project_mismatch'
          else
            mkdir -p /tmp/assets
            curl -fsS --connect-timeout 8 --max-time 20 "$HOST/auth" -o /tmp/auth.html
            python3 - <<'PY'
          import re, html
          text=open('/tmp/auth.html',encoding='utf-8',errors='ignore').read()
          urls=set()
          for pat in [r'<script[^>]+src=["\']([^"\']+)', r'<link[^>]+href=["\']([^"\']+\.js[^"\']*)']:
              for m in re.finditer(pat,text,re.I): urls.add(html.unescape(m.group(1)))
          open('/tmp/assets.txt','w').write('\n'.join(sorted(urls)))
          PY
            while IFS= read -r SRC; do
              [ -n "$SRC" ] || continue
              case "$SRC" in
                http*) URL="$SRC" ;;
                /*) URL="$HOST$SRC" ;;
                *) URL="$HOST/$SRC" ;;
              esac
              NAME="$(printf '%s' "$SRC" | sha256sum | cut -c1-16).js"
              curl -fsS --connect-timeout 8 --max-time 20 "$URL" -o "/tmp/assets/$NAME" || true
            done < /tmp/assets.txt

            KEY="$(grep -RhoE 'sb_publishable_[A-Za-z0-9_-]+' /tmp/assets /tmp/auth.html 2>/dev/null | head -n1 || true)"
            if [ -z "$KEY" ]; then
              KEY="$(grep -RhoE 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' /tmp/assets /tmp/auth.html 2>/dev/null | head -n1 || true)"
            fi

            if [ -z "$KEY" ]; then
              STATUS='publishable_key_not_found'
            else
              CODE="$(curl -sS --connect-timeout 8 --max-time 20 -w '%{http_code}' \
                -X POST "https://${PROJECT}.supabase.co/auth/v1/recover?redirect_to=${HOST}/auth?type=recovery" \
                -H "apikey: $KEY" \
                -H 'Content-Type: application/json' \
                --data "{\"email\":\"${EMAIL}\"}" \
                -o /tmp/recover.json || true)"
              if [ "$CODE" = '200' ]; then STATUS='request_accepted'; else STATUS="http_${CODE:-000}"; fi
            fi
          fi

          {
            echo "LIVE_PROJECT=$LIVE_PROJECT"
            echo "EXPECTED_PROJECT=$PROJECT"
            echo "RECOVERY_REQUEST=$STATUS"
          } > "$OUT"
          cat "$OUT"

      - name: Record sanitized recovery status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add .admin-recovery-status
          git commit -m "ops: record MercadoImobi admin recovery status" || exit 0
          git push origin HEAD:main
