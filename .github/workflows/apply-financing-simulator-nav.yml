name: Apply financing simulator navigation

on:
  push:
    branches: [feat/simulador-caixa-price]
    paths:
      - .github/workflows/apply-financing-simulator-nav.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/simulador-caixa-price
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add simulator to navigation
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/_authenticated.tsx')
          text = p.read_text()
          if 'Calculator,' not in text:
              text = text.replace('  Bot,\n', '  Bot,\n  Calculator,\n')
          item = '  { to: "/simulador-financiamento", label: "Simulador financiamento", icon: Calculator },\n'
          marker = '  { to: "/analise-localizacao", label: "Análise de localização", icon: MapPin },\n'
          if item not in text:
              text = text.replace(marker, marker + item)
          p.write_text(text)
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/routes/_authenticated.tsx src/routes/_authenticated/simulador-financiamento.tsx
      - run: npm run lint
      - run: npm run test -- --passWithNoTests
      - run: npm run build
      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-financing-simulator-nav.yml
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated.tsx src/routes/_authenticated/simulador-financiamento.tsx .github/workflows/apply-financing-simulator-nav.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: integra simulador PRICE CAIXA à navegação"
          git push origin HEAD:feat/simulador-caixa-price
