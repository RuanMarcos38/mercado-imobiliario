name: Apply property search quality fixes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-property-quality-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correct opportunity ranking and pagination
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          workspace = Path('src/components/property/PropertyWorkspace.tsx')
          text = workspace.read_text()
          start = text.index('function calculateOpportunityKeys(items: PropertySearchItem[]) {')
          end = text.index('function formatPrice(value: number | null) {', start)
          replacement = r'''function comparableGroupKey(item: PropertySearchItem) {
            const location = [item.location_city, item.location_state]
              .filter(Boolean)
              .join("|")
              .trim()
              .toLowerCase();
            const type = (item.property_type || "imóvel").trim().toLowerCase();
            return `${location || "brasil"}|${type}`;
          }

          function comparablePricePerSqm(item: PropertySearchItem) {
            if (
              item.is_auction ||
              item.price == null ||
              item.price <= 0 ||
              item.area_sqm == null ||
              item.area_sqm <= 0
            )
              return null;
            return item.price / item.area_sqm;
          }

          function calculateOpportunityKeys(items: PropertySearchItem[]) {
            const highlighted = new Set(
              items
                .filter((item) => item.discount_percent != null && item.discount_percent >= 10)
                .map((item) => propertyKey(item)),
            );
            const groups = new Map<string, Array<{ key: string; value: number }>>();

            for (const item of items) {
              const value = comparablePricePerSqm(item);
              if (value == null) continue;
              const group = comparableGroupKey(item);
              const current = groups.get(group) ?? [];
              current.push({ key: propertyKey(item), value });
              groups.set(group, current);
            }

            for (const comparables of groups.values()) {
              if (comparables.length < 4) continue;
              const ordered = [...comparables].sort((a, b) => a.value - b.value);
              const middle = Math.floor(ordered.length / 2);
              const median =
                ordered.length % 2 === 0
                  ? (ordered[middle - 1]!.value + ordered[middle]!.value) / 2
                  : ordered[middle]!.value;
              const threshold = median * 0.85;
              for (const entry of ordered) {
                if (entry.value <= threshold) highlighted.add(entry.key);
              }
            }
            return highlighted;
          }

          function calculateBestValueKeys(items: PropertySearchItem[]) {
            const groups = new Map<string, Array<{ key: string; value: number }>>();
            const allComparable: Array<{ key: string; value: number }> = [];

            for (const item of items) {
              const value = comparablePricePerSqm(item);
              if (value == null) continue;
              const entry = { key: propertyKey(item), value };
              allComparable.push(entry);
              const group = comparableGroupKey(item);
              const current = groups.get(group) ?? [];
              current.push(entry);
              groups.set(group, current);
            }

            const best = new Set<string>();
            for (const comparables of groups.values()) {
              if (comparables.length < 2) continue;
              const first = [...comparables].sort((a, b) => a.value - b.value)[0];
              if (first) best.add(first.key);
            }

            if (best.size === 0) {
              for (const entry of allComparable.sort((a, b) => a.value - b.value).slice(0, 3)) {
                best.add(entry.key);
              }
            }
            return best;
          }

          '''
          text = text[:start] + replacement + text[end:]
          text = text.replace('>Menor valor</Badge>', '>Melhor valor/m²</Badge>')
          workspace.write_text(text)

          search = Path('src/lib/property-search.functions.ts')
          source = search.read_text()
          old_fetch = 'const fetchLimit = Math.min(60, Math.max(limit, limit * 2));'
          if old_fetch not in source:
            raise SystemExit('fetchLimit pattern not found')
          source = source.replace(old_fetch, 'const fetchLimit = limit;', 1)
          pattern = re.compile(r'    const total = Math\.max\(\s*items\.length,\s*\(indexResult\.count \?\? 0\) \+ \(propertyResult\.count \?\? 0\) \+ configuredLiveItems\.length,\s*\);')
          replacement_total = '    const indexedTotal = indexResult.count ?? 0;\n    const legacyTotal = propertyResult.count ?? 0;\n    const total = Math.max(items.length, indexedTotal, legacyTotal, configuredLiveItems.length);'
          source, count = pattern.subn(replacement_total, source, count=1)
          if count != 1:
            raise SystemExit(f'total pattern replacements={count}')
          search.write_text(source)
          PY
          npx prettier --write src/components/property/PropertyWorkspace.tsx src/lib/property-search.functions.ts
      - name: Commit corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/property/PropertyWorkspace.tsx src/lib/property-search.functions.ts
          git diff --cached --quiet && exit 0
          git commit -m "Improve property opportunity ranking and pagination"
          git push origin HEAD:main
