name: Patch Asaas onboarding future safely

on:
  push:
    branches: [fix/asaas-onboarding-future-20260825]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PROJECT_ID: example
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch only pending Asaas payments behavior
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/lib/asaas-billing.server.ts')
          s=p.read_text()
          old='      updatePendingPayments: false,'
          new='      updatePendingPayments: true,'
          if old not in s:
            raise SystemExit('expected setting not found')
          p.write_text(s.replace(old,new,1))
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/lib/asaas-billing.server.ts
      - name: Lint
        run: npm run lint
      - name: Critical tests
        run: npx vitest run tests/critical-flows.spec.ts tests/platform-buttons.test.ts tests/asaas-billing.test.ts
      - name: Build
        run: npm run build
      - name: Restore generated files and commit only Asaas file
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            src/routeTree.gen.ts \
            public/mcp/openapi.json \
            public/mcp/llms.txt \
            'src/routes/[.mcp]/invoke-tool/$tool.ts' \
            'src/routes/[.mcp]/list-tools.ts' \
            'src/routes/[.well-known]/oauth-protected-resource.ts' \
            src/routes/mcp.ts
          do
            git checkout HEAD -- "$path" 2>/dev/null || true
          done
          changed="$(git diff --name-only)"
          test "$changed" = "src/lib/asaas-billing.server.ts" || { echo "Unexpected diff:"; echo "$changed"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/asaas-billing.server.ts
          git commit -m 'fix: aplicar mensalidade também às cobranças pendentes futuras'
          git push origin HEAD:${{ github.ref_name }}
