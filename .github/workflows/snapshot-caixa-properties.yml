name: Snapshot CAIXA properties

on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * *"
  push:
    paths:
      - ".github/workflows/snapshot-caixa-properties.yml"

permissions:
  contents: write

jobs:
  fetch-state:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 27
      matrix:
        state: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO]
    steps:
      - name: Download and normalize ${{ matrix.state }}
        shell: python
        env:
          STATE: ${{ matrix.state }}
        run: |
          import csv
          import json
          import os
          import re
          import time
          import urllib.request
          from datetime import datetime, timezone

          state = os.environ["STATE"]

          def number(value):
              value = (value or "").strip()
              if not value:
                  return None
              clean = re.sub(r"[^0-9,.-]", "", value)
              if "," in clean and "." in clean:
                  clean = clean.replace(".", "").replace(",", ".")
              elif "," in clean:
                  clean = clean.replace(",", ".")
              try:
                  return float(clean)
              except ValueError:
                  return None

          def extract(pattern, text):
              match = re.search(pattern, text or "", re.I)
              return number(match.group(1)) if match else None

          def area(text):
              for pattern in [r"([\d.,]+)\s+de área privativa", r"([\d.,]+)\s+de área total", r"([\d.,]+)\s+de área do terreno"]:
                  value = extract(pattern, text)
                  if value and value > 0:
                      return value
              return None

          url = f"https://venda-imoveis.caixa.gov.br/listaweb/Lista_imoveis_{state}.csv"
          request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 MercadoImobi/1.0"})
          text = None
          last_error = None
          for attempt in range(4):
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      candidate = response.read().decode("latin-1")
                  if "Lista de Imóveis da Caixa" not in candidate:
                      raise RuntimeError("Invalid CAIXA response")
                  text = candidate
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt < 3:
                      time.sleep(3 * (attempt + 1))
          if text is None:
              raise RuntimeError(f"CAIXA download failed for {state}: {last_error}")

          lines = [line for line in text.splitlines() if line.strip("; \r\n")]
          if len(lines) < 3 or "Lista de Imóveis da Caixa" not in lines[0]:
              raise RuntimeError(f"Invalid CAIXA response for {state}")

          generation_match = re.search(r"(\d{2}/\d{2}/\d{4})", lines[0])
          generation = generation_match.group(1) if generation_match else None
          generated_at = None
          if generation:
              generated_at = datetime.strptime(generation, "%d/%m/%Y").replace(tzinfo=timezone.utc).isoformat()

          items = []
          reader = csv.reader(lines[2:], delimiter=";", quotechar='"')
          for row in reader:
              if len(row) < 12:
                  continue
              raw_id, raw_state, city, neighborhood, address, raw_price, evaluation, discount, financing, description, sale_mode, source_url = [value.strip() for value in row[:12]]
              if not raw_id or not source_url.startswith("https://venda-imoveis.caixa.gov.br/"):
                  continue

              property_type = description.split(",", 1)[0].strip() if description else None
              bedrooms = extract(r"(\d+)\s*qto\(s\)", description)
              bathrooms = extract(r"(\d+)\s*(?:banheiro|wc)\(s\)?", description)
              details = " • ".join(part for part in [description, f"Modalidade: {sale_mode}" if sale_mode else None, f"Financiamento: {financing}" if financing else None] if part)

              items.append({
                  "title": f"{property_type or 'Imóvel'} em {city or raw_state or 'Brasil'}" + (f" — {neighborhood}" if neighborhood else ""),
                  "description": details or None,
                  "price": number(raw_price),
                  "location_city": city or None,
                  "location_state": raw_state or state,
                  "location_address": address or None,
                  "property_type": property_type,
                  "bedrooms": int(bedrooms) if bedrooms is not None else None,
                  "bathrooms": int(bathrooms) if bathrooms is not None else None,
                  "area_sqm": area(description),
                  "source_url": source_url,
                  "source_portal": "Imóveis CAIXA",
                  "is_verified": True,
                  "scanned_at": generated_at,
                  "metadata": {
                      "official_id": raw_id,
                      "source": "caixa",
                      "generation_date": generation,
                      "sale_mode": sale_mode or None,
                      "financing": financing or None,
                      "evaluation_value": number(evaluation),
                      "discount_percent": number(discount),
                  },
              })

          with open(f"caixa-{state}.json", "w", encoding="utf-8") as handle:
              json.dump({"state": state, "generation_date": generation, "items": items}, handle, ensure_ascii=False)

          print(f"{state}: {len(items)}")

      - name: Upload state snapshot
        uses: actions/upload-artifact@v4
        with:
          name: caixa-${{ matrix.state }}
          path: caixa-${{ matrix.state }}.json
          retention-days: 1

  aggregate:
    runs-on: ubuntu-latest
    needs: fetch-state
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all state snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: caixa-*
          path: snapshots
          merge-multiple: true

      - name: Merge national snapshot
        shell: python
        run: |
          import glob
          import json
          from datetime import datetime, timezone

          items = []
          state_counts = {}
          generation_dates = {}
          for path in sorted(glob.glob("snapshots/caixa-*.json")):
              with open(path, encoding="utf-8") as handle:
                  payload = json.load(handle)
              state = payload["state"]
              state_items = payload.get("items", [])
              items.extend(state_items)
              state_counts[state] = len(state_items)
              generation_dates[state] = payload.get("generation_date")

          if len(state_counts) != 27:
              raise RuntimeError(f"Expected 27 UFs, got {len(state_counts)}")
          if len(items) < 1000:
              raise RuntimeError(f"National CAIXA snapshot unexpectedly small: {len(items)}")

          with open("caixa-properties.json", "w", encoding="utf-8") as handle:
              json.dump({
                  "generated_at": datetime.now(timezone.utc).isoformat(),
                  "state_counts": state_counts,
                  "generation_dates": generation_dates,
                  "items": items,
              }, handle, ensure_ascii=False, separators=(",", ":"))

          print(json.dumps(state_counts, sort_keys=True))
          print(f"TOTAL={len(items)}")

      - name: Upload national snapshot
        uses: actions/upload-artifact@v4
        with:
          name: caixa-properties
          path: caixa-properties.json
          retention-days: 1

      - name: Publish latest snapshot on data-cache branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mercado-imobi-data
          cp caixa-properties.json /tmp/mercado-imobi-data/caixa-properties.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan data-cache
          git rm -rf . || true
          cp /tmp/mercado-imobi-data/caixa-properties.json caixa-properties.json
          git add caixa-properties.json
          git commit -m "Refresh official CAIXA property snapshot"
          git push --force origin data-cache
