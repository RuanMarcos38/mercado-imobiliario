name: Format native hidden flow engine

on:
  push:
    branches:
      - feat/native-hidden-flow-engine

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/native-hidden-flow-engine

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Format changed files
        run: |
          npx prettier --write             src/routes/_authenticated/fluxos.tsx             src/lib/whatsapp-admin.functions.ts             src/lib/whatsapp-auto-reply.server.ts             src/lib/whatsapp-flow-runtime.server.ts             src/lib/n8n-workflow.functions.ts

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/routes/_authenticated/fluxos.tsx             src/lib/whatsapp-admin.functions.ts             src/lib/whatsapp-auto-reply.server.ts             src/lib/whatsapp-flow-runtime.server.ts             src/lib/n8n-workflow.functions.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format native flow engine"
          git push origin HEAD:feat/native-hidden-flow-engine
