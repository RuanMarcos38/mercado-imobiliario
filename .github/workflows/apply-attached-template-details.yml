name: Apply attached template details

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-attached-template-details.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply uploaded template structure details
        shell: python
        run: |
          from pathlib import Path

          workspace = Path("src/components/property/PropertyWorkspace.tsx")
          text = workspace.read_text(encoding="utf-8")
          replacements = [
              (
                  '2xl:grid-cols-[minmax(0,1fr)_320px]',
                  'xl:grid-cols-[minmax(0,1fr)_340px]',
              ),
              (
                  '<h1 className="mt-2 text-2xl font-black tracking-tight sm:text-3xl">Encontre as melhores oportunidades</h1>',
                  '<h1 className="mt-2 text-2xl font-black tracking-tight sm:text-3xl">Encontre imóveis com <span className="text-[var(--mi-accent)]">mais potencial</span></h1>',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"PropertyWorkspace target not found: {old}")
              text = text.replace(old, new, 1)
          workspace.write_text(text, encoding="utf-8")

          panel = Path("src/components/property/DashboardAtendimentoPanel.tsx")
          text = panel.read_text(encoding="utf-8")
          old = 'overflow-hidden 2xl:flex'
          new = 'overflow-hidden xl:flex'
          if old not in text:
              raise SystemExit("DashboardAtendimentoPanel breakpoint target not found")
          panel.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit attached template detail pass
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/property/PropertyWorkspace.tsx src/components/property/DashboardAtendimentoPanel.tsx
          git commit -m "Finish attached SaaS template layout adaptation"
          git push origin HEAD:main
