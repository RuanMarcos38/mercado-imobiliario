name: Fix navbar contrast safely

on:
  push:
    branches: [fix/navbar-contrast-20260825]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PROJECT_ID: example
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch only light-mode navbar background
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/styles.css')
          s = p.read_text()
          marker = '''html.light-mode [class~="bg-[#06101c]"] {\n  background-color: #f8fafc !important;\n}\n'''
          addition = '''html.light-mode [class~="bg-[#06101c]/88"] {\n  background-color: rgba(248, 250, 252, 0.94) !important;\n}\n'''
          if addition in s:
              raise SystemExit('Navbar contrast fix already present')
          if marker not in s:
              raise SystemExit('Expected light-mode background marker not found')
          s = s.replace(marker, marker + '\n' + addition, 1)
          p.write_text(s)
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/styles.css
      - name: Lint
        run: npm run lint
      - name: Critical tests
        run: npx vitest run tests/critical-flows.spec.ts tests/platform-buttons.test.ts
      - name: Build
        run: npm run build
      - name: Commit only stylesheet change
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- src/routeTree.gen.ts 2>/dev/null || true
          git checkout HEAD -- public/mcp/openapi.json 2>/dev/null || true
          git checkout HEAD -- public/mcp/llms.txt 2>/dev/null || true
          changed="$(git diff --name-only)"
          test "$changed" = "src/styles.css" || { echo "Unexpected diff:"; echo "$changed"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles.css
          git commit -m 'fix: corrigir contraste do menu público no modo claro'
          git push origin HEAD:${{ github.ref_name }}
