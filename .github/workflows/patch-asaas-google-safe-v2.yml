name: Validate Asaas and Google fixes

on:
  push:
    branches: [fix/asaas-checkout-google-20260825]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PROJECT_ID: example
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/asaas-checkout-google-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply isolated patch
        run: python scripts/patch-asaas-google-safe.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format changed files
        run: npx prettier --write src/lib/asaas-billing.server.ts src/lib/billing.functions.ts src/routes/api/public/hooks/asaas.tsx src/lib/partner-search.functions.ts
      - name: Lint
        run: npm run lint
      - name: Critical regression tests
        run: npx vitest run tests/critical-flows.spec.ts tests/platform-buttons.test.ts tests/asaas-billing.test.ts
      - name: Production build
        run: npm run build
      - name: Commit validated isolated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: corrigir checkout Asaas e preparar Google Places seguro"
          git push origin HEAD:fix/asaas-checkout-google-20260825
