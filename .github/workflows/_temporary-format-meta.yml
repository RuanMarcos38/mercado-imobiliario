name: Temporary format Meta branch

on:
  push:
    branches: [feat/meta-official-omnichannel-comments]

permissions:
  contents: write

jobs:
  format-and-remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/meta-official-omnichannel-comments

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Format only Meta integration files
        run: |
          npx prettier --write \
            src/lib/meta-social-automation.server.ts \
            src/lib/meta-social.functions.ts \
            src/routes/api/public/oauth/meta.tsx

      - name: Remove temporary workflow and commit formatting
        run: |
          rm .github/workflows/_temporary-format-meta.yml
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add src/lib/meta-social-automation.server.ts src/lib/meta-social.functions.ts src/routes/api/public/oauth/meta.tsx .github/workflows/_temporary-format-meta.yml
          git commit -m "style: format Meta omnichannel integration"
          git push origin HEAD:feat/meta-official-omnichannel-comments
