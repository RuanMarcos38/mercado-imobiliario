name: Validate partner activation

on:
  push:
    branches: [feat/activate-parcerias-safe-20260825-v3]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PROJECT_ID: example
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Partner files format check
        run: npx prettier --check src/lib/partner-search.core.ts src/lib/partner-search.functions.ts src/routes/_authenticated/parcerias.tsx src/routes/_authenticated.tsx
      - name: Lint
        run: npm run lint
      - name: Critical regression tests
        run: npx vitest run tests/critical-flows.spec.ts tests/platform-buttons.test.ts tests/asaas-billing.test.ts
      - name: Production build
        run: npm run build
