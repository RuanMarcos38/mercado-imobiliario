name: Build MercadoImobi Supabase-fixed release

on:
  push:
    paths:
      - ".github/workflows/build-hotfix-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - name: Build without Supabase env
        run: |
          unset VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID
          unset SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_PROJECT_ID SUPABASE_SERVICE_ROLE_KEY
          npm run build
          test -f .output/server/index.mjs
      - name: Smoke test backend
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 HOST=127.0.0.1 NODE_ENV=production node .output/server/index.mjs >/tmp/server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/public/status -o /tmp/status.json; then break; fi
            sleep 1
          done
          cat /tmp/status.json
          grep -q '"status":"operational"' /tmp/status.json
          grep -q '"search":"available"' /tmp/status.json
      - name: Create source package
        shell: bash
        run: |
          zip -qr MercadoImobi_Supabase_Corrigido_Producao.zip . \
            -x '.git/*' \
            -x '.lovable/*' \
            -x 'node_modules/*' \
            -x '.output/*' \
            -x 'dist/*' \
            -x '.github/workflows/build-hotfix-release.yml' \
            -x '.env' -x '.env.*'
          unzip -t MercadoImobi_Supabase_Corrigido_Producao.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: MercadoImobi-Supabase-Corrigido-Producao
          path: MercadoImobi_Supabase_Corrigido_Producao.zip
          retention-days: 1
