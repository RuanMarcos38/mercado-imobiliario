name: Apply user attendance access fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python -m py_compile scripts/apply-user-attendance-access-fixes.py
      - run: python scripts/apply-user-attendance-access-fixes.py
      - run: npx prettier --write src/routes/_authenticated.tsx src/lib/attendance-center.functions.ts src/routes/_authenticated/atendimento.tsx src/lib/whatsapp-tenant.functions.ts
      - run: npm run lint
      - run: npm run test -- --passWithNoTests
      - run: npm run build
      - name: Commit scoped fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: limit user settings and restore attendance messages"
          git push origin HEAD:main
