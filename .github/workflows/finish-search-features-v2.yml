name: Finish search experience v2

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/finish-search-features-v2.yml"

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final search experience fixes
        shell: python
        run: |
          from pathlib import Path

          funcs = Path("src/lib/property-search.functions.ts")
          text = funcs.read_text(encoding="utf-8")
          if "export const listFavoriteProperties" not in text:
              text = text.rstrip() + r'''

          const favoritePropertySchema = z.object({
            id: z.string().min(1),
            title: z.string().min(1),
            description: z.string().nullable(),
            price: z.number().nullable(),
            location_address: z.string().nullable(),
            location_city: z.string().nullable(),
            location_state: z.string().nullable(),
            property_type: z.string().nullable(),
            bedrooms: z.number().nullable(),
            bathrooms: z.number().nullable(),
            area_sqm: z.number().nullable(),
            images: z.array(z.string()).nullable(),
            is_verified: z.boolean().nullable(),
            source_portal: z.string().nullable(),
            source_url: z.string().nullable(),
            updated_at: z.string().nullable(),
          });

          const favoriteMutationSchema = z.object({
            property: favoritePropertySchema,
            favorite: z.boolean(),
          });

          function favoriteKey(property: z.infer<typeof favoritePropertySchema>): string {
            return property.source_url?.trim().toLowerCase() || property.id;
          }

          export const listFavoriteProperties = createServerFn({ method: "GET" })
            .middleware([requireSupabaseAuth])
            .handler(async ({ context }) => {
              const { data, error } = await context.supabase
                .from("property_favorites")
                .select("property_key,property_snapshot,created_at")
                .eq("user_id", context.userId)
                .order("created_at", { ascending: false })
                .limit(100);
              if (error) throw new Error(error.message);

              return (data ?? []).flatMap((row) => {
                const parsed = favoritePropertySchema.safeParse(row.property_snapshot);
                if (!parsed.success) return [];
                return [{ key: row.property_key, property: parsed.data, created_at: row.created_at }];
              });
            });

          export const setPropertyFavorite = createServerFn({ method: "POST" })
            .middleware([requireSupabaseAuth])
            .inputValidator((data: unknown) => favoriteMutationSchema.parse(data))
            .handler(async ({ data, context }) => {
              const propertyKey = favoriteKey(data.property);

              if (!data.favorite) {
                const { error } = await context.supabase
                  .from("property_favorites")
                  .delete()
                  .eq("user_id", context.userId)
                  .eq("property_key", propertyKey);
                if (error) throw new Error(error.message);
                return { success: true, favorite: false, propertyKey };
              }

              const snapshot = JSON.parse(JSON.stringify(data.property));
              const { error } = await context.supabase.from("property_favorites").upsert(
                {
                  user_id: context.userId,
                  property_key: propertyKey,
                  property_snapshot: snapshot,
                  updated_at: new Date().toISOString(),
                },
                { onConflict: "user_id,property_key" },
              );
              if (error) throw new Error(error.message);
              return { success: true, favorite: true, propertyKey };
            });

          const savedSearchUpdateSchema = z.object({
            id: z.string().uuid(),
            name: z.string().trim().min(1).max(80),
          });

          export const renameSavedPropertySearch = createServerFn({ method: "POST" })
            .middleware([requireSupabaseAuth])
            .inputValidator((data: unknown) => savedSearchUpdateSchema.parse(data))
            .handler(async ({ data, context }) => {
              const { error } = await context.supabase
                .from("search_configurations")
                .update({ name: data.name, updated_at: new Date().toISOString() })
                .eq("id", data.id)
                .eq("user_id", context.userId);
              if (error) throw new Error(error.message);
              return { success: true };
            });

          const savedSearchDeleteSchema = z.object({ id: z.string().uuid() });

          export const deleteSavedPropertySearch = createServerFn({ method: "POST" })
            .middleware([requireSupabaseAuth])
            .inputValidator((data: unknown) => savedSearchDeleteSchema.parse(data))
            .handler(async ({ data, context }) => {
              const { error } = await context.supabase
                .from("search_configurations")
                .delete()
                .eq("id", data.id)
                .eq("user_id", context.userId);
              if (error) throw new Error(error.message);
              return { success: true };
            });
          ''' + "\n"
          funcs.write_text(text, encoding="utf-8")

          types = Path("src/integrations/supabase/types.ts")
          text = types.read_text(encoding="utf-8")
          if "      property_favorites: {" not in text:
              marker = "      property_search_index: {"
              block = r'''      property_favorites: {
                Row: {
                  created_at: string;
                  id: string;
                  property_key: string;
                  property_snapshot: Json;
                  updated_at: string;
                  user_id: string;
                };
                Insert: {
                  created_at?: string;
                  id?: string;
                  property_key: string;
                  property_snapshot: Json;
                  updated_at?: string;
                  user_id: string;
                };
                Update: {
                  created_at?: string;
                  id?: string;
                  property_key?: string;
                  property_snapshot?: Json;
                  updated_at?: string;
                  user_id?: string;
                };
                Relationships: [];
              };
          '''
              if marker not in text:
                  raise SystemExit("property_search_index marker not found")
              text = text.replace(marker, block + marker, 1)
          types.write_text(text, encoding="utf-8")

          dash = Path("src/routes/_authenticated/dashboard.tsx")
          text = dash.read_text(encoding="utf-8")

          if "  Pencil," not in text:
              text = text.replace("  MapPin,\n  Ruler,", "  MapPin,\n  Pencil,\n  Ruler,")
          if "  Trash2," not in text:
              text = text.replace("  Sparkles,\n  UserRound,", "  Sparkles,\n  Trash2,\n  UserRound,")

          old_import = '''import {
            listSavedPropertySearches,
            savePropertySearch,
            searchRealProperties,
          } from "@/lib/property-search.functions";'''
          new_import = '''import {
            deleteSavedPropertySearch,
            listFavoriteProperties,
            listSavedPropertySearches,
            renameSavedPropertySearch,
            savePropertySearch,
            searchRealProperties,
            setPropertyFavorite,
          } from "@/lib/property-search.functions";'''
          if old_import in text:
              text = text.replace(old_import, new_import, 1)

          initial = '''const initialFilters: FilterState = {
            city: "",
            state: "",
            propertyType: "",
            minPrice: "",
            maxPrice: "",
            bedrooms: "",
            bathrooms: "",
            verifiedOnly: false,
            sort: "recent",
          };
          '''
          if "function getPropertyKey" not in text:
              text = text.replace(initial, initial + '''
          function getPropertyKey(property: PropertySearchItem) {
            return property.source_url?.trim().toLowerCase() || property.id;
          }
          ''', 1)

          old = '''  const searchFn = useServerFn(searchRealProperties);
            const saveSearchFn = useServerFn(savePropertySearch);
            const listSavedFn = useServerFn(listSavedPropertySearches);
          '''
          new = '''  const searchFn = useServerFn(searchRealProperties);
            const saveSearchFn = useServerFn(savePropertySearch);
            const listSavedFn = useServerFn(listSavedPropertySearches);
            const renameSavedFn = useServerFn(renameSavedPropertySearch);
            const deleteSavedFn = useServerFn(deleteSavedPropertySearch);
            const listFavoritesFn = useServerFn(listFavoriteProperties);
            const setFavoriteFn = useServerFn(setPropertyFavorite);
          '''
          if old in text:
              text = text.replace(old, new, 1)

          old = '''  const [showCompare, setShowCompare] = useState(false);
            const [showSaved, setShowSaved] = useState(false);
          '''
          new = '''  const [showCompare, setShowCompare] = useState(false);
            const [showSaved, setShowSaved] = useState(false);
            const [showFavorites, setShowFavorites] = useState(false);
          '''
          if old in text:
              text = text.replace(old, new, 1)

          saved_query = '''  const savedSearches = useQuery({
            queryKey: ["saved-property-searches", user?.id],
            queryFn: () => listSavedFn(),
            enabled: Boolean(user),
          });
          '''
          if "const favoriteProperties = useQuery" not in text:
              text = text.replace(saved_query, saved_query + '''
          const favoriteProperties = useQuery({
            queryKey: ["property-favorites", user?.id],
            queryFn: () => listFavoritesFn(),
            enabled: Boolean(user),
          });
          ''', 1)

          local_effect = '''  useEffect(() => {
            try {
              const raw = window.localStorage.getItem("mercadoimobi:favorites");
              if (raw) setFavorites(new Set(JSON.parse(raw)));
            } catch {
              setFavorites(new Set());
            }
          }, []);
          '''
          db_effect = '''  useEffect(() => {
            if (favoriteProperties.data) {
              setFavorites(new Set(favoriteProperties.data.map((item) => item.key)));
            }
          }, [favoriteProperties.data]);
          '''
          if local_effect in text:
              text = text.replace(local_effect, db_effect, 1)

          old_toggle = '''  const toggleFavorite = (id: string) => {
            const next = new Set(favorites);
            if (next.has(id)) next.delete(id);
            else next.add(id);
            setFavorites(next);
            window.localStorage.setItem("mercadoimobi:favorites", JSON.stringify(Array.from(next)));
          };
          '''
          new_toggle = '''  const toggleFavorite = async (property: PropertySearchItem) => {
            const key = getPropertyKey(property);
            const nextFavorite = !favorites.has(key);
            const previous = new Set(favorites);
            const optimistic = new Set(favorites);
            if (nextFavorite) optimistic.add(key);
            else optimistic.delete(key);
            setFavorites(optimistic);

            try {
              await setFavoriteFn({ data: { property, favorite: nextFavorite } });
              await favoriteProperties.refetch();
              toast.success(nextFavorite ? "Imóvel salvo nos favoritos." : "Imóvel removido dos favoritos.");
            } catch {
              setFavorites(previous);
              toast.error("Não foi possível atualizar seus favoritos agora.");
            }
          };
          '''
          if old_toggle in text:
              text = text.replace(old_toggle, new_toggle, 1)

          if "const handleRenameSavedSearch" not in text:
              marker = "  const applySavedSearch = (criteria: unknown) => {"
              handlers = '''  const handleRenameSavedSearch = async (id: string, currentName: string) => {
            const name = window.prompt("Novo nome da pesquisa:", currentName);
            if (!name?.trim() || name.trim() === currentName) return;
            try {
              await renameSavedFn({ data: { id, name: name.trim() } });
              await savedSearches.refetch();
              toast.success("Pesquisa renomeada.");
            } catch {
              toast.error("Não foi possível renomear a pesquisa agora.");
            }
          };

          const handleDeleteSavedSearch = async (id: string, name: string) => {
            if (!window.confirm(`Excluir a pesquisa “${name}”?`)) return;
            try {
              await deleteSavedFn({ data: { id } });
              await savedSearches.refetch();
              toast.success("Pesquisa excluída.");
            } catch {
              toast.error("Não foi possível excluir a pesquisa agora.");
            }
          };

          '''
              if marker not in text:
                  raise SystemExit("saved search handler marker not found")
              text = text.replace(marker, handlers + marker, 1)

          old_nav = '''            <button
              onClick={() =>
                document.getElementById("resultados")?.scrollIntoView({ behavior: "smooth" })
              }
              className="transition hover:text-white"
            >
              Favoritos ({favorites.size})
            </button>
          '''
          new_nav = '''            <button
              onClick={() => setShowFavorites(true)}
              className="transition hover:text-white"
            >
              Favoritos ({favorites.size})
            </button>
          '''
          if old_nav in text:
              text = text.replace(old_nav, new_nav, 1)

          old_saved = '''              {(savedSearches.data ?? []).map((saved) => (
                <button
                  key={saved.id}
                  onClick={() => applySavedSearch(saved.criteria)}
                  className="w-full rounded-2xl border border-white/10 bg-white/[0.03] p-4 text-left transition hover:border-cyan-300/30 hover:bg-cyan-300/[0.04]"
                >
                  <span className="font-semibold">{saved.name}</span>
                  <span className="mt-1 block text-xs text-slate-400">Abrir esta pesquisa</span>
                </button>
              ))}
          '''
          new_saved = '''              {(savedSearches.data ?? []).map((saved) => (
                <div
                  key={saved.id}
                  className="rounded-2xl border border-white/10 bg-white/[0.03] p-4 transition hover:border-cyan-300/30 hover:bg-cyan-300/[0.04]"
                >
                  <button
                    onClick={() => applySavedSearch(saved.criteria)}
                    className="w-full text-left"
                  >
                    <span className="font-semibold">{saved.name}</span>
                    <span className="mt-1 block text-xs text-slate-400">Abrir esta pesquisa</span>
                  </button>
                  <div className="mt-3 flex gap-2 border-t border-white/10 pt-3">
                    <button
                      onClick={() => void handleRenameSavedSearch(saved.id, saved.name)}
                      className="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-slate-300 hover:bg-white/5"
                    >
                      <Pencil className="h-3.5 w-3.5" /> Renomear
                    </button>
                    <button
                      onClick={() => void handleDeleteSavedSearch(saved.id, saved.name)}
                      className="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-rose-200 hover:bg-rose-400/10"
                    >
                      <Trash2 className="h-3.5 w-3.5" /> Excluir
                    </button>
                  </div>
                </div>
              ))}
          '''
          if old_saved in text:
              text = text.replace(old_saved, new_saved, 1)

          if "Sua seleção" not in text:
              marker = "      <main>\n"
              drawer = '''      {showFavorites && (
            <div
              className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm"
              onClick={() => setShowFavorites(false)}
            >
              <div
                className="ml-auto h-full w-full max-w-lg overflow-y-auto border-l border-white/10 bg-[#0b1727] p-6 shadow-2xl"
                onClick={(event) => event.stopPropagation()}
              >
                <div className="mb-6 flex items-center justify-between">
                  <div>
                    <p className="text-xs font-semibold uppercase tracking-[0.2em] text-cyan-300">
                      Sua seleção
                    </p>
                    <h2 className="mt-1 text-xl font-bold">Imóveis favoritos</h2>
                  </div>
                  <button
                    onClick={() => setShowFavorites(false)}
                    className="rounded-lg p-2 text-slate-400 hover:bg-white/5"
                  >
                    <X className="h-5 w-5" />
                  </button>
                </div>

                <div className="space-y-3">
                  {(favoriteProperties.data ?? []).map(({ key, property }) => (
                    <div
                      key={key}
                      className="rounded-2xl border border-white/10 bg-white/[0.03] p-4"
                    >
                      <div className="flex items-start justify-between gap-3">
                        <div className="min-w-0">
                          <p className="text-lg font-black text-cyan-100">{formatPrice(property.price)}</p>
                          <h3 className="mt-1 line-clamp-2 font-semibold">{property.title}</h3>
                          <p className="mt-1 text-xs text-slate-400">
                            {[property.location_city, property.location_state].filter(Boolean).join(" - ") ||
                              "Localização no anúncio"}
                          </p>
                        </div>
                        <button
                          onClick={() => void toggleFavorite(property)}
                          className="grid h-9 w-9 shrink-0 place-items-center rounded-full border border-rose-300/30 bg-rose-500 text-white"
                          title="Remover dos favoritos"
                        >
                          <Heart className="h-4 w-4 fill-current" />
                        </button>
                      </div>
                      {property.source_url && (
                        <a
                          href={property.source_url}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="mt-3 inline-flex items-center gap-2 text-xs font-bold text-cyan-200 hover:text-cyan-100"
                        >
                          Ver anúncio original <ExternalLink className="h-3.5 w-3.5" />
                        </a>
                      )}
                    </div>
                  ))}
                  {!favoriteProperties.isLoading && (favoriteProperties.data?.length ?? 0) === 0 && (
                    <div className="rounded-2xl border border-dashed border-white/15 p-6 text-center text-sm text-slate-400">
                      Você ainda não favoritou nenhum imóvel.
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          '''
              if marker not in text:
                  raise SystemExit("main marker not found")
              text = text.replace(marker, drawer + marker, 1)

          text = text.replace(
              '''                  favorite={favorites.has(property.id)}
                  comparing={compareIds.includes(property.id)}
                  onFavorite={() => toggleFavorite(property.id)}
          ''',
              '''                  favorite={favorites.has(getPropertyKey(property))}
                  comparing={compareIds.includes(property.id)}
                  onFavorite={() => void toggleFavorite(property)}
          ''',
          )

          dash.write_text(text, encoding="utf-8")

          migration = Path("supabase/migrations/20260815205500_property_favorites.sql")
          migration.parent.mkdir(parents=True, exist_ok=True)
          migration.write_text(r'''create table if not exists public.property_favorites (
            id uuid primary key default gen_random_uuid(),
            user_id uuid not null references auth.users(id) on delete cascade,
            property_key text not null,
            property_snapshot jsonb not null,
            created_at timestamptz not null default timezone('utc', now()),
            updated_at timestamptz not null default timezone('utc', now()),
            unique(user_id, property_key)
          );

          alter table public.property_favorites enable row level security;

          drop policy if exists "Users can view their own property favorites" on public.property_favorites;
          create policy "Users can view their own property favorites"
          on public.property_favorites for select to authenticated
          using (auth.uid() = user_id);

          drop policy if exists "Users can add their own property favorites" on public.property_favorites;
          create policy "Users can add their own property favorites"
          on public.property_favorites for insert to authenticated
          with check (auth.uid() = user_id);

          drop policy if exists "Users can update their own property favorites" on public.property_favorites;
          create policy "Users can update their own property favorites"
          on public.property_favorites for update to authenticated
          using (auth.uid() = user_id)
          with check (auth.uid() = user_id);

          drop policy if exists "Users can delete their own property favorites" on public.property_favorites;
          create policy "Users can delete their own property favorites"
          on public.property_favorites for delete to authenticated
          using (auth.uid() = user_id);

          create index if not exists idx_property_favorites_user_created
          on public.property_favorites(user_id, created_at desc);

          create index if not exists idx_property_favorites_property_key
          on public.property_favorites(property_key);
          ''', encoding="utf-8")

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format changed TypeScript
        run: npx prettier --write src/lib/property-search.functions.ts src/integrations/supabase/types.ts src/routes/_authenticated/dashboard.tsx

      - name: Lint
        run: npm run lint

      - name: Run safe tests
        run: npm run test -- --exclude tests/tenant-isolation.test.ts --exclude tests/critical-flows.spec.ts --passWithNoTests

      - name: Build production application
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          VITE_SUPABASE_PROJECT_ID: placeholder
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
        run: |
          npm run build
          test -f .output/server/index.mjs

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/property-search.functions.ts src/integrations/supabase/types.ts src/routes/_authenticated/dashboard.tsx supabase/migrations/20260815205500_property_favorites.sql
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Persist property favorites and manage saved searches"
          git pull --rebase origin main
          git push
