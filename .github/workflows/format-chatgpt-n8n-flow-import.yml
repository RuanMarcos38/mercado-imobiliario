name: Format ChatGPT n8n flow import

on:
  push:
    branches:
      - feat/chatgpt-json-n8n-flow-import

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/chatgpt-json-n8n-flow-import

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Format changed TypeScript
        run: |
          npx prettier --write             src/routes/_authenticated/fluxos.tsx             src/lib/n8n-workflow.functions.ts

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/fluxos.tsx src/lib/n8n-workflow.functions.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format ChatGPT and n8n flow import"
          git push origin HEAD:feat/chatgpt-json-n8n-flow-import
