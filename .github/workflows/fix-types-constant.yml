name: Repair Supabase generated constants

on:
  push:
    paths:
      - ".github/workflows/fix-types-constant.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize user_type constant with database enum
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/integrations/supabase/types.ts")
          text = path.read_text(encoding="utf-8")
          old = 'user_type: ["corretor", "imobiliaria", "proprietario", "construtora", "admin"],'
          new = 'user_type: ["cliente", "corretor", "imobiliaria", "proprietario", "construtora", "admin"],'
          if old not in text:
              if new in text:
                  print("constant already synchronized")
              else:
                  raise SystemExit("expected user_type constant not found")
          else:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/integrations/supabase/types.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrations/supabase/types.ts
          git commit -m "Synchronize Supabase user type constants"
          git pull --rebase origin main
          git push origin main
