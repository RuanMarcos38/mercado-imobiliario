name: Repair VRSYNC CDATA parsing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-property-feed-cdata.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode CDATA before removing nested markup
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/lib/property-feed.server.ts")
          text = path.read_text(encoding="utf-8")
          old = '    if (match?.[1]) return cleanText(decodeXml(match[1].replace(/<[^>]+>/g, " ")));'
          new = '''    if (match?.[1]) {
              const decoded = decodeXml(match[1]);
              return cleanText(decoded.replace(/<[^>]+>/g, " "));
            }'''
          if old not in text:
              raise SystemExit("Expected CDATA parser line was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/property-feed.server.ts
          git commit -m "Fix VRSYNC CDATA description parsing"
          git push origin HEAD:main
