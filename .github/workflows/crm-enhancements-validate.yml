name: CRM enhancements validation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python scripts/apply-crm-process-enhancements.py
      - run: npx prettier --write src/components/attendance/AttendanceDistributionPanel.tsx src/components/crm/CrmContactProfilePanel.tsx src/components/crm/CrmDiagnosticsPanel.tsx src/components/crm/CrmOperationsHub.tsx src/components/crm/CrmPipelineWorkspace.tsx src/components/crm/CrmReportsPanel.tsx src/components/crm/CrmWorkspaceShell.tsx src/lib/attendance-center.functions.ts src/lib/attendance-distribution.functions.ts src/lib/crm-advanced.functions.ts src/lib/crm-operations.functions.ts src/routes/_authenticated/atendimento.tsx src/routes/_authenticated/crm.tsx tests/platform-buttons.test.ts scripts/apply-crm-process-enhancements.py
      - run: npm run lint
      - run: npm run test -- --passWithNoTests
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          unset VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID
          unset SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_PROJECT_ID SUPABASE_SERVICE_ROLE_KEY
          npm run build
          test -f .output/server/index.mjs
      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add src/components src/lib src/routes tests/platform-buttons.test.ts scripts/apply-crm-process-enhancements.py
          git commit -m "feat: complete CRM pipeline and attendance process enhancements"
          git push origin HEAD:main
