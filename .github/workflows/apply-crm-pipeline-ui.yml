name: Apply CRM pipeline integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Patch CRM integration
        shell: python
        run: |
          from pathlib import Path

          layout = Path('src/routes/_authenticated.tsx')
          text = layout.read_text()
          marker = '  { to: "/atendimento", label: "Atendimento WhatsApp", icon: MessageCircle },\n'
          addition = marker + '  { to: "/crm", label: "CRM / Oportunidades", icon: Users },\n'
          if 'label: "CRM / Oportunidades"' not in text:
              if marker not in text:
                  raise SystemExit('navigation marker not found')
              text = text.replace(marker, addition, 1)
              layout.write_text(text)

          tests = Path('tests/platform-buttons.test.ts')
          text = tests.read_text()
          if '      "/crm",\n' not in text:
              marker = '      "/atendimento",\n'
              if marker not in text:
                  raise SystemExit('route marker not found')
              text = text.replace(marker, marker + '      "/crm",\n', 1)
          text = text.replace(
              'expect(layout).not.toContain(\'label: "CRM / Oportunidades"\');',
              'expect(layout).toContain(\'label: "CRM / Oportunidades"\');',
          )
          text = text.replace(
              'it("keeps CRM and unrelated communication tools out of the visible MercadoImobi menu", () => {',
              'it("keeps the real estate CRM visible while unrelated communication tools stay out", () => {',
          )
          tests.write_text(text)

          crm = Path('src/components/crm/CrmPipelineWorkspace.tsx')
          text = crm.read_text()
          text = text.replace('  UserRoundPlus,\n', '')
          text = text.replace(
              '  const activePipeline = workspace.data.pipelines.find((item) => item.id === pipelineId);\n\n',
              '',
          )
          old = '''  pipelines: NonNullable<ReturnType<typeof useQuery>["data"]> extends never
    ? never
    : Array<{
        id: string;
        name: string;
        description: string | null;
        is_default: boolean;
        is_active: boolean;
      }>;'''
          new = '''  pipelines: Array<{
    id: string;
    name: string;
    description: string | null;
    is_default: boolean;
    is_active: boolean;
  }>;'''
          text = text.replace(old, new)
          crm.write_text(text)
      - name: Format CRM changes
        run: npx prettier --write src/components/crm/CrmPipelineWorkspace.tsx src/lib/crm-advanced.functions.ts src/routes/_authenticated/crm.tsx src/routes/_authenticated.tsx tests/platform-buttons.test.ts
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test -- --passWithNoTests
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          unset VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID
          unset SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_PROJECT_ID SUPABASE_SERVICE_ROLE_KEY
          npm run build
          test -f .output/server/index.mjs
      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add src/components/crm/CrmPipelineWorkspace.tsx src/lib/crm-advanced.functions.ts src/routes/_authenticated/crm.tsx src/routes/_authenticated.tsx tests/platform-buttons.test.ts
          git commit -m "fix: validate advanced real estate CRM pipeline"
          git push origin HEAD:main
