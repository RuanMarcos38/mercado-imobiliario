name: Build MercadoImobi release package

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-release-package.yml"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint source
        run: npm run lint

      - name: Run safe automated tests
        run: npm run test -- --exclude tests/tenant-isolation.test.ts --exclude tests/critical-flows.spec.ts --passWithNoTests

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          VITE_SUPABASE_PROJECT_ID: placeholder
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
        run: |
          npm run build
          test -f .output/server/index.mjs

      - name: Verify no private env file is tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development|test)$'; then
            echo "Private environment file found in repository"
            exit 1
          fi

      - name: Create deployable source archive
        shell: bash
        run: |
          set -euo pipefail
          zip -qr MercadoImobi_Producao_Final.zip . \
            -x '.git/*' \
            -x '.lovable/*' \
            -x 'node_modules/*' \
            -x '.output/*' \
            -x 'dist/*' \
            -x '.nitro/*' \
            -x '.tanstack/*' \
            -x '.vinxi/*' \
            -x '.github/workflows/build-release-package.yml' \
            -x '.env' \
            -x '.env.local' \
            -x '.env.production' \
            -x '.env.development' \
            -x '.env.test'
          unzip -t MercadoImobi_Producao_Final.zip >/dev/null

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: MercadoImobi-Producao-Final
          path: MercadoImobi_Producao_Final.zip
          retention-days: 1
