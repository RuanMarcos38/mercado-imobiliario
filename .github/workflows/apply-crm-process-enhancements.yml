name: Apply CRM process enhancements

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Integrate CRM and attendance enhancements
        shell: python
        run: |
          from pathlib import Path

          attendance = Path('src/routes/_authenticated/atendimento.tsx')
          text = attendance.read_text()
          marker = 'import { AttendanceDecisionDashboard } from "@/components/attendance/AttendanceDecisionDashboard";\n'
          if 'AttendanceDistributionPanel' not in text:
              if marker not in text: raise SystemExit('attendance import marker not found')
              text = text.replace(marker, marker + 'import { AttendanceDistributionPanel } from "@/components/attendance/AttendanceDistributionPanel";\n', 1)
          button = '''            <Button
              variant="outline"
              onClick={() => window.location.assign("/fluxos")}
              className="mt-2 h-10 w-full rounded-xl border-[var(--mi-border)] font-black"
            >
              <Bot className="mr-2 h-4 w-4" /> Configurar agente de IA e automático
            </Button>
'''
          if '<AttendanceDistributionPanel />' not in text:
              if button not in text: raise SystemExit('attendance distribution button marker not found')
              text = text.replace(button, button + '            <div className="mt-2"><AttendanceDistributionPanel /></div>\n', 1)
          list_marker = '                  <span className="mt-0.5 flex items-center gap-2">\n'
          if 'conversation.protocol_code' not in text:
              if list_marker not in text: raise SystemExit('conversation list marker not found')
              text = text.replace(list_marker, '                  <span className="mt-1 block text-[10px] font-black uppercase tracking-[0.08em] text-blue-600">{conversation.protocol_code}</span>\n' + list_marker, 1)
          phone_block = '''                  <p className="mt-0.5 flex items-center gap-1 text-xs text-[var(--mi-text-soft)]">
                    {selected.phone_masked && <LockKeyhole className="h-3 w-3" />}
                    {selected.phone_e164}
                  </p>
'''
          if 'Protocolo {selected.protocol_code}' not in text:
              if phone_block not in text: raise SystemExit('selected protocol marker not found')
              text = text.replace(phone_block, phone_block + '                  <p className="mt-1 text-[10px] font-black uppercase tracking-[0.08em] text-blue-600">Protocolo {selected.protocol_code}</p>\n', 1)
          attendance.write_text(text)

          center = Path('src/lib/attendance-center.functions.ts')
          text = center.read_text()
          if 'protocol_code: string;' not in text:
              text = text.replace('export interface AttendanceConversation {\n  id: string;\n', 'export interface AttendanceConversation {\n  id: string;\n  protocol_code: string;\n', 1)
          old_select = '"id,phone_e164,contact_name,avatar_url,last_message,last_message_at,unread_count,assigned_user_id",'
          new_select = '"id,protocol_code,phone_e164,contact_name,avatar_url,last_message,last_message_at,unread_count,assigned_user_id",'
          text = text.replace(old_select, new_select, 1)
          if 'protocol_code: String(row.protocol_code' not in text:
              text = text.replace('        id: String(row.id),\n        phone_e164:', '        id: String(row.id),\n        protocol_code: String(row.protocol_code ?? ""),\n        phone_e164:', 1)
          queue_tail = '''      "Conversa enviada para fila humana",
    );
    return { success: true, waitingSince: now };
'''
          if 'p_force: true' not in text:
              if queue_tail not in text: raise SystemExit('queue distribution marker not found')
              replacement = '''      "Conversa enviada para fila humana",
    );
    const distributed = await db.rpc("attendance_distribute_conversation", {
      p_tenant_id: tenantId,
      p_conversation_id: data.conversationId,
      p_force: true,
    });
    if (distributed.error) throw new Error(distributed.error.message);
    return { success: true, waitingSince: now, assignedUserId: distributed.data ?? null };
'''
              text = text.replace(queue_tail, replacement, 1)
          claim_guard = '''    if (
      state.state === "in_service" &&
      state.assignedUserId &&
      state.assignedUserId !== context.userId
    ) {
      throw new Error("Esta conversa já está em atendimento por outro usuário.");
    }
'''
          if 'Esta conversa foi distribuída para outro usuário.' not in text:
              if claim_guard not in text: raise SystemExit('claim guard marker not found')
              text = text.replace(claim_guard, claim_guard + '''    if (
      state.state === "waiting" &&
      state.assignedUserId &&
      state.assignedUserId !== context.userId
    ) {
      throw new Error("Esta conversa foi distribuída para outro usuário.");
    }
''', 1)
          center.write_text(text)

          advanced = Path('src/lib/crm-advanced.functions.ts')
          text = advanced.read_text()
          if '  protocol_code: string;\n' not in text:
              text = text.replace('export type CrmOpportunity = {\n  id: string;\n', 'export type CrmOpportunity = {\n  id: string;\n  protocol_code: string;\n', 1)
          text = text.replace(
              '"id,pipeline_id,stage_id,owner_user_id,conversation_id,contact_name,contact_phone,contact_email,property_reference,source,value,probability,status,loss_reason_id,notes,tags,custom_values,expected_close_date,next_action_at,last_activity_at,created_at,updated_at",',
              '"id,protocol_code,pipeline_id,stage_id,owner_user_id,conversation_id,contact_name,contact_phone,contact_email,property_reference,source,value,probability,status,loss_reason_id,notes,tags,custom_values,expected_close_date,next_action_at,last_activity_at,created_at,updated_at",',
              1,
          )
          advanced.write_text(text)

          pipeline = Path('src/components/crm/CrmPipelineWorkspace.tsx')
          text = pipeline.read_text()
          marker = 'import { Textarea } from "@/components/ui/textarea";\n'
          if 'CrmContactProfilePanel' not in text:
              if marker not in text: raise SystemExit('CRM contact import marker not found')
              text = text.replace(marker, marker + 'import { CrmContactProfilePanel } from "@/components/crm/CrmContactProfilePanel";\n', 1)
          card = '<p className="truncate font-black">{item.contact_name}</p>\n'
          if '{item.protocol_code}' not in text:
              if card not in text: raise SystemExit('CRM card marker not found')
              text = text.replace(card, card + '                              <p className="mt-0.5 truncate text-[10px] font-black uppercase tracking-[0.08em] text-blue-600">{item.protocol_code}</p>\n', 1)
          activities_marker = '          {editing && (activitiesByOpportunity.get(editing.id)?.length ?? 0) > 0 && (\n'
          if '<CrmContactProfilePanel opportunityId={editing.id} />' not in text:
              if activities_marker not in text: raise SystemExit('CRM activities marker not found')
              text = text.replace(activities_marker, '          {editing && <CrmContactProfilePanel opportunityId={editing.id} />}\n\n' + activities_marker, 1)
          pipeline.write_text(text)

          operations = Path('src/lib/crm-operations.functions.ts')
          text = operations.read_text()
          old_phone = '''    } else if (payload.phone_e164) {
      const upserted = await admin
        .from("crm_contacts")
        .upsert(payload, { onConflict: "tenant_id,phone_e164" })
        .select("id")
        .single();
      if (upserted.error) throw new Error(upserted.error.message);
      contactId = upserted.data.id;
    } else {
'''
          new_phone = '''    } else if (payload.phone_e164) {
      const existing = await admin
        .from("crm_contacts")
        .select("id")
        .eq("tenant_id", tenantId)
        .eq("phone_e164", payload.phone_e164)
        .maybeSingle();
      if (existing.error) throw new Error(existing.error.message);
      if (existing.data) {
        contactId = existing.data.id;
        const updated = await admin
          .from("crm_contacts")
          .update(payload)
          .eq("tenant_id", tenantId)
          .eq("id", contactId);
        if (updated.error) throw new Error(updated.error.message);
      } else {
        const inserted = await admin.from("crm_contacts").insert(payload).select("id").single();
        if (inserted.error) throw new Error(inserted.error.message);
        contactId = inserted.data.id;
      }
    } else {
'''
          if old_phone in text:
              text = text.replace(old_phone, new_phone, 1)
          operations.write_text(text)

          tests = Path('tests/platform-buttons.test.ts')
          text = tests.read_text()
          if 'CrmWorkspaceShell' not in text:
              text += '''\n\nit("keeps the CRM process enhancements visible without renaming the existing application structure", () => {\n  const shell = read("src/components/crm/CrmWorkspaceShell.tsx");\n  expect(shell).toContain('label: "Pipeline"');\n  expect(shell).toContain('label: "Propostas"');\n  expect(shell).toContain('label: "E-mails"');\n  expect(shell).toContain('label: "Documentos"');\n  expect(shell).toContain('label: "Assinaturas"');\n  expect(shell).toContain('label: "Relatórios"');\n  expect(shell).not.toContain("Kanban");\n  const attendance = read("src/routes/_authenticated/atendimento.tsx");\n  expect(attendance).toContain("AttendanceDistributionPanel");\n  expect(attendance).toContain("protocol_code");\n});\n'''
          tests.write_text(text)
      - name: Format enhanced CRM files
        run: npx prettier --write src/components/attendance/AttendanceDistributionPanel.tsx src/components/crm/CrmContactProfilePanel.tsx src/components/crm/CrmDiagnosticsPanel.tsx src/components/crm/CrmOperationsHub.tsx src/components/crm/CrmReportsPanel.tsx src/components/crm/CrmWorkspaceShell.tsx src/lib/attendance-center.functions.ts src/lib/attendance-distribution.functions.ts src/lib/crm-advanced.functions.ts src/lib/crm-operations.functions.ts src/routes/_authenticated/atendimento.tsx src/routes/_authenticated/crm.tsx tests/platform-buttons.test.ts
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test -- --passWithNoTests
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          unset VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID
          unset SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_PROJECT_ID SUPABASE_SERVICE_ROLE_KEY
          npm run build
          test -f .output/server/index.mjs
      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add src/components src/lib src/routes tests/platform-buttons.test.ts
          git commit -m "feat: complete CRM pipeline and attendance process enhancements"
          git push origin HEAD:main
