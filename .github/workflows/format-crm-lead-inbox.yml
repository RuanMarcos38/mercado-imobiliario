name: Format CRM lead inbox

on:
  push:
    branches:
      - main
    paths:
      - "src/lib/crm-lead-inbox.functions.ts"
      - "src/components/crm/CrmLeadInboxPanel.tsx"

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/lib/crm-lead-inbox.functions.ts src/components/crm/CrmLeadInboxPanel.tsx
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/crm-lead-inbox.functions.ts src/components/crm/CrmLeadInboxPanel.tsx
          git commit -m "style: format CRM lead inbox [skip format]"
          git push origin HEAD:main
