name: Release residential sale security migration

on:
  push:
    branches: [release/residential-sale-security-20260825]

permissions:
  contents: write

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/residential-sale-security-20260825
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test -- --passWithNoTests

      - name: Build
        run: npm run build

      - name: Verify migration security
        shell: bash
        run: |
          set -euo pipefail
          FILE=supabase/migrations/20260825160000_secure_residential_sale_filter_functions.sql
          grep -q 'search_path = public, pg_temp' "$FILE"
          grep -q 'from public, anon, authenticated' "$FILE"
          grep -q 'guard_property_search_index_residential_sale' "$FILE"

      - name: Commit final release tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-residential-sale-security.yml
          git add supabase/migrations/20260825160000_secure_residential_sale_filter_functions.sql
          git commit -m "db: secure residential sale filter functions" || true

      - name: Promote targeted release to production
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin production
          git push --force-with-lease origin HEAD:refs/heads/production
