name: Validate safe partner search release on production

on:
  push:
    branches: [release/parcerias-production-20260825]
    paths:
      - .github/workflows/release-parcerias-production.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PROJECT_ID: example
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Fetch validated partner-search implementation from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:src/routes/_authenticated/parcerias.tsx > src/routes/_authenticated/parcerias.tsx
          git show origin/main:src/lib/partner-search.core.ts > src/lib/partner-search.core.ts
          git show origin/main:src/lib/partner-search.functions.ts > src/lib/partner-search.functions.ts
          git show origin/main:tests/partner-search.test.ts > /tmp/partner-search.test.ts
      - name: Add only partnership route and menu entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/routes/_authenticated.tsx')
          text = path.read_text(encoding='utf-8')
          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)
          replace_once('  Gavel,\n  LayoutDashboard,', '  Gavel,\n  Handshake,\n  LayoutDashboard,', 'Handshake import')
          replace_once('  ["/buscar", "buscar"],\n  ["/leiloes", "leiloes"],', '  ["/buscar", "buscar"],\n  ["/parcerias", "buscar"],\n  ["/leiloes", "leiloes"],', 'feature route')
          replace_once('  { to: "/crm", label: "CRM / Oportunidades", icon: Users, feature: "crm" },\n  { to: "/afiliados",', '  { to: "/crm", label: "CRM / Oportunidades", icon: Users, feature: "crm" },\n  { to: "/parcerias", label: "Parcerias imobiliárias", icon: Handshake, feature: "buscar" },\n  { to: "/afiliados",', 'tools menu')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Format only partnership files
        run: npx prettier --write src/routes/_authenticated.tsx src/routes/_authenticated/parcerias.tsx src/lib/partner-search.core.ts src/lib/partner-search.functions.ts
      - name: Verify isolated scope
        shell: bash
        run: |
          set -euo pipefail
          grep -F '["/parcerias", "buscar"]' src/routes/_authenticated.tsx
          grep -F 'label: "Parcerias imobiliárias"' src/routes/_authenticated.tsx
          grep -F 'createFileRoute("/_authenticated/parcerias")' src/routes/_authenticated/parcerias.tsx
          grep -F 'searchRealEstatePartners' src/lib/partner-search.functions.ts
          python - <<'PY'
          import subprocess
          expected = {
              'src/lib/partner-search.core.ts',
              'src/lib/partner-search.functions.ts',
              'src/routes/_authenticated.tsx',
              'src/routes/_authenticated/parcerias.tsx',
          }
          lines = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          paths = {line[3:] for line in lines if line.strip()}
          if paths != expected:
              raise SystemExit(f'Unexpected changed files: {sorted(paths)}')
          PY
      - name: Lint
        run: npm run lint
      - name: Critical regression tests
        run: npx vitest run tests/critical-flows.spec.ts tests/platform-buttons.test.ts
      - name: Partner search unit test
        shell: bash
        run: |
          cp /tmp/partner-search.test.ts tests/partner-search.test.ts
          npx vitest run tests/partner-search.test.ts
          rm tests/partner-search.test.ts
      - name: Production build
        run: npm run build
      - name: Commit only validated partnership files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated.tsx src/routes/_authenticated/parcerias.tsx src/lib/partner-search.core.ts src/lib/partner-search.functions.ts
          git commit -m "feat: liberar busca de parcerias imobiliárias na produção"
          git push origin HEAD:${GITHUB_REF_NAME}
