name: Temporary apply attendance migration

on:
  push:
    branches: [feature/atendimento-suri-senior]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_PROJECT_ID: ${{ vars.MERCADOIMOBI_SUPABASE_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atendimento-suri-senior
      - name: Apply additive attendance migration safely
        id: migrate
        shell: bash
        run: |
          set +e
          MIGRATION="supabase/migrations/20260824153000_atendimento_operacional_privacidade.sql"
          STATUS="UNKNOWN"

          if [ "${EXPECTED_PROJECT_ID:-}" != "rjlqylmwenhzkzmqwris" ]; then
            STATUS="TARGET_MISMATCH"
          else
            URL="${SUPABASE_DB_URL:-${SUPABASE_DATABASE_URL:-${DIRECT_URL:-${DATABASE_URL:-}}}}"
            if [ -n "$URL" ]; then
              case "$URL" in
                *rjlqylmwenhzkzmqwris*)
                  psql "$URL" -v ON_ERROR_STOP=1 -1 -f "$MIGRATION"
                  if [ "$?" -eq 0 ]; then STATUS="SUCCESS"; else STATUS="CONNECTION_OR_SQL_FAILURE"; fi
                  ;;
                *)
                  STATUS="UNSAFE_DATABASE_URL_REJECTED"
                  ;;
              esac
            elif [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
              export PGPASSWORD="$SUPABASE_DB_PASSWORD"
              psql "host=db.rjlqylmwenhzkzmqwris.supabase.co port=5432 dbname=postgres user=postgres sslmode=require connect_timeout=15" -v ON_ERROR_STOP=1 -1 -f "$MIGRATION"
              if [ "$?" -eq 0 ]; then STATUS="SUCCESS"; else STATUS="CONNECTION_OR_SQL_FAILURE"; fi
            else
              STATUS="NO_DATABASE_SECRET"
            fi
          fi

          printf '%s\n' "$STATUS" > .attendance-migration-status
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Attendance migration result: $STATUS"
          exit 0
      - name: Commit generic migration status marker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add .attendance-migration-status
          if ! git diff --cached --quiet; then
            git commit -m "chore: record attendance migration status"
            git push origin HEAD:feature/atendimento-suri-senior
          fi
      - name: Require successful migration
        if: steps.migrate.outputs.status != 'SUCCESS'
        shell: bash
        run: |
          echo "::error::Attendance migration did not complete: ${{ steps.migrate.outputs.status }}"
          exit 1
