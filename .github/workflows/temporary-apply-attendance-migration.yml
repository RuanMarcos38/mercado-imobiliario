name: Temporary apply attendance migration

on:
  push:
    branches: [feature/atendimento-suri-senior]

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atendimento-suri-senior

      - name: Ensure dedicated MercadoImobi project variable
        id: variable
        shell: bash
        run: |
          set +e
          TARGET="rjlqylmwenhzkzmqwris"
          API="repos/${GITHUB_REPOSITORY}/actions/variables/MERCADOIMOBI_SUPABASE_PROJECT_ID"
          gh api --method PATCH "$API" -f name=MERCADOIMOBI_SUPABASE_PROJECT_ID -f value="$TARGET" >/dev/null 2>&1
          CODE=$?
          if [ "$CODE" -ne 0 ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/variables" -f name=MERCADOIMOBI_SUPABASE_PROJECT_ID -f value="$TARGET" >/dev/null 2>&1
            CODE=$?
          fi
          if [ "$CODE" -eq 0 ]; then
            echo "status=SUCCESS" >> "$GITHUB_OUTPUT"
            echo "Repository variable configured for the dedicated MercadoImobi project."
          else
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            echo "Repository variable could not be updated with this workflow token."
          fi
          exit 0

      - name: Apply additive attendance migration safely
        id: migrate
        shell: bash
        run: |
          set +e
          TARGET="rjlqylmwenhzkzmqwris"
          MIGRATION="supabase/migrations/20260824153000_atendimento_operacional_privacidade.sql"
          STATUS="UNKNOWN"
          URL="${SUPABASE_DB_URL:-${SUPABASE_DATABASE_URL:-${DIRECT_URL:-${DATABASE_URL:-}}}}"

          if [ -n "$URL" ]; then
            case "$URL" in
              *rjlqylmwenhzkzmqwris*)
                psql "$URL" -v ON_ERROR_STOP=1 -1 -f "$MIGRATION"
                if [ "$?" -eq 0 ]; then STATUS="SUCCESS"; else STATUS="CONNECTION_OR_SQL_FAILURE"; fi
                ;;
              *)
                STATUS="UNSAFE_DATABASE_URL_REJECTED"
                ;;
            esac
          elif [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            export PGPASSWORD="$SUPABASE_DB_PASSWORD"
            psql "host=db.${TARGET}.supabase.co port=5432 dbname=postgres user=postgres sslmode=require connect_timeout=15" -v ON_ERROR_STOP=1 -1 -f "$MIGRATION"
            if [ "$?" -eq 0 ]; then STATUS="SUCCESS"; else STATUS="CONNECTION_OR_SQL_FAILURE"; fi
          else
            STATUS="NO_DATABASE_SECRET"
          fi

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Attendance migration result: $STATUS"
          exit 0

      - name: Commit generic migration status marker
        shell: bash
        env:
          VARIABLE_STATUS: ${{ steps.variable.outputs.status }}
          MIGRATION_STATUS: ${{ steps.migrate.outputs.status }}
        run: |
          set -euo pipefail
          printf 'VARIABLE=%s\nMIGRATION=%s\n' "$VARIABLE_STATUS" "$MIGRATION_STATUS" > .attendance-migration-status
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add .attendance-migration-status
          if ! git diff --cached --quiet; then
            git commit -m "chore: record attendance migration status"
            git push origin HEAD:feature/atendimento-suri-senior
          fi

      - name: Require successful setup
        if: steps.variable.outputs.status != 'SUCCESS' || steps.migrate.outputs.status != 'SUCCESS'
        shell: bash
        run: |
          echo "::error::Attendance setup did not complete. Variable=${{ steps.variable.outputs.status }} Migration=${{ steps.migrate.outputs.status }}"
          exit 1
