name: Apply exact Lovable template

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-exact-lovable-template.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Lovable template visual system and property pagination
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) Reset the redesigned product to the Lovable template's default light canvas.
          theme = Path("src/components/ThemeToggle.tsx")
          text = theme.read_text(encoding="utf-8")
          text = text.replace('const STORAGE_KEY = "mercadoimobi-theme";', 'const STORAGE_KEY = "mercadoimobi-theme-v2";')
          text = text.replace('if (typeof window === "undefined") return "dark";', 'if (typeof window === "undefined") return "light";')
          text = text.replace('return window.matchMedia?.("(prefers-color-scheme: light)").matches ? "light" : "dark";', 'return "light";')
          text = text.replace('const [theme, setTheme] = useState<AppTheme>("dark");', 'const [theme, setTheme] = useState<AppTheme>("light");')
          theme.write_text(text, encoding="utf-8")

          root = Path("src/routes/__root.tsx")
          text = root.read_text(encoding="utf-8")
          text = text.replace("localStorage.getItem('mercadoimobi-theme')", "localStorage.getItem('mercadoimobi-theme-v2')")
          old = """    var theme = saved === 'light' || saved === 'dark'\n      ? saved\n      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');"""
          new = """    var theme = saved === 'light' || saved === 'dark' ? saved : 'light';"""
          if old in text:
              text = text.replace(old, new, 1)
          links_old = """    links: [\n      { rel: \"stylesheet\", href: appCss },"""
          links_new = """    links: [\n      { rel: \"preconnect\", href: \"https://fonts.googleapis.com\" },\n      { rel: \"preconnect\", href: \"https://fonts.gstatic.com\", crossOrigin: \"\" },\n      { rel: \"stylesheet\", href: \"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Urbanist:wght@200;300;400;500;600;700;800;900&display=swap\" },\n      { rel: \"stylesheet\", href: appCss },"""
          if links_old not in text:
              raise SystemExit("Root stylesheet target not found")
          text = text.replace(links_old, links_new, 1)
          root.write_text(text, encoding="utf-8")

          # 2) Property backend: add real offset pagination and real filtered counts.
          search = Path("src/lib/property-search.functions.ts")
          text = search.read_text(encoding="utf-8")
          schema_target = '  limit: z.number().int().min(1).max(60).optional().default(30),\n});'
          if schema_target not in text:
              raise SystemExit("Search schema target not found")
          text = text.replace(schema_target, '  limit: z.number().int().min(1).max(60).optional().default(30),\n  offset: z.number().int().min(0).max(100000).optional().default(0),\n});', 1)
          text = text.replace('.select(\n        "id,title,description,price,location_address,location_city,location_state,property_type,bedrooms,bathrooms,area_sqm,images,is_verified,source_portal,source_url,scanned_at,listing_market,is_auction,sale_mode,contact_name,contact_phone,contact_whatsapp,contact_email",\n      );', '.select(\n        "id,title,description,price,location_address,location_city,location_state,property_type,bedrooms,bathrooms,area_sqm,images,is_verified,source_portal,source_url,scanned_at,listing_market,is_auction,sale_mode,contact_name,contact_phone,contact_whatsapp,contact_email",\n        { count: "exact" },\n      );', 1)
          text = text.replace('.select(\n        "id,title,description,price,location_address,location_city,location_state,property_type,bedrooms,bathrooms,area_sqm,images,is_verified,source_portal,source_url,updated_at",\n      );', '.select(\n        "id,title,description,price,location_address,location_city,location_state,property_type,bedrooms,bathrooms,area_sqm,images,is_verified,source_portal,source_url,updated_at",\n        { count: "exact" },\n      );', 1)
          limit_target = """    const limit = input.limit ?? 30;\n    const fetchLimit = Math.min(60, Math.max(limit, limit * 2));\n    indexQuery = indexQuery.limit(fetchLimit);\n    propertyQuery = propertyQuery.limit(fetchLimit);"""
          limit_new = """    const limit = input.limit ?? 30;\n    const offset = input.offset ?? 0;\n    const fetchLimit = Math.min(60, Math.max(limit, limit * 2));\n    indexQuery = indexQuery.range(offset, offset + fetchLimit - 1);\n    propertyQuery = propertyQuery.range(offset, offset + fetchLimit - 1);"""
          if limit_target not in text:
              raise SystemExit("Search pagination target not found")
          text = text.replace(limit_target, limit_new, 1)
          text = text.replace('input.market === "market" || input.market === "all" ? propertyQuery : Promise.resolve({ data: [], error: null }),', 'input.market === "market" || input.market === "all" ? propertyQuery : Promise.resolve({ data: [], error: null, count: 0 }),', 1)
          return_target = '    return { items, total: items.length, latestTimestamp };'
          return_new = '    const total = Math.max(items.length, (indexResult.count ?? 0) + (propertyResult.count ?? 0) + configuredLiveItems.length);\n    return { items, total, latestTimestamp, offset, limit };'
          if return_target not in text:
              raise SystemExit("Search return target not found")
          text = text.replace(return_target, return_new, 1)
          search.write_text(text, encoding="utf-8")

          # 3) Main workspace: use the exact Lovable composition: centered editorial header, max-w-6xl and sticky right card.
          workspace = Path("src/components/property/PropertyWorkspace.tsx")
          text = workspace.read_text(encoding="utf-8")
          state_target = '  const [applied, setApplied] = useState<Filters>(() => emptyFilters(initialMarket));\n'
          if state_target not in text:
              raise SystemExit("Workspace state target not found")
          text = text.replace(state_target, state_target + '  const [page, setPage] = useState(1);\n', 1)
          query_target = '    queryKey: ["properties", applied],\n    queryFn: () => searchFn({ data: toInput(applied) }),' 
          query_new = '    queryKey: ["properties", applied, page],\n    queryFn: () => searchFn({ data: { ...toInput(applied), offset: (page - 1) * 48 } }),' 
          if query_target not in text:
              raise SystemExit("Workspace query target not found")
          text = text.replace(query_target, query_new, 1)
          text = text.replace('        setApplied(next);\n        return next;', '        setPage(1);\n        setApplied(next);\n        return next;', 1)
          text = text.replace('    setFilters(next);\n    setApplied(next);\n  };', '    setPage(1);\n    setFilters(next);\n    setApplied(next);\n  };', 1)
          text = text.replace('    setFilters(next);\n    setApplied(next);\n  };\n\n  const toggleFavorite', '    setPage(1);\n    setFilters(next);\n    setApplied(next);\n  };\n\n  const toggleFavorite', 1)
          text = text.replace('onClick={() => setApplied({ ...filters })}', 'onClick={() => { setPage(1); setApplied({ ...filters }); }}', 1)

          old_open = '      <div className="mx-auto max-w-[1760px] px-4 py-5 sm:px-5 xl:px-6">\n        <div className="grid gap-5 xl:grid-cols-[minmax(0,1fr)_340px]">'
          new_open = '''      <div className="px-4 py-6 sm:px-6 sm:py-10 lg:px-8">\n        <div className="mx-auto max-w-6xl space-y-10 sm:space-y-12">\n          <header className="mi-template-header mx-auto max-w-3xl space-y-3 text-center">\n            <p className="font-mono text-[10px] uppercase tracking-[0.22em] text-muted-foreground">MERCADOIMOBI · BUSCA NACIONAL</p>\n            <h1 className="text-4xl font-semibold tracking-tighter sm:text-5xl lg:text-6xl" style={{ fontFamily: "Urbanist, system-ui, -apple-system, sans-serif" }}>\n              Encontre seu <span className="text-primary">imóvel ideal</span>\n            </h1>\n            <p className="text-balance text-sm text-muted-foreground sm:text-base">\n              Consulte imóveis reais de múltiplas fontes, compare oportunidades e acompanhe novos anúncios em um único ambiente.\n            </p>\n          </header>\n\n          <div className="grid grid-cols-1 gap-6 lg:grid-cols-[1fr_minmax(380px,440px)]">'''
          if old_open not in text:
              raise SystemExit("Workspace outer layout target not found")
          text = text.replace(old_open, new_open, 1)

          text, hero_count = re.subn(r'\n\s*<section className="mi-hero[\s\S]*?</section>\n', '\n', text, count=1)
          if hero_count != 1:
              raise SystemExit("Workspace legacy hero was not removed")

          close_target = '          <DashboardAtendimentoPanel />\n        </div>\n      </div>\n\n      {selected && ('
          close_new = '          <DashboardAtendimentoPanel />\n          </div>\n        </div>\n      </div>\n\n      {selected && ('
          if close_target not in text:
              raise SystemExit("Workspace closing target not found")
          text = text.replace(close_target, close_new, 1)

          results_grid = '''              {!searchQuery.isLoading && results.length > 0 && (\n                <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-3">'''
          if results_grid not in text:
              raise SystemExit("Results grid target not found")
          # Two columns fit the Lovable 1fr + sticky 440px workspace more faithfully.
          text = text.replace(results_grid, '''              {!searchQuery.isLoading && results.length > 0 && (\n                <div className="grid gap-4 md:grid-cols-2">''', 1)

          pager_anchor = '''                </div>\n              )}\n            </section>'''
          pager = '''                </div>\n              )}\n              {!searchQuery.isLoading && !searchQuery.isError && (searchQuery.data?.total ?? 0) > 48 && (\n                <div className="mt-6 flex items-center justify-between rounded-2xl bg-card px-4 py-3 ring-1 ring-black/5 shadow-card">\n                  <button\n                    type="button"\n                    onClick={() => setPage((current) => Math.max(1, current - 1))}\n                    disabled={page === 1}\n                    className="rounded-md px-3 py-2 text-xs font-medium text-muted-foreground transition hover:bg-muted hover:text-foreground disabled:cursor-not-allowed disabled:opacity-40"\n                  >\n                    Anterior\n                  </button>\n                  <span className="font-mono text-[10px] uppercase tracking-[0.18em] text-muted-foreground">\n                    Página {page} de {Math.max(1, Math.ceil((searchQuery.data?.total ?? 0) / 48))}\n                  </span>\n                  <button\n                    type="button"\n                    onClick={() => setPage((current) => current + 1)}\n                    disabled={page >= Math.ceil((searchQuery.data?.total ?? 0) / 48)}\n                    className="rounded-md px-3 py-2 text-xs font-medium text-muted-foreground transition hover:bg-muted hover:text-foreground disabled:cursor-not-allowed disabled:opacity-40"\n                  >\n                    Próxima\n                  </button>\n                </div>\n              )}\n            </section>'''
          if pager_anchor not in text:
              raise SystemExit("Pager insertion target not found")
          text = text.replace(pager_anchor, pager, 1)
          workspace.write_text(text, encoding="utf-8")

          # 4) Make Atendimento occupy the same sticky results-card position from the template.
          panel = Path("src/components/property/DashboardAtendimentoPanel.tsx")
          text = panel.read_text(encoding="utf-8")
          old_panel = '    <aside className="mi-card mi-chat-panel hidden min-h-[680px] flex-col overflow-hidden xl:flex">'
          if old_panel not in text:
              raise SystemExit("Atendimento panel target not found")
          text = text.replace(old_panel, '    <aside className="mi-results-card hidden min-h-[680px] flex-col overflow-hidden lg:sticky lg:top-20 lg:self-start lg:flex">', 1)
          panel.write_text(text, encoding="utf-8")

          # 5) Append an exact visual adapter based on the Lovable ZIP design system.
          css = Path("src/mercadoimobi.css")
          text = css.read_text(encoding="utf-8")
          marker = "/* LOVABLE_EXACT_TEMPLATE_V2 */"
          if marker in text:
              text = text.split(marker)[0].rstrip() + "\n"
          text += r'''\n\n/* LOVABLE_EXACT_TEMPLATE_V2 */\n:root,\nhtml.light-mode {\n  --font-sans: 'Inter', system-ui, sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, monospace;\n  --mi-bg: oklch(0.985 0.005 95);\n  --mi-surface: oklch(1 0 0);\n  --mi-surface-soft: oklch(0.96 0.005 90);\n  --mi-surface-strong: oklch(0.94 0.005 90);\n  --mi-text: oklch(0.16 0.01 60);\n  --mi-text-muted: oklch(0.5 0.01 70);\n  --mi-text-soft: oklch(0.62 0.01 75);\n  --mi-border: oklch(0.92 0.005 90);\n  --mi-border-soft: oklch(0.94 0.005 90);\n  --mi-hover: oklch(0.96 0.005 90);\n  --mi-accent: oklch(0.55 0.22 262);\n  --mi-accent-strong: oklch(0.48 0.22 262);\n  --mi-accent-soft: color-mix(in oklab, var(--mi-accent) 9%, transparent);\n  --mi-topbar: color-mix(in oklab, var(--mi-bg) 80%, transparent);\n  --mi-chat-canvas: oklch(0.96 0.005 90);\n  --mi-chat-incoming: oklch(1 0 0);\n  --mi-chat-outgoing: color-mix(in oklab, var(--mi-accent) 13%, white);\n  --shadow-card: 0 1px 0 rgba(0,0,0,0.02), 0 8px 24px -16px rgba(18,18,17,0.08);\n  --shadow-lift: 0 1px 0 rgba(0,0,0,0.04), 0 16px 48px -20px rgba(18,18,17,0.16);\n  --gradient-results: radial-gradient(120% 80% at 0% 0%, oklch(0.28 0.08 260) 0%, oklch(0.16 0.04 255) 45%, oklch(0.10 0.02 250) 100%);\n}\n\nhtml.dark-mode,\nhtml.dark {\n  --mi-bg: oklch(0.16 0.01 60);\n  --mi-surface: oklch(0.20 0.01 60);\n  --mi-surface-soft: oklch(0.25 0.01 60);\n  --mi-surface-strong: oklch(0.27 0.01 60);\n  --mi-text: oklch(0.985 0.005 95);\n  --mi-text-muted: oklch(0.7 0.01 70);\n  --mi-text-soft: oklch(0.58 0.01 70);\n  --mi-border: oklch(1 0 0 / 8%);\n  --mi-border-soft: oklch(1 0 0 / 5%);\n  --mi-hover: oklch(0.25 0.01 60);\n  --mi-accent: oklch(0.65 0.22 262);\n  --mi-accent-strong: oklch(0.72 0.20 262);\n  --mi-accent-soft: color-mix(in oklab, var(--mi-accent) 12%, transparent);\n  --mi-topbar: color-mix(in oklab, var(--mi-bg) 80%, transparent);\n  --mi-chat-canvas: oklch(0.17 0.01 60);\n  --mi-chat-incoming: oklch(0.24 0.01 60);\n  --mi-chat-outgoing: color-mix(in oklab, var(--mi-accent) 25%, oklch(0.18 0.01 60));\n  --shadow-card: 0 1px 0 rgba(255,255,255,0.02), 0 8px 24px -16px rgba(0,0,0,0.55);\n  --shadow-lift: 0 1px 0 rgba(255,255,255,0.03), 0 16px 48px -20px rgba(0,0,0,0.72);\n}\n\nhtml.light-mode body,\nhtml.dark-mode body {\n  background: var(--mi-bg) !important;\n  color: var(--mi-text) !important;\n  font-family: var(--font-sans) !important;\n  font-feature-settings: "ss01", "cv11";\n  -webkit-font-smoothing: antialiased;\n}\n\n.mi-shell { background: var(--mi-bg) !important; color: var(--mi-text) !important; font-family: var(--font-sans); }\n.mi-appbar { background: var(--mi-topbar) !important; border-color: var(--mi-border) !important; backdrop-filter: blur(12px); }\n.mi-brand-mark { background: transparent !important; border-radius: 0 !important; color: var(--mi-accent) !important; }\n.mi-topnav-link { background: transparent !important; border: 0 !important; box-shadow: none !important; font-size: 0.72rem; font-weight: 500; }\n.mi-topnav-link-active { color: var(--mi-text) !important; background: transparent !important; outline: 0 !important; box-shadow: none !important; }\n.mi-topnav-link-active svg { color: var(--mi-accent) !important; }\n.mi-toolbar-button, .mi-account-button, .mi-icon-button { border-color: transparent !important; background: transparent !important; box-shadow: none !important; }\n.mi-toolbar-button:hover, .mi-account-button:hover, .mi-icon-button:hover { background: var(--mi-hover) !important; }\n.mi-nav-popover, .mi-mobile-menu { background: var(--mi-surface) !important; border-color: var(--mi-border) !important; box-shadow: var(--shadow-lift) !important; }\n.mi-global-search { background: var(--mi-surface) !important; border-color: var(--mi-border) !important; border-radius: 0.55rem !important; }\n\n.mi-template-header h1,\n.mi-shell h1,\n.mi-shell h2 { font-family: 'Urbanist', system-ui, -apple-system, sans-serif; }\n.mi-template-header h1 { font-weight: 600 !important; letter-spacing: -0.045em !important; }\n.mi-shell [class*="uppercase"][class*="tracking-"] { font-family: var(--font-mono); }\n\n.mi-hero { display: none !important; }\n.mi-card, .mi-panel, .mi-kpi-card, .mi-filter-panel, .mi-property-card {\n  background: var(--mi-surface) !important;\n  color: var(--mi-text) !important;\n  border-color: transparent !important;\n  box-shadow: var(--shadow-card) !important;\n  outline: 1px solid color-mix(in oklab, var(--mi-text) 5%, transparent);\n}\n.mi-kpi-card, .mi-filter-panel, .mi-property-card { border-radius: 1rem !important; }\n.mi-filter-panel { padding: 1.5rem !important; }\n.mi-filter-field, .mi-input { background: var(--mi-bg) !important; border-color: var(--mi-border) !important; }\n.mi-property-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-lift) !important; }\n\n.mi-results-card {\n  border-radius: 1rem;\n  background: var(--gradient-results);\n  color: white;\n  box-shadow: var(--shadow-lift);\n  outline: 1px solid rgba(255,255,255,0.08);\n  --mi-text: #ffffff;\n  --mi-text-muted: rgba(255,255,255,0.66);\n  --mi-text-soft: rgba(255,255,255,0.42);\n  --mi-border: rgba(255,255,255,0.10);\n  --mi-border-soft: rgba(255,255,255,0.06);\n  --mi-hover: rgba(255,255,255,0.06);\n  --mi-surface: rgba(255,255,255,0.04);\n  --mi-surface-soft: rgba(255,255,255,0.055);\n  --mi-surface-strong: rgba(255,255,255,0.08);\n  --mi-chat-canvas: rgba(0,0,0,0.10);\n  --mi-chat-incoming: rgba(255,255,255,0.08);\n  --mi-chat-outgoing: color-mix(in oklab, var(--mi-accent) 55%, transparent);\n}\n.mi-results-card .mi-icon-button { color: rgba(255,255,255,0.72) !important; border-color: rgba(255,255,255,0.10) !important; }\n\n/* Normalize legacy dark-only pages to the exact Lovable card system. */\n.mi-shell [class*="bg-[#06101c]"] { background: var(--mi-bg) !important; color: var(--mi-text) !important; }\n.mi-shell [class*="max-w-[1500px]"], .mi-shell [class*="max-w-[1400px]"] { max-width: 72rem !important; }\n.mi-shell [class*="rounded-[26px]"] { border-radius: 1rem !important; }\n.mi-shell [class*="bg-white/[0.04]"],\n.mi-shell [class*="bg-white/[0.035]"],\n.mi-shell [class*="bg-white/[0.05]"] { background: var(--mi-surface) !important; box-shadow: var(--shadow-card) !important; }\n.mi-shell [class*="bg-black/10"], .mi-shell [class*="bg-black/15"], .mi-shell [class*="bg-[#081421]"] { background: var(--mi-surface-soft) !important; }\n.mi-shell [class*="border-white/10"], .mi-shell [class*="border-white/15"] { border-color: var(--mi-border) !important; }\n.mi-shell [class*="text-slate-300"], .mi-shell [class*="text-slate-400"] { color: var(--mi-text-muted) !important; }\n.mi-shell [class*="text-slate-500"], .mi-shell [class*="text-slate-600"] { color: var(--mi-text-soft) !important; }\n.mi-shell [class*="text-cyan-300"], .mi-shell [class*="text-cyan-200"], .mi-shell [class*="text-cyan-100"] { color: var(--mi-accent) !important; }\n.mi-shell [class*="bg-cyan-300"] { background: var(--mi-text) !important; color: var(--mi-bg) !important; }\n.mi-shell [class*="text-[#06101c]"] { color: var(--mi-bg) !important; }\n.mi-shell select option { background: var(--mi-surface) !important; color: var(--mi-text) !important; }\n\n@media (max-width: 1023px) {\n  .mi-template-header h1 { font-size: clamp(2.5rem, 9vw, 4rem); }\n}\n'''
          css.write_text(text, encoding="utf-8")

          # 6) Tests: guarantee exact template primitives and full-base pagination remain present.
          tests = Path("tests/critical-flows.spec.ts")
          text = tests.read_text(encoding="utf-8")
          insert_before = '\n});\n'
          block = '''\n\n  it("keeps the Lovable template visual primitives and paginates the full property base", () => {\n    const workspace = source("src/components/property/PropertyWorkspace.tsx");\n    const css = source("src/mercadoimobi.css");\n    const search = source("src/lib/property-search.functions.ts");\n\n    expect(workspace).toContain("max-w-6xl");\n    expect(workspace).toContain("Urbanist");\n    expect(workspace).toContain("Página {page}");\n    expect(css).toContain("LOVABLE_EXACT_TEMPLATE_V2");\n    expect(css).toContain("--gradient-results");\n    expect(css).toContain("JetBrains Mono");\n    expect(search).toContain("offset: z.number()");\n    expect(search).toContain(".range(offset, offset + fetchLimit - 1)");\n  });\n'''
          pos = text.rfind(insert_before)
          if pos < 0:
              raise SystemExit("Test insertion target not found")
          text = text[:pos] + block + text[pos:]
          tests.write_text(text, encoding="utf-8")

      - name: Format changed sources
        run: npx prettier --write src/components/ThemeToggle.tsx src/routes/__root.tsx src/lib/property-search.functions.ts src/components/property/PropertyWorkspace.tsx src/components/property/DashboardAtendimentoPanel.tsx src/mercadoimobi.css tests/critical-flows.spec.ts

      - name: Commit exact Lovable template adaptation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ThemeToggle.tsx src/routes/__root.tsx src/lib/property-search.functions.ts src/components/property/PropertyWorkspace.tsx src/components/property/DashboardAtendimentoPanel.tsx src/mercadoimobi.css tests/critical-flows.spec.ts
          git commit -m "Match MercadoImobi to exact Lovable template and paginate all properties"
          git push origin HEAD:main
