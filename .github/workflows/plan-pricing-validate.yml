name: Subscription plans validation

on:
  push:
    branches: [main]
    paths:
      - "src/lib/billing.functions.ts"
      - "src/routes/_authenticated/assinatura.tsx"
      - "src/routes/_authenticated.tsx"
      - "src/routes/api/public/hooks/stripe.tsx"
      - "src/components/attendance/AutomationSafeguards.tsx"
      - "src/components/crm/CrmAutomationLayer.tsx"
      - "src/lib/crm-appointments.functions.ts"
      - "src/lib/customer-automation.functions.ts"
      - "src/lib/feature-access.functions.ts"
      - "src/lib/google-workspace.server.ts"
      - "src/lib/integrations-hub.functions.ts"
      - "src/lib/property-links.functions.ts"
      - "src/routes/_authenticated/admin/acessos.tsx"
      - "src/routes/_authenticated/central-integracoes.tsx"
      - "src/routes/api/public/jobs/crm-automations.tsx"
      - "src/routes/api/public/jobs/external-property-links.tsx"
      - "src/routes/api/v1/appointments.tsx"
      - "src/routes/api/v1/leads.tsx"
      - "tests/critical-flows.spec.ts"
      - "supabase/migrations/20260825032000_subscription_plans_and_entitlements.sql"
      - ".github/workflows/plan-pricing-validate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format rollout files
        run: >-
          npx prettier --write
          src/lib/billing.functions.ts
          src/routes/_authenticated/assinatura.tsx
          src/routes/_authenticated.tsx
          src/routes/api/public/hooks/stripe.tsx
          src/components/attendance/AutomationSafeguards.tsx
          src/components/crm/CrmAutomationLayer.tsx
          src/lib/crm-appointments.functions.ts
          src/lib/customer-automation.functions.ts
          src/lib/feature-access.functions.ts
          src/lib/google-workspace.server.ts
          src/lib/integrations-hub.functions.ts
          src/lib/property-links.functions.ts
          src/routes/_authenticated/admin/acessos.tsx
          src/routes/_authenticated/central-integracoes.tsx
          src/routes/api/public/jobs/crm-automations.tsx
          src/routes/api/public/jobs/external-property-links.tsx
          src/routes/api/v1/appointments.tsx
          src/routes/api/v1/leads.tsx
          tests/critical-flows.spec.ts
      - name: Persist formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Arquivos já formatados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "style: format MercadoImobi rollout files"
          git push
      - run: npm run lint
      - run: npm run test -- --passWithNoTests
      - run: npm run build
