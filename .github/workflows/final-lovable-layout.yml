name: Final Lovable layout pass

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-lovable-layout.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final layout pass
        shell: python
        run: |
          from pathlib import Path

          workspace = Path("src/components/property/PropertyWorkspace.tsx")
          text = workspace.read_text(encoding="utf-8")
          text = text.replace(
              'import { DashboardAtendimentoPanel } from "@/components/property/DashboardAtendimentoPanel";',
              'import { PropertySearchSummaryPanel } from "@/components/property/PropertySearchSummaryPanel";',
          )
          text = text.replace(
              'const next = emptyFilters(filters.market);\n    setFilters(next);',
              'const next = emptyFilters(filters.market);\n    setPage(1);\n    setFilters(next);',
              1,
          )
          text = text.replace(
              'className="mt-4 grid gap-3 sm:grid-cols-2 xl:grid-cols-5"',
              'className="mt-4 grid gap-3 sm:grid-cols-2 xl:grid-cols-3"',
              1,
          )
          old_panel = '            <DashboardAtendimentoPanel />'
          new_panel = '''            <PropertySearchSummaryPanel
              total={Number(searchQuery.data?.total ?? totalForMarket ?? 0)}
              opportunities={Number(stats?.opportunities ?? 0)}
              activeSources={Number(stats?.active_sources ?? 0)}
              auctions={Number(stats?.auction_properties ?? 0)}
              marketProperties={Number(stats?.market_properties ?? 0)}
              caixaProperties={Number(stats?.caixa_properties ?? 0)}
              marketLabel={
                applied.market === "auction"
                  ? "Leilões CAIXA"
                  : applied.market === "caixa"
                    ? "CAIXA"
                    : applied.market === "market"
                      ? "Mercado"
                      : "Todos"
              }
            />'''
          if old_panel not in text:
              raise SystemExit("Right panel target not found")
          text = text.replace(old_panel, new_panel, 1)
          old_saved = '                setFilters(next);\n                setApplied(next);\n                setSavedOpen(false);'
          new_saved = '                setPage(1);\n                setFilters(next);\n                setApplied(next);\n                setSavedOpen(false);'
          if old_saved not in text:
              raise SystemExit("Saved search target not found")
          text = text.replace(old_saved, new_saved, 1)
          workspace.write_text(text, encoding="utf-8")

          search = Path("src/lib/property-search.functions.ts")
          text = search.read_text(encoding="utf-8")
          text = text.replace(
              'const fetchLimit = Math.min(60, Math.max(limit, limit * 2));',
              'const fetchLimit = Math.min(60, limit);',
              1,
          )
          old_total = '''    const total = Math.max(
      items.length,
      (indexResult.count ?? 0) + (propertyResult.count ?? 0) + configuredLiveItems.length,
    );'''
          new_total = '''    const indexedTotal = indexResult.count ?? 0;
    const legacyTotal = propertyResult.count ?? 0;
    const total = Math.max(
      items.length,
      indexedTotal + configuredLiveItems.length,
      legacyTotal + configuredLiveItems.length,
    );'''
          if old_total not in text:
              raise SystemExit("Total target not found")
          text = text.replace(old_total, new_total, 1)
          search.write_text(text, encoding="utf-8")

      - name: Format changed sources
        run: npx prettier --write src/components/property/PropertyWorkspace.tsx src/components/property/PropertySearchSummaryPanel.tsx src/lib/property-search.functions.ts

      - name: Commit final layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/property/PropertyWorkspace.tsx src/components/property/PropertySearchSummaryPanel.tsx src/lib/property-search.functions.ts
          git commit -m "Align main property workspace to Lovable results layout"
          git push origin HEAD:main
