name: Temporary CRM Prettier Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-crm-reference.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format CRM stylesheet
        run: npx prettier --write src/mercadoimobi.css

      - name: Remove temporary workflow and commit formatting
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/format-crm-reference.yml
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add src/mercadoimobi.css .github/workflows/format-crm-reference.yml
          git commit -m "style(crm): format reference redesign"
          git push origin HEAD:main
