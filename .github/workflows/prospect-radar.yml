name: MercadoImobi prospect radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Run automated prospect sweep
        shell: bash
        env:
          BASE_URL: ${{ secrets.MERCADOIMOBI_BASE_URL }}
          CRM_KEY: ${{ secrets.CRM_AUTOMATION_JOB_SECRET }}
          FEED_KEY: ${{ secrets.PROPERTY_FEED_SYNC_SECRET }}
        run: |
          set -euo pipefail
          BASE_URL="${BASE_URL:-https://r2rmarketingdigital-mercadomobi.ke4n49.easypanel.host}"
          BASE_URL="${BASE_URL%/}"
          JOB_KEY="${CRM_KEY:-${FEED_KEY:-}}"

          if [ -z "${JOB_KEY:-}" ]; then
            echo "::notice::CRM_AUTOMATION_JOB_SECRET ou PROPERTY_FEED_SYNC_SECRET nao configurado no GitHub Actions; mantendo o radar acordado via status publico."
            curl -fsS --connect-timeout 10 --max-time 60 \
              "${BASE_URL}/api/public/jobs/prospect-radar" \
              -o /tmp/prospect-radar.json
            cat /tmp/prospect-radar.json
            echo
            node - <<'NODE'
            const fs = require('fs');
            const payload = JSON.parse(fs.readFileSync('/tmp/prospect-radar.json', 'utf8'));
            if (!payload.ok) {
              console.log(`::error::Prospect radar status returned ${payload.error || 'unknown error'}.`);
              process.exit(1);
            }
            console.log(`Prospect radar scheduler: active=${payload.schedulerActive}; running=${payload.running}; interval=${payload.intervalMinutes ?? 'unknown'}min`);
            NODE
            exit 0
          fi

          curl -fsS --connect-timeout 10 --max-time 540 \
            -X POST \
            -H "x-mercadoimobi-job-key: ${JOB_KEY}" \
            "${BASE_URL}/api/public/jobs/prospect-radar" \
            -o /tmp/prospect-radar.json

          cat /tmp/prospect-radar.json
          echo

          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/prospect-radar.json', 'utf8'));
          if (!payload.ok) {
            console.log(`::error::Prospect radar returned ${payload.error || 'unknown error'}.`);
            process.exit(1);
          }
          const providers = Array.isArray(payload.providers) ? payload.providers : [];
          const activeProviders = providers.filter((provider) => provider.operational).length;
          console.log(`Prospect radar: leads=${payload.leads ?? 0}; hot=${payload.hot ?? 0}; activeProviders=${activeProviders}`);
          if ((payload.leads ?? 0) === 0) {
            console.log('::notice::Nenhum lead real foi encontrado nesta janela. A proxima varredura automatica tentara novamente.');
          }
          NODE
