name: Remove dashboard atendimento panel

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-dashboard-atendimento.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove atendimento panel from dashboard
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/components/property/PropertyWorkspace.tsx")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              'import { DashboardAtendimentoPanel } from "@/components/property/DashboardAtendimentoPanel";\n',
              '',
          )
          text = text.replace(
              '          <div className="grid grid-cols-1 gap-6 lg:grid-cols-[1fr_minmax(380px,440px)]">',
              '          <div className="grid grid-cols-1 gap-6">',
          )
          text = text.replace(
              '                  <div className="grid gap-4 md:grid-cols-2">',
              '                  <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-3">',
          )
          text = text.replace('            <DashboardAtendimentoPanel />\n', '')

          if 'DashboardAtendimentoPanel' in text:
              raise SystemExit('DashboardAtendimentoPanel still present')
          if 'lg:grid-cols-[1fr_minmax(380px,440px)]' in text:
              raise SystemExit('Old two-column dashboard grid still present')

          path.write_text(text, encoding="utf-8")

      - name: Format and commit
        run: |
          npx prettier --write src/components/property/PropertyWorkspace.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/property/PropertyWorkspace.tsx
          git commit -m "Remove atendimento panel from property dashboard"
          git push origin HEAD:main
