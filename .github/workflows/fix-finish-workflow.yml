name: Fix finish workflow

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-finish-workflow.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove SQL from Prettier command
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/finish-search-features.yml')
          s = p.read_text(encoding='utf-8')
          old = 'npx prettier --write src/lib/property-search.functions.ts src/integrations/supabase/types.ts src/routes/_authenticated/dashboard.tsx supabase/migrations/20260815205500_property_favorites.sql'
          new = 'npx prettier --write src/lib/property-search.functions.ts src/integrations/supabase/types.ts src/routes/_authenticated/dashboard.tsx'
          if old not in s:
              raise SystemExit('Target Prettier command not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/finish-search-features.yml
          git commit -m "Do not format SQL migration with Prettier"
          git pull --rebase origin main
          git push
