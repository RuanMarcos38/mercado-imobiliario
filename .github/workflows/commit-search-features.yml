name: Commit validated search features

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/commit-search-features.yml"

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse validated patch logic
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/finish-search-features-v2.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Apply final search experience fixes\n        shell: python\n        run: |\n'
          end_marker = '\n      - name: Setup Node.js\n'
          if start_marker not in source or end_marker not in source:
              raise SystemExit('Could not locate validated patch script')
          block = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'
          Path('/tmp/apply_search_fixes.py').write_text(script, encoding='utf-8')
          subprocess.run(['python', '/tmp/apply_search_fixes.py'], check=True)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format changed TypeScript
        run: npx prettier --write src/lib/property-search.functions.ts src/integrations/supabase/types.ts src/routes/_authenticated/dashboard.tsx

      - name: Lint
        run: npm run lint

      - name: Run safe tests
        run: npm run test -- --exclude tests/tenant-isolation.test.ts --exclude tests/critical-flows.spec.ts --passWithNoTests

      - name: Build production application
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          VITE_SUPABASE_PROJECT_ID: placeholder
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
        run: |
          npm run build
          test -f .output/server/index.mjs

      - name: Commit and synchronize
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/property-search.functions.ts src/integrations/supabase/types.ts src/routes/_authenticated/dashboard.tsx supabase/migrations/20260815205500_property_favorites.sql
          if git diff --cached --quiet; then
            echo "No application changes to commit"
            exit 0
          fi
          git commit -m "Persist property favorites and manage saved searches"
          git stash push --include-untracked -m "generated-build-files" || true
          git pull --rebase origin main
          git push origin main
