name: MercadoImobi EasyPanel deploy

on:
  workflow_run:
    workflows: ["MercadoImobi mandatory validation"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
      EASYPANEL_DEPLOY_TRIGGER_URL: ${{ secrets.EASYPANEL_DEPLOY_TRIGGER_URL }}
      DEPLOY_TRIGGER_URL: ${{ secrets.DEPLOY_TRIGGER_URL }}
      EASYPANEL_PUBLIC_URL: ${{ secrets.EASYPANEL_PUBLIC_URL }}
    steps:
      - name: Resolve EasyPanel deployment configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          URL="${EASYPANEL_DEPLOY_URL:-${EASYPANEL_DEPLOY_TRIGGER_URL:-${DEPLOY_TRIGGER_URL:-}}}"
          if [ -z "$URL" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment Trigger do EasyPanel ainda não foi configurado. A validação do código permanece verde; deploy automático foi ignorado sem mascarar falha da aplicação."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger validated EasyPanel deployment
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL="${EASYPANEL_DEPLOY_URL:-${EASYPANEL_DEPLOY_TRIGGER_URL:-${DEPLOY_TRIGGER_URL:-}}}"
          echo "Iniciando deploy validado no EasyPanel..."
          if curl -fsS --connect-timeout 10 --max-time 60 "$URL" -o /tmp/easypanel-deploy-response.txt; then
            echo "Deploy solicitado ao EasyPanel com sucesso."
          else
            echo "GET não iniciou o deploy; tentando POST sem expor o token..."
            curl -fsS -X POST --connect-timeout 10 --max-time 60 "$URL" -o /tmp/easypanel-deploy-response.txt
            echo "Deploy solicitado ao EasyPanel com sucesso."
          fi
          head -c 500 /tmp/easypanel-deploy-response.txt || true
          echo

      - name: Verify live MercadoImobi backend
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_URL="${EASYPANEL_PUBLIC_URL:-https://mercadoimobi.rdmconsultoriaimobiliaria.com.br}"
          PUBLIC_URL="${PUBLIC_URL%/}"
          STATUS_URL="$PUBLIC_URL/api/public/status"

          echo "Validando backend publicado sem expor credenciais..."
          ready=0
          for attempt in $(seq 1 36); do
            if curl -fsS --connect-timeout 8 --max-time 15 "$STATUS_URL" -o /tmp/mercadoimobi-live-status.json; then
              if node - <<'NODE'
          const fs = require('fs');
          try {
            const body = fs.readFileSync('/tmp/mercadoimobi-live-status.json', 'utf8');
            const status = JSON.parse(body);
            const ok = status.status === 'operational'
              && status.search === 'available'
              && Number.isFinite(status.indexedProperties)
              && status.indexedProperties >= 1000
              && Number.isFinite(status.coveredStates)
              && status.coveredStates >= 27;
            process.exit(ok ? 0 : 1);
          } catch {
            process.exit(1);
          }
          NODE
              then
                ready=1
                break
              fi
            fi
            echo "Aguardando publicação ($attempt/36)..."
            sleep 6
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::O deploy foi solicitado, mas $STATUS_URL não confirmou o backend MercadoImobi operacional. Verifique domínio, porta e healthcheck no EasyPanel."
            if [ -f /tmp/mercadoimobi-live-status.json ]; then
              head -c 500 /tmp/mercadoimobi-live-status.json || true
              echo
            fi
            exit 1
          fi

          node - <<'NODE'
          const fs = require('fs');
          const status = JSON.parse(fs.readFileSync('/tmp/mercadoimobi-live-status.json', 'utf8'));
          console.log(`Backend publicado e operacional: ${status.indexedProperties} imóveis em ${status.coveredStates} UFs.`);
          console.log(`Release: ${status.release || 'sem marcador'} | sync: ${status.synchronization?.state || 'unknown'}`);
          NODE
