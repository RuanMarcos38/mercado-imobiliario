name: MercadoImobi EasyPanel deploy

on:
  workflow_run:
    workflows: ["MercadoImobi mandatory validation"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
      EASYPANEL_DEPLOY_TRIGGER_URL: ${{ secrets.EASYPANEL_DEPLOY_TRIGGER_URL }}
      DEPLOY_TRIGGER_URL: ${{ secrets.DEPLOY_TRIGGER_URL }}
      EASYPANEL_PUBLIC_URL: ${{ vars.EASYPANEL_PUBLIC_URL }}
      EXPECTED_SUPABASE_PROJECT_ID: ${{ vars.MERCADOIMOBI_SUPABASE_PROJECT_ID }}
    steps:
      - name: Resolve EasyPanel deployment configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          URL="${EASYPANEL_DEPLOY_URL:-${EASYPANEL_DEPLOY_TRIGGER_URL:-${DEPLOY_TRIGGER_URL:-}}}"
          if [ -z "$URL" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No explicit EasyPanel deploy hook configured; relying on the GitHub-linked production branch."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger validated EasyPanel deployment
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL="${EASYPANEL_DEPLOY_URL:-${EASYPANEL_DEPLOY_TRIGGER_URL:-${DEPLOY_TRIGGER_URL:-}}}"
          if curl -fsS --connect-timeout 10 --max-time 60 "$URL" -o /tmp/easypanel-deploy-response.txt; then
            echo "EasyPanel deploy requested with GET."
          else
            curl -fsS -X POST --connect-timeout 10 --max-time 60 "$URL" -o /tmp/easypanel-deploy-response.txt
            echo "EasyPanel deploy requested with POST."
          fi

      - name: Verify live MercadoImobi backend on EasyPanel
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPECTED_SUPABASE_PROJECT_ID:-}" || { echo "::error::Missing MERCADOIMOBI_SUPABASE_PROJECT_ID"; exit 1; }
          PUBLIC_URL="${EASYPANEL_PUBLIC_URL:-https://r2rmarketingdigital-mercadomobi.ke4n49.easypanel.host}"
          PUBLIC_URL="${PUBLIC_URL%/}"
          STATUS_URL="$PUBLIC_URL/api/public/status"
          ready=0
          for attempt in $(seq 1 24); do
            if curl -fsS --connect-timeout 6 --max-time 10 "$STATUS_URL" -o /tmp/mercadoimobi-live-status.json; then
              if EXPECTED_SUPABASE_PROJECT_ID="$EXPECTED_SUPABASE_PROJECT_ID" node - <<'NODE'
          const fs = require('fs');
          try {
            const status = JSON.parse(fs.readFileSync('/tmp/mercadoimobi-live-status.json', 'utf8'));
            const project = String(status.supabaseProjectId || '');
            const expected = String(process.env.EXPECTED_SUPABASE_PROJECT_ID || '');
            const ok = status.status === 'operational'
              && status.search === 'available'
              && expected.length > 0
              && project === expected
              && status.runtime?.supabaseAdmin === 'configured'
              && Number.isFinite(status.indexedProperties)
              && status.indexedProperties >= 1000
              && Number.isFinite(status.coveredStates)
              && status.coveredStates >= 27;
            process.exit(ok ? 0 : 1);
          } catch {
            process.exit(1);
          }
          NODE
              then
                ready=1
                break
              fi
              echo "Backend responded but is not fully configured or is not using the dedicated MercadoImobi Supabase project:"
              head -c 800 /tmp/mercadoimobi-live-status.json || true
              echo
            fi
            echo "Waiting for EasyPanel publication ($attempt/24)..."
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::MercadoImobi EasyPanel backend did not become fully operational on its dedicated Supabase project."
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const status = JSON.parse(fs.readFileSync('/tmp/mercadoimobi-live-status.json', 'utf8'));
          console.log(`Backend operational: ${status.indexedProperties} properties / ${status.coveredStates} states.`);
          console.log(`Supabase: ${status.supabaseProjectId} | admin runtime: ${status.runtime?.supabaseAdmin}`);
          NODE
