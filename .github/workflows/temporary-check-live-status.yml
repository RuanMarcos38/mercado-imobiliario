name: Temporary check live status

on:
  push:
    branches: [feature/atendimento-suri-senior]

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atendimento-suri-senior
      - name: Read public status only
        shell: bash
        run: |
          set -euo pipefail
          OUT=.attendance-live-status
          : > "$OUT"
          for BASE in "https://mercadoimobi.rdmconsultoriaimobiliaria.com.br" "https://r2rmarketingdigital-mercadomobi.ke4n49.easypanel.host"; do
            if curl -fsS --connect-timeout 8 --max-time 20 "$BASE/api/public/status" -o /tmp/status.json; then
              BASE="$BASE" node - <<'NODE' >> "$OUT"
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('/tmp/status.json', 'utf8'));
          const base = process.env.BASE;
          console.log(JSON.stringify({base,status:p.status,search:p.search,supabaseProjectId:p.supabaseProjectId,indexedProperties:p.indexedProperties,coveredStates:p.coveredStates,supabaseAdmin:p.runtime?.supabaseAdmin}));
          NODE
            else
              printf '{"base":"%s","error":"unreachable"}\n' "$BASE" >> "$OUT"
            fi
          done
      - name: Commit public diagnostic marker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add .attendance-live-status
          if ! git diff --cached --quiet; then
            git commit -m "chore: record public attendance deployment diagnostic"
            git push origin HEAD:feature/atendimento-suri-senior
          fi
