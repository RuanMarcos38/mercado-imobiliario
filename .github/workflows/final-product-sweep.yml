name: Final product sweep

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-product-sweep.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply product corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, required=True):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  if required:
                      raise SystemExit(f"pattern not found in {path}: {old[:120]}")
                  return
              p.write_text(s.replace(old, new))

          # --- Search: expose official opportunity metadata and show market sources first in Todos ---
          path = "src/lib/property-search.functions.ts"
          s = Path(path).read_text()
          s = s.replace(
              '  contact_email: z.string().nullable().optional(),\n});',
              '  contact_email: z.string().nullable().optional(),\n  discount_percent: z.number().nullable().optional(),\n  evaluation_value: z.number().nullable().optional(),\n});',
              1,
          )
          s = s.replace(
              '  contact_email: string | null;\n}',
              '  contact_email: string | null;\n  discount_percent: number | null;\n  evaluation_value: number | null;\n}',
              1,
          )
          s = s.replace(
              '        contact_email: item.contact_email ?? null,\n      }))',
              '        contact_email: item.contact_email ?? null,\n        discount_percent: item.discount_percent ?? null,\n        evaluation_value: item.evaluation_value ?? null,\n      }))',
              1,
          )
          s = s.replace(
              'contact_name,contact_phone,contact_whatsapp,contact_email",',
              'contact_name,contact_phone,contact_whatsapp,contact_email,metadata",',
              1,
          )
          s = s.replace(
              '    } else {\n      indexQuery = indexQuery.order("scanned_at", { ascending: false });\n      propertyQuery = propertyQuery.order("updated_at", { ascending: false });\n    }',
              '    } else {\n      if (input.market === "all") {\n        indexQuery = indexQuery.order("listing_market", { ascending: false });\n      }\n      indexQuery = indexQuery.order("scanned_at", { ascending: false });\n      propertyQuery = propertyQuery.order("updated_at", { ascending: false });\n    }',
              1,
          )
          s = s.replace(
              '      contact_email: item.contact_email,\n    }));',
              '      contact_email: item.contact_email,\n      discount_percent: Number.isFinite(Number(item.metadata?.discount_percent))\n        ? Number(item.metadata?.discount_percent)\n        : null,\n      evaluation_value: Number.isFinite(Number(item.metadata?.evaluation_value))\n        ? Number(item.metadata?.evaluation_value)\n        : null,\n    }));',
              1,
          )
          s = s.replace(
              '      contact_email: null,\n    }));',
              '      contact_email: null,\n      discount_percent: null,\n      evaluation_value: null,\n    }));',
              1,
          )
          # Preserve opportunity metadata in favorite snapshots.
          marker = '  contact_email: z.string().nullable(),\n});\n\nconst favoriteMutationSchema'
          if marker in s:
              s = s.replace(
                  marker,
                  '  contact_email: z.string().nullable(),\n  discount_percent: z.number().nullable().optional(),\n  evaluation_value: z.number().nullable().optional(),\n});\n\nconst favoriteMutationSchema',
                  1,
              )
          Path(path).write_text(s)

          # --- Main property workspace ---
          path = "src/components/property/PropertyWorkspace.tsx"
          s = Path(path).read_text()
          s = s.replace(
              '  const opportunityKeys = useMemo(() => calculateOpportunityKeys(results), [results]);',
              '  const opportunityKeys = useMemo(() => calculateOpportunityKeys(results), [results]);\n  const bestValueKeys = useMemo(() => calculateBestValueKeys(results), [results]);',
              1,
          )
          s = s.replace(
              '    const next = emptyFilters(filters.market);\n    setFilters(next);',
              '    const next = emptyFilters(filters.market);\n    setPage(1);\n    setFilters(next);',
              1,
          )
          s = s.replace(
              '                        opportunity={opportunityKeys.has(propertyKey(property))}\n                        onFavorite=',
              '                        opportunity={opportunityKeys.has(propertyKey(property))}\n                        bestValue={bestValueKeys.has(propertyKey(property))}\n                        onFavorite=',
              1,
          )
          s = s.replace(
              '                setFilters(next);\n                setApplied(next);\n                setSavedOpen(false);',
              '                setPage(1);\n                setFilters(next);\n                setApplied(next);\n                setSavedOpen(false);',
              1,
          )
          s = s.replace(
              ': `${formatInteger(totalForMarket)} imóveis na base selecionada`}',
              ': `${formatInteger(searchQuery.data?.total ?? totalForMarket)} imóveis encontrados`}',
              1,
          )
          s = s.replace(
              '                      A busca consulta toda a base. Até 48 imóveis são carregados por vez para\n                      manter a navegação rápida.',
              '                      A busca consulta toda a base. Até 48 imóveis são carregados por vez para\n                      manter a navegação rápida.\n                      {applied.market === "all" && stats && (\n                        <> {formatInteger(stats.market_properties)} de Mercado + {formatInteger(stats.caixa_properties)} CAIXA, incluindo {formatInteger(stats.auction_properties)} leilões.</>\n                      )}',
              1,
          )
          # Prop contract
          s = s.replace(
              '  opportunity,\n  onFavorite,',
              '  opportunity,\n  bestValue,\n  onFavorite,',
              1,
          )
          s = s.replace(
              '  opportunity: boolean;\n  onFavorite:',
              '  opportunity: boolean;\n  bestValue: boolean;\n  onFavorite:',
              1,
          )
          old_badges = '''            {property.is_auction ? (\n              <Badge className="border-0 bg-rose-600 text-[10px] text-white">\n                <Gavel className="mr-1 h-3 w-3" /> Leilão CAIXA\n              </Badge>\n            ) : opportunity ? (\n              <Badge className="border-0 bg-emerald-600 text-[10px] text-white">\n                <Tag className="mr-1 h-3 w-3" /> Preço atrativo\n              </Badge>\n            ) : (\n              <Badge className="border-0 bg-blue-600 text-[10px] text-white">Novo anúncio</Badge>\n            )}'''
          new_badges = '''            {property.is_auction && (\n              <Badge className="border-0 bg-rose-600 text-[10px] text-white">\n                <Gavel className="mr-1 h-3 w-3" /> Leilão CAIXA\n              </Badge>\n            )}\n            {property.discount_percent != null && property.discount_percent >= 10 ? (\n              <Badge className="border-0 bg-emerald-600 text-[10px] text-white">\n                <Tag className="mr-1 h-3 w-3" /> Oportunidade · -{formatPercent(property.discount_percent)}\n              </Badge>\n            ) : opportunity ? (\n              <Badge className="border-0 bg-emerald-600 text-[10px] text-white">\n                <Tag className="mr-1 h-3 w-3" /> Preço atrativo\n              </Badge>\n            ) : bestValue ? (\n              <Badge className="border-0 bg-blue-600 text-[10px] text-white">Menor valor</Badge>\n            ) : property.listing_market !== "caixa" ? (\n              <Badge className="border-0 bg-blue-600 text-[10px] text-white">Mercado</Badge>\n            ) : null}'''
          if old_badges not in s:
              raise SystemExit("property badge block not found")
          s = s.replace(old_badges, new_badges, 1)

          price_block = '''            <p className="mt-0.5 text-xl font-black tracking-tight text-[var(--mi-text)]">\n              {formatPrice(property.price)}\n            </p>'''
          price_new = '''            <p className="mt-0.5 text-xl font-black tracking-tight text-[var(--mi-text)]">\n              {formatPrice(property.price)}\n            </p>\n            {property.evaluation_value != null &&\n              property.price != null &&\n              property.evaluation_value > property.price && (\n                <>\n                  <p className="mt-1 text-[10px] text-[var(--mi-text-soft)] line-through">\n                    Avaliação: {formatPrice(property.evaluation_value)}\n                  </p>\n                  <p className="mt-0.5 text-[10px] font-bold text-emerald-600">\n                    Economia: {formatPrice(property.evaluation_value - property.price)}\n                  </p>\n                </>\n              )}'''
          if price_block not in s:
              raise SystemExit("price block not found")
          s = s.replace(price_block, price_new, 1)

          # Add opportunity details to modal.
          modal_area = '''          <Detail\n            label="Área"\n            value={property.area_sqm != null ? `${property.area_sqm} m²` : "Não informada"}\n          />'''
          modal_new = modal_area + '''\n          {property.evaluation_value != null && property.evaluation_value > (property.price ?? 0) && (\n            <Detail label="Avaliação da fonte" value={formatPrice(property.evaluation_value)} />\n          )}\n          {property.discount_percent != null && property.discount_percent > 0 && (\n            <Detail label="Desconto informado" value={`${formatPercent(property.discount_percent)}%`} />\n          )}'''
          if modal_area in s:
              s = s.replace(modal_area, modal_new, 1)

          old_calc = '''function calculateOpportunityKeys(items: PropertySearchItem[]) {\n  const comparable = items\n    .filter(\n      (item) =>\n        item.price != null &&\n        item.price > 0 &&\n        item.area_sqm != null &&\n        item.area_sqm > 0 &&\n        !item.is_auction,\n    )\n    .map((item) => ({ key: propertyKey(item), value: item.price! / item.area_sqm! }))\n    .sort((a, b) => a.value - b.value);\n\n  if (comparable.length < 5) return new Set<string>();\n  const middle = Math.floor(comparable.length / 2);\n  const median =\n    comparable.length % 2 === 0\n      ? (comparable[middle - 1]!.value + comparable[middle]!.value) / 2\n      : comparable[middle]!.value;\n  const threshold = median * 0.85;\n  return new Set(comparable.filter((item) => item.value <= threshold).map((item) => item.key));\n}'''
          new_calc = '''function calculateOpportunityKeys(items: PropertySearchItem[]) {\n  const official = new Set(\n    items\n      .filter((item) => item.discount_percent != null && item.discount_percent >= 10)\n      .map((item) => propertyKey(item)),\n  );\n  const comparable = items\n    .filter(\n      (item) =>\n        item.price != null &&\n        item.price > 0 &&\n        item.area_sqm != null &&\n        item.area_sqm > 0 &&\n        !item.is_auction,\n    )\n    .map((item) => ({ key: propertyKey(item), value: item.price! / item.area_sqm! }))\n    .sort((a, b) => a.value - b.value);\n\n  if (comparable.length < 5) return official;\n  const middle = Math.floor(comparable.length / 2);\n  const median =\n    comparable.length % 2 === 0\n      ? (comparable[middle - 1]!.value + comparable[middle]!.value) / 2\n      : comparable[middle]!.value;\n  const threshold = median * 0.85;\n  for (const item of comparable.filter((entry) => entry.value <= threshold)) official.add(item.key);\n  return official;\n}\n\nfunction calculateBestValueKeys(items: PropertySearchItem[]) {\n  return new Set(\n    items\n      .filter((item) => item.price != null && item.price > 0)\n      .sort((a, b) => (a.price ?? Number.MAX_SAFE_INTEGER) - (b.price ?? Number.MAX_SAFE_INTEGER))\n      .slice(0, 3)\n      .map((item) => propertyKey(item)),\n  );\n}'''
          if old_calc not in s:
              raise SystemExit("opportunity calculator block not found")
          s = s.replace(old_calc, new_calc, 1)
          s = s.replace(
              'function formatInteger(value: number | undefined) {',
              'function formatPercent(value: number) {\n  return new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 1 }).format(value);\n}\n\nfunction formatInteger(value: number | undefined) {',
              1,
          )
          Path(path).write_text(s)

          # --- Bring remaining authenticated pages into the same light/dark template system ---
          route_files = [
              "src/routes/_authenticated/alertas.tsx",
              "src/routes/_authenticated/assistente.tsx",
              "src/routes/_authenticated/fluxos.tsx",
              "src/routes/_authenticated/integracoes.tsx",
              "src/routes/_authenticated/settings/security.tsx",
              "src/routes/_authenticated/atendimento.tsx",
          ]
          replacements = [
              ('bg-[#06101c]', 'bg-[var(--mi-bg)]'),
              ('bg-[#07111f]', 'bg-[var(--mi-bg)]'),
              ('bg-[#07111f]/90', 'bg-[var(--mi-bg)]/90'),
              ('bg-[#091626]', 'bg-[var(--mi-surface)]'),
              ('bg-[#081421]', 'bg-[var(--mi-surface-soft)]'),
              ('bg-[#07111f]', 'bg-[var(--mi-bg)]'),
              ('bg-[#091625]', 'bg-[var(--mi-surface)]'),
              ('bg-[#091a2c]', 'bg-[var(--mi-surface-soft)]'),
              ('bg-[#0b1727]', 'bg-[var(--mi-surface)]'),
              ('bg-[#102236]', 'bg-[var(--mi-surface)]'),
              ('bg-black/10', 'bg-[var(--mi-surface-soft)]'),
              ('bg-black/15', 'bg-[var(--mi-surface-soft)]'),
              ('bg-black/20', 'bg-[var(--mi-surface-soft)]'),
              ('bg-white/[0.04]', 'bg-[var(--mi-surface)]'),
              ('bg-white/[0.035]', 'bg-[var(--mi-surface-soft)]'),
              ('border-white/10', 'border-[var(--mi-border)]'),
              ('border-white/15', 'border-[var(--mi-border)]'),
              ('text-slate-500', 'text-[var(--mi-text-soft)]'),
              ('text-slate-400', 'text-[var(--mi-text-muted)]'),
              ('text-slate-300', 'text-[var(--mi-text-muted)]'),
              ('text-slate-200', 'text-[var(--mi-text)]'),
              ('text-slate-100', 'text-[var(--mi-text)]'),
              ('text-cyan-300', 'text-blue-600'),
              ('text-cyan-200', 'text-blue-600'),
              ('text-cyan-100', 'text-blue-600'),
              ('bg-cyan-300', 'bg-blue-600'),
              ('hover:bg-cyan-200', 'hover:bg-blue-700'),
              ('accent-cyan-300', 'accent-blue-600'),
              ('ring-cyan-300/20', 'ring-blue-500/20'),
              ('border-cyan-300/20', 'border-blue-500/20'),
              ('border-cyan-300/15', 'border-blue-500/20'),
              ('border-cyan-300/10', 'border-blue-500/15'),
              ('focus-within:border-cyan-300/30', 'focus-within:border-blue-500/30'),
              ('focus:border-cyan-300/30', 'focus:border-blue-500/30'),
              ('text-[#06101c]', 'text-white'),
              ('text-white', 'text-[var(--mi-text)]'),
          ]
          # Re-apply white text to clearly blue action buttons after the broad text-white replacement.
          for route in route_files:
              p = Path(route)
              if not p.exists():
                  continue
              t = p.read_text()
              for old, new in replacements:
                  t = t.replace(old, new)
              t = t.replace('bg-blue-600 font-black text-[var(--mi-text)]', 'bg-blue-600 font-black text-white')
              t = t.replace('bg-blue-600 font-bold text-[var(--mi-text)]', 'bg-blue-600 font-bold text-white')
              t = t.replace('bg-blue-600 px-3 text-xs font-black text-[var(--mi-text)]', 'bg-blue-600 px-3 text-xs font-black text-white')
              t = t.replace('bg-blue-600 text-[var(--mi-text)] hover:bg-blue-700', 'bg-blue-600 text-white hover:bg-blue-700')
              t = t.replace('[&_input]:text-[var(--mi-text)]', '[&_input]:text-[var(--mi-text)]')
              t = t.replace('[&_textarea]:text-[var(--mi-text)]', '[&_textarea]:text-[var(--mi-text)]')
              t = t.replace('[&_select]:text-[var(--mi-text)]', '[&_select]:text-[var(--mi-text)]')
              p.write_text(t)

          # Fix account page card text explicitly after broad replacements.
          sec = Path('src/routes/_authenticated/settings/security.tsx')
          t = sec.read_text()
          t = t.replace('Card className="rounded-3xl border-[var(--mi-border)] bg-[var(--mi-surface)] text-[var(--mi-text)]"', 'Card className="rounded-3xl border-[var(--mi-border)] bg-[var(--mi-surface)] text-[var(--mi-text)]"')
          sec.write_text(t)

          # --- UI/button contract test ---
          Path('tests/platform-buttons.test.ts').write_text('''import { describe, expect, it } from "vitest";\nimport { readFileSync } from "node:fs";\n\nconst source = (path: string) => readFileSync(path, "utf8");\n\ndescribe("MercadoImobi platform controls", () => {\n  it("keeps every main navigation destination wired", () => {\n    const layout = source("src/routes/_authenticated.tsx");\n    for (const route of ["/dashboard", "/buscar", "/leiloes", "/alertas", "/atendimento", "/fluxos", "/assistente", "/integracoes", "/settings/security"]) {\n      expect(layout).toContain(route);\n    }\n    expect(layout).toContain("signOut");\n    expect(layout).toContain("runGlobalSearch");\n  });\n\n  it("wires all property workspace actions and full-base pagination", () => {\n    const workspace = source("src/components/property/PropertyWorkspace.tsx");\n    for (const label of ["Buscar imóveis", "Limpar filtros", "Salvar pesquisa", "Criar alerta", "Pesquisas salvas", "Favoritos", "Ver detalhes", "Comparar imóvel", "Abrir anúncio original", "Anterior", "Próxima"]) {\n      expect(workspace).toContain(label);\n    }\n    expect(workspace).toContain("setPage(1)");\n    expect(workspace).toContain("discount_percent");\n    expect(workspace).toContain("evaluation_value");\n    expect(workspace).toContain("Economia:");\n    expect(workspace).not.toContain("DashboardAtendimentoPanel");\n  });\n\n  it("keeps dashboard and search on all properties, while auctions remain separate", () => {\n    expect(source("src/routes/_authenticated/dashboard.tsx")).toContain('initialMarket="all"');\n    expect(source("src/routes/_authenticated/buscar.tsx")).toContain('initialMarket="all"');\n    expect(source("src/routes/_authenticated/leiloes.tsx")).toContain('initialMarket="caixa"');\n    const search = source("src/lib/property-search.functions.ts");\n    expect(search).toContain('input.market === "all"');\n    expect(search).toContain('order("listing_market", { ascending: false })');\n  });\n\n  it("keeps alert, flow, assistant and atendimento actions connected", () => {\n    const alerts = source("src/routes/_authenticated/alertas.tsx");\n    const flows = source("src/routes/_authenticated/fluxos.tsx");\n    const assistant = source("src/routes/_authenticated/assistente.tsx");\n    const atendimento = source("src/routes/_authenticated/atendimento.tsx");\n    expect(alerts).toContain("Criar alerta");\n    expect(alerts).toContain("markReadFn");\n    expect(flows).toContain("Criar fluxo");\n    expect(flows).toContain("addStepFn");\n    expect(assistant).toContain("Salvar configuração");\n    expect(assistant).toContain("Testar resposta");\n    expect(atendimento).toContain("Nova conversa");\n    expect(atendimento).toContain("Sugerir resposta com IA");\n    expect(atendimento).toContain("sendFn");\n  });\n\n  it("keeps internal pages on the shared theme system instead of the old fixed dark shell", () => {\n    for (const path of [\n      "src/routes/_authenticated/alertas.tsx",\n      "src/routes/_authenticated/assistente.tsx",\n      "src/routes/_authenticated/fluxos.tsx",\n      "src/routes/_authenticated/integracoes.tsx",\n      "src/routes/_authenticated/settings/security.tsx",\n    ]) {\n      const file = source(path);\n      expect(file).not.toContain('bg-[#06101c]');\n      expect(file).not.toContain('bg-[#07111f]');\n      expect(file).toContain("var(--mi-");\n    }\n  });\n});\n''')
          PY

      - name: Format and commit
        run: |
          npx prettier --write src/lib/property-search.functions.ts src/components/property/PropertyWorkspace.tsx src/routes/_authenticated/alertas.tsx src/routes/_authenticated/assistente.tsx src/routes/_authenticated/fluxos.tsx src/routes/_authenticated/integracoes.tsx src/routes/_authenticated/atendimento.tsx src/routes/_authenticated/settings/security.tsx tests/platform-buttons.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests/platform-buttons.test.ts
          git commit -m "Highlight real opportunities and complete product sweep"
          git push origin HEAD:main
