name: Harden CAIXA daily collector

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/harden-caixa-snapshot.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add per-state retries
        shell: python
        run: |
          from pathlib import Path
          path = Path(".github/workflows/snapshot-caixa-properties.yml")
          text = path.read_text(encoding="utf-8")
          text = text.replace("          import urllib.request\n          from datetime", "          import urllib.request\n          import time\n          from datetime")
          old = '''          url = f"https://venda-imoveis.caixa.gov.br/listaweb/Lista_imoveis_{state}.csv"
                    request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 MercadoImobi/1.0"})
                    with urllib.request.urlopen(request, timeout=30) as response:
                        text = response.read().decode("latin-1")
          '''
          new = '''          url = f"https://venda-imoveis.caixa.gov.br/listaweb/Lista_imoveis_{state}.csv"
                    request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 MercadoImobi/1.0"})
                    text = None
                    last_error = None
                    for attempt in range(4):
                        try:
                            with urllib.request.urlopen(request, timeout=30) as response:
                                candidate = response.read().decode("latin-1")
                            if "Lista de Imóveis da Caixa" not in candidate:
                                raise RuntimeError("Invalid CAIXA response")
                            text = candidate
                            break
                        except Exception as exc:
                            last_error = exc
                            if attempt < 3:
                                time.sleep(3 * (attempt + 1))
                    if text is None:
                        raise RuntimeError(f"CAIXA download failed for {state}: {last_error}")
          '''
          if old not in text:
              raise SystemExit("Download block not found; refusing unsafe patch")
          path.write_text(text.replace(old, new), encoding="utf-8")
      - name: Commit and rebase
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/snapshot-caixa-properties.yml
          git commit -m "Retry transient CAIXA state downloads"
          git pull --rebase origin main
          git push
