name: Apply public discovery parser improvement

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-public-discovery-parser-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python scripts/patch_public_discovery_parser.py
      - name: Commit improved crawler
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/public_property_discovery.py
          git commit -m "Improve public discovery extraction for builder pages"
          git push origin HEAD:main
