name: Fix mobile property search navigation

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix_mobile_search_nav.py"
      - ".github/workflows/fix-mobile-search-nav.yml"

permissions:
  contents: write

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/fix_mobile_search_nav.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write src/routes/_authenticated/dashboard.tsx
      - run: npm run lint
      - name: Build production application
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          VITE_SUPABASE_PROJECT_ID: placeholder
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
        run: |
          npm run build
          test -f .output/server/index.mjs
      - name: Commit validated mobile navigation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/dashboard.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Keep favorites and saved searches accessible on mobile"
          git stash push --include-untracked -m generated-build-files || true
          git pull --rebase origin main
          git push origin main
