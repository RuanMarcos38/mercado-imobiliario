name: MercadoImobi mandatory validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

concurrency:
  group: mercadoimobi-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify tracked files and high-confidence secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development|test)$'; then
            echo "Private environment file found in repository"
            exit 1
          fi
          if git grep -nEI '(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{30,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{20,})' -- ':!package-lock.json' ':!docs/**' ':!*.md'; then
            echo "High-confidence secret pattern found in tracked source"
            exit 1
          fi

      - name: Verify MercadoImobi is not bound to forbidden Supabase projects
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(uwzfgksmnqgaxtscwxow|iqrnytsgwaiegddfxfjs)' -- \
            'src/**' '.env.example' '.github/workflows/deploy-easypanel.yml'; then
            echo "MercadoImobi must not be bound to RM NEGOCIO IMOBILIARIO or CRM R2 MARKETING DIGITAL."
            exit 1
          fi

      - name: Verify source formatting
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Test all automated checks
        run: npm run test -- --passWithNoTests

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          unset VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID
          unset SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_PROJECT_ID SUPABASE_SERVICE_ROLE_KEY
          npm run build
          test -f .output/server/index.mjs

      - name: Smoke test backend
        shell: bash
        run: |
          set -euo pipefail
          unset VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID
          unset SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_PROJECT_ID SUPABASE_SERVICE_ROLE_KEY
          PORT=3000 HOST=127.0.0.1 NODE_ENV=production node .output/server/index.mjs > /tmp/mercadoimobi-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/public/status -o /tmp/status.json; then break; fi
            sleep 1
          done
          test -s /tmp/status.json || { cat /tmp/mercadoimobi-server.log || true; exit 1; }
          node - <<'NODE'
          const fs = require('fs');
          const status = JSON.parse(fs.readFileSync('/tmp/status.json', 'utf8'));
          const missingDatabase = status.database === 'not_configured' && status.search === 'unavailable';
          if (missingDatabase) {
            if (status.status !== 'degraded') throw new Error(`status=${status.status}`);
            process.exit(0);
          }
          if (status.status !== 'operational') throw new Error(`status=${status.status}`);
          NODE

      - name: Verify real production health before promotion
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EASYPANEL_PUBLIC_URL: ${{ vars.EASYPANEL_PUBLIC_URL }}
        shell: bash
        run: |
          set -euo pipefail
          CUSTOM="https://mercadoimobi.rdmconsultoriaimobiliaria.com.br"
          EASY="${EASYPANEL_PUBLIC_URL:-https://r2rmarketingdigital-mercadomobi.ke4n49.easypanel.host}"
          EASY="${EASY%/}"
          healthy=0
          for base in "$CUSTOM" "$EASY"; do
            body=/tmp/live-status.json
            if curl -fsS --connect-timeout 8 --max-time 20 "$base/api/public/status" -o "$body"; then
              if node - "$body" <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const forbidden=new Set(['uwzfgksmnqgaxtscwxow','iqrnytsgwaiegddfxfjs']);
          const project=String(p.supabaseProjectId || '');
          const ok=p.status==='operational'
            && p.search==='available'
            && project.length>0
            && !forbidden.has(project)
            && p.runtime?.supabaseAdmin==='configured'
            && Number.isFinite(p.indexedProperties) && p.indexedProperties>=1000
            && Number.isFinite(p.coveredStates) && p.coveredStates>=27;
          process.exit(ok ? 0 : 1);
          NODE
              then
                echo "MercadoImobi real healthcheck passed at $base"
                cat "$body"
                healthy=1
                break
              fi
            fi
          done
          if [ "$healthy" -ne 1 ]; then
            echo "::error::Production healthcheck failed or is using a forbidden Supabase project. Production promotion is blocked."
            exit 1
          fi

      - name: Promote validated main to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git fetch origin production
          git push --force-with-lease origin HEAD:refs/heads/production
