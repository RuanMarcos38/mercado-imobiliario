name: MercadoImobi mandatory validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

concurrency:
  group: mercadoimobi-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SUPABASE_PROJECT_ID: ${{ vars.MERCADOIMOBI_SUPABASE_PROJECT_ID }}
      LIVE_PUBLIC_URL: ${{ vars.EASYPANEL_PUBLIC_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify tracked files and high-confidence secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development|test)$'; then
            echo "Private environment file found in repository"
            exit 1
          fi
          if git grep -nEI '(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{30,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{20,})' -- ':!package-lock.json' ':!docs/**' ':!*.md'; then
            echo "High-confidence secret pattern found in tracked source"
            exit 1
          fi

      - name: Verify exclusive MercadoImobi Supabase binding
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPECTED_SUPABASE_PROJECT_ID:-}" || {
            echo "::error::Repository variable MERCADOIMOBI_SUPABASE_PROJECT_ID is required."
            exit 1
          }
          case "$EXPECTED_SUPABASE_PROJECT_ID" in
            uwzfgksmnqgaxtscwxow|iqrnytsgwaiegddfxfjs)
              echo "::error::MercadoImobi must use its exclusive Supabase project, never RM NEGOCIO IMOBILIARIO or CRM R2 MARKETING DIGITAL."
              exit 1
              ;;
          esac
          if git grep -nE 'uwzfgksmnqgaxtscwxow|iqrnytsgwaiegddfxfjs' -- \
            '.env.example' 'supabase/config.toml' '.github/workflows/*.yml' 'src/integrations/supabase/*.ts'; then
            echo "::error::Forbidden Supabase project reference found in deployment/runtime configuration."
            exit 1
          fi

      - name: Verify source formatting
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Test all automated checks
        run: npm run test -- --passWithNoTests

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        shell: bash
        env:
          VITE_SUPABASE_URL: https://${{ vars.MERCADOIMOBI_SUPABASE_PROJECT_ID }}.supabase.co
          VITE_SUPABASE_PROJECT_ID: ${{ vars.MERCADOIMOBI_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MERCADOIMOBI_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "${VITE_SUPABASE_PUBLISHABLE_KEY:-}" || { echo "::error::MERCADOIMOBI_SUPABASE_PUBLISHABLE_KEY is required."; exit 1; }
          npm run build
          test -f .output/server/index.mjs

      - name: Smoke test backend
        shell: bash
        env:
          VITE_SUPABASE_URL: https://${{ vars.MERCADOIMOBI_SUPABASE_PROJECT_ID }}.supabase.co
          VITE_SUPABASE_PROJECT_ID: ${{ vars.MERCADOIMOBI_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MERCADOIMOBI_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          PORT=3000 HOST=127.0.0.1 NODE_ENV=production node .output/server/index.mjs > /tmp/mercadoimobi-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/public/status -o /tmp/status.json; then break; fi
            sleep 1
          done
          test -s /tmp/status.json || { cat /tmp/mercadoimobi-server.log || true; exit 1; }
          EXPECTED_SUPABASE_PROJECT_ID="$EXPECTED_SUPABASE_PROJECT_ID" node - <<'NODE'
          const fs = require('fs');
          const status = JSON.parse(fs.readFileSync('/tmp/status.json', 'utf8'));
          const expected = String(process.env.EXPECTED_SUPABASE_PROJECT_ID || '');
          if (String(status.supabaseProjectId || '') !== expected) throw new Error(`project=${status.supabaseProjectId || 'missing'}`);
          if (!['operational','degraded'].includes(status.status)) throw new Error(`status=${status.status}`);
          NODE

      - name: Real production healthcheck
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_URL="${LIVE_PUBLIC_URL:-https://r2rmarketingdigital-mercadomobi.ke4n49.easypanel.host}"
          PUBLIC_URL="${PUBLIC_URL%/}"
          STATUS_URL="$PUBLIC_URL/api/public/status"
          curl -fsS --connect-timeout 8 --max-time 20 "$STATUS_URL" -o /tmp/live-status.json
          EXPECTED_SUPABASE_PROJECT_ID="$EXPECTED_SUPABASE_PROJECT_ID" node - <<'NODE'
          const fs = require('fs');
          const status = JSON.parse(fs.readFileSync('/tmp/live-status.json', 'utf8'));
          const expected = String(process.env.EXPECTED_SUPABASE_PROJECT_ID || '');
          const project = String(status.supabaseProjectId || '');
          if (project !== expected) throw new Error(`live project=${project || 'missing'}, expected=${expected}`);
          if (status.status !== 'operational') throw new Error(`live status=${status.status}`);
          if (status.search !== 'available') throw new Error(`live search=${status.search}`);
          if (status.runtime?.supabaseAdmin !== 'configured') throw new Error('live Supabase admin runtime is not configured');
          if (!Number.isFinite(status.indexedProperties) || status.indexedProperties < 1000) throw new Error(`indexedProperties=${status.indexedProperties}`);
          if (!Number.isFinite(status.coveredStates) || status.coveredStates < 27) throw new Error(`coveredStates=${status.coveredStates}`);
          NODE

      - name: Promote validated main to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git fetch origin production
          git push --force-with-lease origin HEAD:refs/heads/production
