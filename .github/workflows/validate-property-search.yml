name: MercadoImobi mandatory validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

concurrency:
  group: mercadoimobi-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify no private environment file is tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development|test)$'; then
            echo "Private environment file found in repository"
            exit 1
          fi

      - name: Normalize source formatting
        run: npx prettier --write .

      - name: Lint
        run: npm run lint

      - name: Test all automated checks
        run: npm run test -- --passWithNoTests

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build without EasyPanel Supabase environment variables
        shell: bash
        run: |
          set -euo pipefail
          unset VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID
          unset SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_PROJECT_ID SUPABASE_SERVICE_ROLE_KEY
          npm run build
          test -f .output/server/index.mjs

      - name: Smoke test backend and real search index
        shell: bash
        run: |
          set -euo pipefail
          unset VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID
          unset SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_PROJECT_ID SUPABASE_SERVICE_ROLE_KEY
          PORT=3000 HOST=127.0.0.1 NODE_ENV=production node .output/server/index.mjs > /tmp/mercadoimobi-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/public/status -o /tmp/status.json; then
              break
            fi
            sleep 1
          done

          cat /tmp/status.json
          node - <<'NODE'
          const fs = require('fs');
          const status = JSON.parse(fs.readFileSync('/tmp/status.json', 'utf8'));
          if (status.status !== 'operational') throw new Error(`status=${status.status}`);
          if (status.search !== 'available') throw new Error(`search=${status.search}`);
          if (!Number.isFinite(status.indexedProperties) || status.indexedProperties < 1000) {
            throw new Error(`indexedProperties=${status.indexedProperties}`);
          }
          if (!Number.isFinite(status.coveredStates) || status.coveredStates < 27) {
            throw new Error(`coveredStates=${status.coveredStates}`);
          }
          NODE

      - name: Promote validated main to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git push --force-with-lease origin HEAD:refs/heads/production

      - name: Diagnose public routing and EasyPanel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          EASYPANEL_PUBLIC_URL: ${{ vars.EASYPANEL_PUBLIC_URL }}
        shell: bash
        run: |
          set -uo pipefail
          CUSTOM="https://mercadoimobi.rdmconsultoriaimobiliaria.com.br"
          EASY="${EASYPANEL_PUBLIC_URL:-https://r2rmarketingdigital-mercadoimobi.ke4n49.easypanel.host}"
          EASY="${EASY%/}"

          inspect() {
            local label="$1" base="$2" body="/tmp/${1}.body"
            echo "===== $label: $base ====="
            if ! curl -sS --connect-timeout 8 --max-time 15 "$base/api/public/status" -o "$body"; then
              echo "::warning::$label não respondeu."
              return 2
            fi
            if grep -qi 'mercado-imobiliario-r2r\.lovable\.app' "$body"; then
              echo "::warning::$label está servindo o redirect antigo Hostinger -> Lovable."
              return 3
            fi
            if node - "$body" <<'NODE'
          const fs=require('fs');
          const file=process.argv[2];
          const p=JSON.parse(fs.readFileSync(file,'utf8'));
          if(p.status!=='operational') process.exit(2);
          console.log(`release=${p.release||'sem-marcador'}`);
          console.log(`indexed=${p.indexedProperties||0}`);
          console.log(`sync=${p.synchronization?.state||'unknown'} age=${p.synchronization?.ageMinutes??'n/a'}min`);
          console.log(`ai=${p.runtime?.ai||'unknown'} whatsapp=${p.runtime?.whatsapp||'unknown'}`);
          NODE
            then
              echo "$label está servindo o backend MercadoImobi."
              return 0
            fi
            echo "::warning::$label respondeu, mas não é o backend MercadoImobi esperado."
            head -c 500 "$body" || true
            echo
            return 4
          }

          custom_rc=0; easy_rc=0
          inspect custom "$CUSTOM" || custom_rc=$?
          inspect easypanel "$EASY" || easy_rc=$?
          echo "custom_result=$custom_rc easypanel_result=$easy_rc"
          if [ "$custom_rc" -eq 3 ]; then
            echo "::warning::O domínio definitivo ainda está preso no arquivo estático antigo da Hostinger e não entrega o app atualizado do GitHub."
          fi
          if [ "$easy_rc" -eq 0 ] && [ "$custom_rc" -ne 0 ]; then
            echo "::warning::O app novo está no EasyPanel; falta apenas encaminhar o domínio definitivo para esse serviço e remover o redirect antigo."
          fi
          exit 0
