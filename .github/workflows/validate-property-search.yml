name: MercadoImobi mandatory validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

concurrency:
  group: mercadoimobi-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Apply controlled urgent search/presence patch
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'fix/urgent-search-presence')
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-urgent-search-presence.py')
          text = p.read_text()
          needle = '''replace_once(
              "src/lib/property-search.functions.ts",
              "    const items = sortItems(Array.from(deduped.values()), input.sort).slice(0, limit);",'''
          if needle in text:
              start = text.index(needle)
              end = text.index('\n\n# 3) Auditor:', start)
              text = text[:start] + "# Priorização de mercado já existe em sortItems(..., input.market)." + text[end:]
              p.write_text(text)
          PY
          python scripts/apply-urgent-search-presence.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify tracked files and high-confidence secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development|test)$'; then
            echo "Private environment file found in repository"
            exit 1
          fi
          if git grep -nEI '(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{30,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{20,})' -- ':!package-lock.json' ':!docs/**' ':!*.md'; then
            echo "High-confidence secret pattern found in tracked source"
            exit 1
          fi

      - name: Verify source formatting
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Test all automated checks
        run: npm run test -- --passWithNoTests

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build without EasyPanel Supabase environment variables
        shell: bash
        run: |
          set -euo pipefail
          unset VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID
          unset SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_PROJECT_ID SUPABASE_SERVICE_ROLE_KEY
          npm run build
          test -f .output/server/index.mjs

      - name: Smoke test backend and optional search index
        shell: bash
        run: |
          set -euo pipefail
          unset VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID
          unset SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_PROJECT_ID SUPABASE_SERVICE_ROLE_KEY
          PORT=3000 HOST=127.0.0.1 NODE_ENV=production node .output/server/index.mjs > /tmp/mercadoimobi-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/public/status -o /tmp/status.json; then
              break
            fi
            sleep 1
          done

          if [ ! -s /tmp/status.json ]; then
            cat /tmp/mercadoimobi-server.log || true
            echo "Backend status endpoint did not become healthy"
            exit 1
          fi

          cat /tmp/status.json
          node - <<'NODE'
          const fs = require('fs');
          const status = JSON.parse(fs.readFileSync('/tmp/status.json', 'utf8'));
          const missingDatabase = status.database === 'not_configured' && status.search === 'unavailable';
          if (missingDatabase) {
            if (status.status !== 'degraded') throw new Error(`status=${status.status}`);
            if (status.indexedProperties !== 0) throw new Error(`indexedProperties=${status.indexedProperties}`);
            if (status.coveredStates !== 0) throw new Error(`coveredStates=${status.coveredStates}`);
            process.exit(0);
          }
          if (status.status !== 'operational') throw new Error(`status=${status.status}`);
          if (status.search === 'available') {
            if (!Number.isFinite(status.indexedProperties) || status.indexedProperties < 1000) {
              throw new Error(`indexedProperties=${status.indexedProperties}`);
            }
            if (!Number.isFinite(status.coveredStates) || status.coveredStates < 27) {
              throw new Error(`coveredStates=${status.coveredStates}`);
            }
          }
          NODE

      - name: Commit validated controlled PR patch
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'fix/urgent-search-presence')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/property/PropertyWorkspace.tsx \
            src/lib/property-search.functions.ts \
            src/lib/backend-auditor.functions.ts \
            src/routes/_authenticated.tsx \
            src/routes/_authenticated/admin/usuarios.tsx \
            src/lib/user-activity.functions.ts
          if git diff --cached --quiet; then
            echo "Controlled patch already present and validated."
            exit 0
          fi
          git commit -m "feat: busca 100 por pagina, diversidade regional e usuarios online"
          git push origin HEAD:refs/heads/${{ github.head_ref }}

      - name: Real production healthcheck before promotion
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EASYPANEL_PUBLIC_URL: ${{ vars.EASYPANEL_PUBLIC_URL }}
        shell: bash
        run: |
          set -euo pipefail
          CUSTOM="https://mercadoimobi.rdmconsultoriaimobiliaria.com.br"
          EASY="${EASYPANEL_PUBLIC_URL:-https://r2rmarketingdigital-mercadoimobi.ke4n49.easypanel.host}"
          EASY="${EASY%/}"
          healthy=0
          for base in "$CUSTOM" "$EASY"; do
            body=/tmp/live-status.json
            if curl -fsS --connect-timeout 8 --max-time 20 "$base/api/public/status" -o "$body"; then
              if node - "$body" <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const ok=p.status==='operational'
            && p.search==='available'
            && Number.isFinite(p.indexedProperties) && p.indexedProperties>=1000
            && Number.isFinite(p.coveredStates) && p.coveredStates>=27;
          process.exit(ok ? 0 : 1);
          NODE
              then
                echo "Real MercadoImobi healthcheck passed at $base"
                cat "$body"
                healthy=1
                break
              fi
            fi
          done
          if [ "$healthy" -ne 1 ]; then
            echo "No real MercadoImobi endpoint passed the mandatory healthcheck; production promotion is blocked."
            exit 1
          fi

      - name: Promote validated main to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git push --force-with-lease origin HEAD:refs/heads/production

      - name: Record public routing diagnostics
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          EASYPANEL_PUBLIC_URL: ${{ vars.EASYPANEL_PUBLIC_URL }}
        shell: bash
        run: |
          set -uo pipefail
          CUSTOM="https://mercadoimobi.rdmconsultoriaimobiliaria.com.br"
          EASY="${EASYPANEL_PUBLIC_URL:-https://r2rmarketingdigital-mercadoimobi.ke4n49.easypanel.host}"
          for base in "$CUSTOM" "${EASY%/}"; do
            echo "===== $base ====="
            curl -sS --connect-timeout 8 --max-time 15 "$base/api/public/status" | head -c 1000 || true
            echo
          done
