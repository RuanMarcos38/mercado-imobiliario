name: Promote validated Google Places partner search fix

on:
  push:
    branches:
      - ops/promote-google-places-20260825

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact validated product diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin production fix/google-places-partner-search-20260825
          changed="$(git diff --name-only origin/production..origin/fix/google-places-partner-search-20260825 | sort)"
          test "$changed" = "src/lib/partner-search.functions.ts" || { echo "Unexpected diff:"; echo "$changed"; exit 1; }
          git show origin/fix/google-places-partner-search-20260825:src/lib/partner-search.functions.ts | grep -F 'function googlePlacesQueries' >/dev/null
          git show origin/fix/google-places-partner-search-20260825:src/lib/partner-search.functions.ts | grep -F 'googlePlaces: Boolean(googleKey) && google.operational === true' >/dev/null
          git show origin/fix/google-places-partner-search-20260825:src/lib/partner-search.functions.ts | grep -F 'Google Places recusou a consulta (403)' >/dev/null
          git merge-base --is-ancestor origin/production origin/fix/google-places-partner-search-20260825
      - name: Promote as GitHub Actions bot
        shell: bash
        run: |
          set -euo pipefail
          git push origin origin/fix/google-places-partner-search-20260825:refs/heads/production
