name: Finish database favorites UI

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-dashboard-favorites.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire persisted favorites and saved search controls
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/routes/_authenticated/dashboard.tsx')
          s = p.read_text(encoding='utf-8')

          saved = '''  const savedSearches = useQuery({
            queryKey: ["saved-property-searches", user?.id],
            queryFn: () => listSavedFn(),
            enabled: Boolean(user),
          });
          '''
          favorite_query = '''
          const favoriteProperties = useQuery({
            queryKey: ["property-favorites", user?.id],
            queryFn: () => listFavoritesFn(),
            enabled: Boolean(user),
          });
          '''
          if 'const favoriteProperties = useQuery' not in s:
              if saved not in s:
                  raise SystemExit('savedSearches block not found')
              s = s.replace(saved, saved + favorite_query, 1)

          old_effect = '''  useEffect(() => {
            try {
              const raw = window.localStorage.getItem("mercadoimobi:favorites");
              if (raw) setFavorites(new Set(JSON.parse(raw)));
            } catch {
              setFavorites(new Set());
            }
          }, []);
          '''
          new_effect = '''  useEffect(() => {
            if (favoriteProperties.data) {
              setFavorites(new Set(favoriteProperties.data.map((item) => item.key)));
            }
          }, [favoriteProperties.data]);
          '''
          if old_effect in s:
              s = s.replace(old_effect, new_effect, 1)

          old_toggle = '''  const toggleFavorite = (id: string) => {
            const next = new Set(favorites);
            if (next.has(id)) next.delete(id);
            else next.add(id);
            setFavorites(next);
            window.localStorage.setItem("mercadoimobi:favorites", JSON.stringify(Array.from(next)));
          };
          '''
          new_toggle = '''  const toggleFavorite = async (property: PropertySearchItem) => {
            const key = getPropertyKey(property);
            const nextFavorite = !favorites.has(key);
            const previous = new Set(favorites);
            const optimistic = new Set(favorites);
            if (nextFavorite) optimistic.add(key);
            else optimistic.delete(key);
            setFavorites(optimistic);

            try {
              await setFavoriteFn({ data: { property, favorite: nextFavorite } });
              await favoriteProperties.refetch();
              toast.success(
                nextFavorite ? "Imóvel salvo nos favoritos." : "Imóvel removido dos favoritos.",
              );
            } catch {
              setFavorites(previous);
              toast.error("Não foi possível atualizar seus favoritos agora.");
            }
          };
          '''
          if old_toggle in s:
              s = s.replace(old_toggle, new_toggle, 1)

          old_nav = '''            <button
              onClick={() =>
                document.getElementById("resultados")?.scrollIntoView({ behavior: "smooth" })
              }
              className="transition hover:text-white"
            >
              Favoritos ({favorites.size})
            </button>
          '''
          new_nav = '''            <button
              onClick={() => setShowFavorites(true)}
              className="transition hover:text-white"
            >
              Favoritos ({favorites.size})
            </button>
          '''
          if old_nav in s:
              s = s.replace(old_nav, new_nav, 1)

          old_saved = '''              {(savedSearches.data ?? []).map((saved) => (
                <button
                  key={saved.id}
                  onClick={() => applySavedSearch(saved.criteria)}
                  className="w-full rounded-2xl border border-white/10 bg-white/[0.03] p-4 text-left transition hover:border-cyan-300/30 hover:bg-cyan-300/[0.04]"
                >
                  <span className="font-semibold">{saved.name}</span>
                  <span className="mt-1 block text-xs text-slate-400">Abrir esta pesquisa</span>
                </button>
              ))}
          '''
          new_saved = '''              {(savedSearches.data ?? []).map((saved) => (
                <div
                  key={saved.id}
                  className="rounded-2xl border border-white/10 bg-white/[0.03] p-4 transition hover:border-cyan-300/30 hover:bg-cyan-300/[0.04]"
                >
                  <button onClick={() => applySavedSearch(saved.criteria)} className="w-full text-left">
                    <span className="font-semibold">{saved.name}</span>
                    <span className="mt-1 block text-xs text-slate-400">Abrir esta pesquisa</span>
                  </button>
                  <div className="mt-3 flex gap-2 border-t border-white/10 pt-3">
                    <button
                      onClick={() => void handleRenameSavedSearch(saved.id, saved.name)}
                      className="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-slate-300 hover:bg-white/5"
                    >
                      <Pencil className="h-3.5 w-3.5" /> Renomear
                    </button>
                    <button
                      onClick={() => void handleDeleteSavedSearch(saved.id, saved.name)}
                      className="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-rose-200 hover:bg-rose-400/10"
                    >
                      <Trash2 className="h-3.5 w-3.5" /> Excluir
                    </button>
                  </div>
                </div>
              ))}
          '''
          if old_saved in s:
              s = s.replace(old_saved, new_saved, 1)

          old_card = '''                  favorite={favorites.has(property.id)}
                  comparing={compareIds.includes(property.id)}
                  onFavorite={() => toggleFavorite(property.id)}
          '''
          new_card = '''                  favorite={favorites.has(getPropertyKey(property))}
                  comparing={compareIds.includes(property.id)}
                  onFavorite={() => void toggleFavorite(property)}
          '''
          if old_card in s:
              s = s.replace(old_card, new_card, 1)

          if 'window.localStorage.getItem("mercadoimobi:favorites")' in s:
              raise SystemExit('legacy localStorage favorites still present')
          if 'const favoriteProperties = useQuery' not in s:
              raise SystemExit('favorite query was not installed')
          if 'onClick={() => setShowFavorites(true)}' not in s:
              raise SystemExit('favorites navigation was not installed')
          if 'onFavorite={() => void toggleFavorite(property)}' not in s:
              raise SystemExit('property card favorite handler was not installed')

          p.write_text(s, encoding='utf-8')

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund
      - run: npx prettier --write src/routes/_authenticated/dashboard.tsx
      - run: npm run lint
      - name: Build production application
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          VITE_SUPABASE_PROJECT_ID: placeholder
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
        run: |
          npm run build
          test -f .output/server/index.mjs

      - name: Commit validated dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/dashboard.tsx
          git commit -m "Wire favorites and saved search controls to database"
          git stash push --include-untracked -m generated || true
          git pull --rebase origin main
          git push origin main
