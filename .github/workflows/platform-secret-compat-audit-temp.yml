name: Platform secret compatibility audit TEMP

on:
  push:
    branches: [fix/platform-completion-20260826]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://r2rmarketingdigital-mercadomobi.ke4n49.easypanel.host
      PROPERTY_DISCOVERY_SECRET: ${{ secrets.PROPERTY_DISCOVERY_SECRET }}
      PROPERTY_FEED_SYNC_SECRET: ${{ secrets.PROPERTY_FEED_SYNC_SECRET }}
      PROPERTY_IMPORT_WEBHOOK_SECRET: ${{ secrets.PROPERTY_IMPORT_WEBHOOK_SECRET }}
      N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
      CRM_AUTOMATION_JOB_SECRET: ${{ secrets.CRM_AUTOMATION_JOB_SECRET }}
      MERCADOIMOBI_BASE_URL: ${{ secrets.MERCADOIMOBI_BASE_URL }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
      EASYPANEL_DEPLOY_TRIGGER_URL: ${{ secrets.EASYPANEL_DEPLOY_TRIGGER_URL }}
      DEPLOY_TRIGGER_URL: ${{ secrets.DEPLOY_TRIGGER_URL }}
    steps:
      - name: Audit presence and live compatibility
        shell: bash
        run: |
          set +e
          present(){ if [ -n "${!1:-}" ]; then echo "$1=SET"; else echo "$1=MISSING"; fi; }
          for K in PROPERTY_DISCOVERY_SECRET PROPERTY_FEED_SYNC_SECRET PROPERTY_IMPORT_WEBHOOK_SECRET N8N_WEBHOOK_SECRET CRM_AUTOMATION_JOB_SECRET MERCADOIMOBI_BASE_URL GOOGLE_MAPS_API_KEY GOOGLE_PLACES_API_KEY YOUTUBE_API_KEY EASYPANEL_DEPLOY_URL EASYPANEL_DEPLOY_TRIGGER_URL DEPLOY_TRIGGER_URL; do present "$K"; done
          echo '--- live auth compatibility ---'
          test_post(){
            label="$1"; path="$2"; header="$3"; key="$4";
            if [ -z "$key" ]; then echo "$label=SKIP_MISSING"; return; fi
            code=$(curl -ksS -o /tmp/body -w '%{http_code}' -X POST -H "$header: $key" "$BASE/$path")
            echo "$label=HTTP_$code"
          }
          test_post discovery api/public/jobs/property-discovery x-discovery-key "${PROPERTY_DISCOVERY_SECRET:-}"
          test_post feeds api/public/jobs/property-feeds x-property-feed-sync-key "${PROPERTY_FEED_SYNC_SECRET:-}"
          test_post crm api/public/jobs/crm-automations x-mercadoimobi-job-key "${CRM_AUTOMATION_JOB_SECRET:-}"
          if [ -n "${PROPERTY_IMPORT_WEBHOOK_SECRET:-}" ]; then
            code=$(curl -ksS -o /tmp/body -w '%{http_code}' -X POST -H 'content-type: application/json' -H "x-property-import-key: ${PROPERTY_IMPORT_WEBHOOK_SECRET}" --data '{}' "$BASE/api/public/hooks/properties")
            echo "property_import=HTTP_$code"
          else echo 'property_import=SKIP_MISSING'; fi
          if [ -n "${N8N_WEBHOOK_SECRET:-}" ]; then
            code=$(curl -ksS -o /tmp/body -w '%{http_code}' -X POST -H 'content-type: application/json' -H "x-n8n-api-key: ${N8N_WEBHOOK_SECRET}" --data '{}' "$BASE/api/public/hooks/n8n-webhook")
            echo "n8n=HTTP_$code"
          else echo 'n8n=SKIP_MISSING'; fi
