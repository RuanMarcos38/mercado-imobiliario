name: Format Meta WhatsApp profile branch

on:
  push:
    branches:
      - feat/meta-whatsapp-business-profile

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/meta-whatsapp-business-profile

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Format changed source
        run: |
          npx prettier --write             src/lib/meta-whatsapp.server.ts             src/lib/whatsapp-connection.functions.ts             src/routes/_authenticated/central-integracoes.tsx             tests/meta-whatsapp-business-profile.test.ts

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/lib/meta-whatsapp.server.ts             src/lib/whatsapp-connection.functions.ts             src/routes/_authenticated/central-integracoes.tsx             tests/meta-whatsapp-business-profile.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Meta WhatsApp business profile changes"
          git push origin HEAD:feat/meta-whatsapp-business-profile
