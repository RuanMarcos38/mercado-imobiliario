name: Fix exact template workflow

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-exact-template-workflow.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix CSS multiline serialization
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/apply-exact-lovable-template.yml')
          text = path.read_text(encoding='utf-8')
          old = "text += r'''\\n\\n/* LOVABLE_EXACT_TEMPLATE_V2 */"
          new = "text += '''\\n\\n/* LOVABLE_EXACT_TEMPLATE_V2 */"
          if old not in text:
              raise SystemExit('Target serialization line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit workflow repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-exact-lovable-template.yml
          git commit -m "Fix exact template workflow CSS serialization"
          git push origin HEAD:main
