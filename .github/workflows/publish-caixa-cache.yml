name: Publish validated CAIXA cache

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-caixa-cache.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated national snapshot
        uses: actions/download-artifact@v4
        with:
          name: caixa-properties
          path: validated
          repository: RuanMarcos38/mercado-imobiliario
          run-id: 31861822810
          github-token: ${{ github.token }}

      - name: Publish immutable latest-cache branch
        shell: bash
        run: |
          set -euo pipefail
          test -s validated/caixa-properties.json
          cp validated/caixa-properties.json /tmp/caixa-properties.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan data-cache
          git rm -rf . || true
          cp /tmp/caixa-properties.json caixa-properties.json
          git add caixa-properties.json
          git commit -m "Publish validated official CAIXA property snapshot"
          git push --force origin data-cache
