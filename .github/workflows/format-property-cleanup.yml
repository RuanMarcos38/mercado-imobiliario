name: Format property cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: format-property-cleanup
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/lib/property-listing-quality.ts tests/platform-buttons.test.ts tests/property-listing-quality.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "RuanMarcos38"
          git config user.email "ruanessencia8@gmail.com"
          git add src/lib/property-listing-quality.ts tests/platform-buttons.test.ts tests/property-listing-quality.test.ts
          git commit -m "chore: format property cleanup"
          git push origin HEAD:main
