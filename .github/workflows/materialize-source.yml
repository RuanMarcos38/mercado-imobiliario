name: Materialize Casa Conectada source

on:
  push:
    branches: [main]
    paths:
      - "source.ready"
      - ".github/workflows/materialize-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and decode source archive
        shell: bash
        run: |
          set -euo pipefail
          test -d source.min.parts
          cat source.min.parts/part-* > source.tar.xz.b64
          base64 -d source.tar.xz.b64 > source.tar.xz
          tar -xJf source.tar.xz
          rm -rf source.parts source.min.parts source.ready source.tar.xz source.tar.xz.b64

      - name: Verify no environment secrets were materialized
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .env ]; then
            echo "Refusing to commit .env"
            exit 1
          fi
          if find . -maxdepth 2 -type f -name '.env' | grep -q .; then
            echo "Refusing to commit an .env file"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run local-safe test suite
        run: npm run test -- --exclude tests/tenant-isolation.test.ts --exclude tests/critical-flows.spec.ts --passWithNoTests

      - name: Build production server
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          VITE_SUPABASE_PROJECT_ID: placeholder
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
        run: |
          npm run build
          test -f .output/server/index.mjs

      - name: Format production source
        run: npx prettier --write src

      - name: Run lint
        run: npx eslint . --rule '@typescript-eslint/no-explicit-any:warn'

      - name: Commit validated project source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Deploy validated Casa Conectada source for EasyPanel"
          git push
