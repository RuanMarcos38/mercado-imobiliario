name: Materialize Casa Conectada source

on:
  push:
    branches: [main]
    paths:
      - "source.tar.gz.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode source archive
        shell: bash
        run: |
          set -euo pipefail
          base64 -d source.tar.gz.b64 > source.tar.gz
          tar -xzf source.tar.gz
          rm -f source.tar.gz source.tar.gz.b64

      - name: Verify no environment secrets were materialized
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .env ]; then
            echo "Refusing to commit .env"
            exit 1
          fi
          if git status --porcelain | grep -E '(^|/)(\.env)$' >/dev/null 2>&1; then
            echo "Refusing to commit .env"
            exit 1
          fi

      - name: Commit project source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Deploy Casa Conectada source for EasyPanel"
          git push
