name: Temporary format feature branch

on:
  push:
    branches: [feature/atendimento-suri-senior]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atendimento-suri-senior
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write .
      - name: Commit formatting only when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to format."
            exit 0
          fi
          git commit -m "chore: apply repository formatting"
          git push origin HEAD:feature/atendimento-suri-senior
