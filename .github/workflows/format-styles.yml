name: Format styles

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format stylesheet
        run: npx prettier --write src/styles.css

      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet -- src/styles.css; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add src/styles.css
          git commit -m "chore: format atendimento stylesheet"
          git push origin HEAD:main
