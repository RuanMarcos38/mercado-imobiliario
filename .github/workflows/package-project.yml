name: Package updated project

on:
  push:
    paths:
      - ".github/workflows/package-project.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          zip -qr mercado-imobiliario-atualizado.zip . \
            -x '.git/*' \
            -x '.env' \
            -x '.env.*' \
            -x 'node_modules/*' \
            -x 'dist/*' \
            -x '.output/*'

      - name: Upload project package
        uses: actions/upload-artifact@v4
        with:
          name: mercado-imobiliario-atualizado
          path: mercado-imobiliario-atualizado.zip
          retention-days: 1
